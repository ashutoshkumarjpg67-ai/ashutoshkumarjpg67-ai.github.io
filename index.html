    {"q": "न्यूटन के अनुसार प्रकाश का वेग :", "o": ["वायु की अपेक्षा जल में अधिक होता है", "वायु की अपेक्षा जल में कम होता है", "वायु तथा जल दोनों में समान होता है", "जल की अपेक्षा निर्वात् में अधिक होता है"], "a": 0, "eh": "न्यूटन के कणिका सिद्धान्त के अनुसार सघन माध्यम में कणों की चाल अधिक होती है — वायु की अपेक्षा जल में वेग अधिक। (यह पूर्वानुमान बाद में गलत सिद्ध हुआ।)", "ee": "Newton's corpuscular theory predicted that light travels faster in water than in air (later proved wrong)."},
    {"q": "प्रकाश के तरंग-गति सिद्धान्त के अनुसार प्रकाश के वर्ण-निर्णायक है :", "o": ["आयाम", "तरंग की चाल", "आवृत्ति", "तरंगदैर्घ्य"], "a": 2, "eh": "तरंग सिद्धान्त के अनुसार प्रकाश का वर्ण (रंग) उसकी आवृत्ति से निर्धारित होता है।", "ee": "In the wave theory, colour is determined by frequency."},
    {"q": "निम्नलिखित में कौन संबंध द्रव्यमान और ऊर्जा के लिए सही है ?", "o": ["m = E", "m² = E", "mc² = E", "m = √E/2"], "a": 2, "y": "BSEB 2022 (A)", "eh": "आइन्स्टीन का द्रव्यमान-ऊर्जा सम्बन्ध E = mc² है।", "ee": "Einstein's mass-energy relation is E = mc²."},
    {"q": "द्वितीयक तरंगिकाओं की अवधारणा दी थी :", "o": ["फ्रेनेल ने", "न्यूटन ने", "हाइगेन्स ने", "मैक्सवैल ने"], "a": 2, "y": "BSEB 2023 (A)", "eh": "द्वितीयक तरंगिकाओं की अवधारणा हाइगेन्स ने दी थी; फ्रेनेल ने उसे आगे विकसित किया।", "ee": "The concept of secondary wavelets is due to Huygens (later developed by Fresnel)."},
    {"q": "किसी बिन्दुवत स्रोत से परिमित दूरी पर तरंगाग्र होता है :", "o": ["गोलाकार", "बेलनाकार", "समतल", "वृत्ताकार"], "a": 0, "y": "BSEB 2019 (A)", "eh": "बिन्दुवत स्रोत से निकलने वाली तरंगों का तरंगाग्र गोलाकार होता है।", "ee": "A point source produces spherical wavefronts."},
    {"q": "दो उन तरंगों के व्यतिकरण से उत्पन्न अधिकतम परिणामी आयाम का मान होगा, जिसे प्रकट किया जाता है : y₁ = 4 sin ωt, y₂ = 3 cos ωt", "o": ["7", "5", "1", "25"], "a": 1, "y": "BSEB 2018 (A), 2023 (A)", "eh": "दोनों तरंगों में π/2 का कलान्तर है; परिणामी आयाम A = √(4² + 3²) = 5।", "ee": "The two waves differ in phase by 90°, so A = √(4² + 3²) = 5."},
    {"q": "तरंग का कलांतर φ का पथांतर Δx से संबन्ध है :", "o": ["(λ/π)φ", "(π/λ)φ", "(λ/2π)φ", "(2π/λ)φ"], "a": 2, "y": "BSEB 2018 (A)", "eh": "पथान्तर Δx = (λ/2π)·φ होता है।", "ee": "Path difference Δx = (λ/2π) × phase difference φ."},
    {"q": "निम्नलिखित में से कौन-सा कथन सही है ?", "o": ["लॉयड मिरर एक्सपेरीमेंट में सेन्ट्रल ब्राइट फ्रिंज गायब होता है।", "इनकोहेरेन्ट स्रोतों से भी सस्टेन्ड इंटरफेयरेन्स (व्यतिकरण) प्राप्त किया जा सकता है।", "कन्स्ट्रक्टिव इंटरफेयरेन्स के लिए पर्दे के उस बिन्दु पर दोनों वेव्स के बीच का पथांतर λ/2 का विषम गुणक होना चाहिए।", "ऊपर के सभी कथन सत्य है।"], "a": 0, "y": "BSEB 2018 (C)", "eh": "लॉयड मिरर प्रयोग में परावर्तन पर π कलान्तर आने से केन्द्रीय फ्रिन्ज गायब हो जाती है; शेष कथन असत्य हैं।", "ee": "In Lloyd's mirror the central fringe vanishes due to a π phase change on reflection; the other statements are false."},
    {"q": "यंग के द्विछिद्र प्रयोग में छिद्रों की चौड़ाई तथा पर्दे से छिद्रों की दूरी दोनों दुगनी कर दी जाती है, तो फ्रिज की चौड़ाई :", "o": ["बढ़ जायेगी", "घट जायेगी", "अपरिवर्तित रहेगी", "इनमें से कोई नहीं"], "a": 2, "y": "BSEB 2018 (C)", "eh": "β = λD/d; D व d दोनों दुगने करने पर β अपरिवर्तित रहती है।", "ee": "Doubling both D and d leaves β = λD/d unchanged."},
    {"q": "किरचॉफ का द्वितीय नियम है :", "o": ["आवेश संरक्षण नियम", "ऊर्जा संरक्षण नियम", "संवेग संरक्षण नियम", "कोणीय संवेग संरक्षण नियम"], "a": 1, "y": "BSEB 2017 (C)", "eh": "किरचॉफ का द्वितीय (पाश) नियम ऊर्जा संरक्षण पर आधारित है — बंद पाश में विभव-परिवर्तनों का बीजीय योग शून्य होता है।", "ee": "Kirchhoff's second (loop) law is based on conservation of energy."},
    {"q": "एक पतले फिल्म के रंग का कारण है :", "o": ["प्रकीर्णन", "व्यतिकरण", "वर्ण-विक्षेपण", "विवर्तन"], "a": 1, "y": "BSEB 2015", "eh": "पतली फिल्म के रंग उसकी दो सतहों से परावर्तित प्रकाश के व्यतिकरण से बनते हैं।", "ee": "Thin-film colours are due to interference between light reflected from its two surfaces."},
    {"q": "निर्वात से 6000 Å तरंगदैर्घ्य का एकवर्णीय प्रकाश 1.5 अपवर्तनांक वाले एक माध्यम में प्रवेश करता है। इस माध्यम में इसका तरंगदैर्घ्य होगा :", "o": ["4000 Å", "4500 Å", "6000 Å", "9000 Å"], "a": 0, "y": "BSEB 2012", "eh": "माध्यम में तरंगदैर्घ्य λ' = λ/μ = 6000/1.5 = 4000 Å।", "ee": "Wavelength in the medium = 6000/1.5 = 4000 Å."},
    {"q": "यंग के प्रयोग में यदि प्रकाश की तरंगदैर्घ्य दुगनी कर दी जाए, तो फ्रिज की चौड़ाई :", "o": ["वही रहेगी", "दुगनी हो जाएगी", "चार गुनी हो जाएगी", "आधी रह जाएगी"], "a": 1, "eh": "β = λD/d ∝ λ; तरंगदैर्घ्य दुगनी करने से फ्रिन्ज चौड़ाई दुगनी हो जाएगी।", "ee": "Fringe width β ∝ λ, so doubling the wavelength doubles the fringe width."},
    {"q": "दो कला-संबद्ध स्रोतों के कारण प्रकाश के व्यतिकरण में फ्रिज की चौड़ाई होती है :", "o": ["तरंगदैर्घ्य के अनुक्रमानुपाती/समानुपाती", "तरंगदैर्घ्य के व्युत्क्रमानुपाती", "तरंगदैर्घ्य के वर्ग के अनुक्रमानुपाती", "तरंगदैर्घ्य के वर्ग के व्युत्क्रमानुपाती"], "a": 0, "y": "BSEB 2024 (A)", "eh": "β = λD/d से फ्रिन्ज चौड़ाई तरंगदैर्घ्य के समानुपाती (अनुक्रमानुपाती) होती है।", "ee": "β = λD/d — fringe width is directly proportional to wavelength."},
    {"q": "तीक्ष्ण सीधी कोर से प्राप्त विवर्तन फ्रिजें :", "o": ["समान चौड़ाई की होती है", "समान चौड़ाई की नहीं होती है", "ज्यामितीय छाया में बनती है", "इनमेंसे कोई भी कथन सत्य नहीं है"], "a": 1, "eh": "तीक्ष्ण सीधी कोर से बनी विवर्तन फ्रिन्जें समान चौड़ाई की नहीं होती हैं।", "ee": "Diffraction fringes from a straight edge are of unequal width."},
    {"q": "स्वस्थ आँख की विभेदन सीमा होती है :", "o": ["1'", "1\"", "1°", "0.5°"], "a": 0, "eh": "स्वस्थ आँख की विभेदन सीमा लगभग 1 मिनट (1') होती है।", "ee": "The limit of resolution of a healthy eye is about 1 arc-minute (1')."},
    {"q": "तरंगों के दो स्रोत कला-संबद्ध (coherent) कहे जाते हैं, यदि :", "o": ["दोनों से उत्पन्न तरंगाग्र समान आकृति के हों", "दोनों समान तरंगदैर्घ्य की तरंगें उत्पन्न करते हों", "दोनों समान वेग की तरंगें उत्पन्न करते हों", "दोनों समान तरंगदैर्घ्य की तरंगें, जिनमें नियत कलान्तर रहता है, उत्पन्न करते हों"], "a": 3, "eh": "कला-संबद्ध स्रोत समान तरंगदैर्घ्य की तरंगें नियत कलान्तर के साथ उत्पन्न करते हैं।", "ee": "Coherent sources emit waves of the same wavelength with a constant phase difference."},
    {"q": "प्रकाशिक पथ बराबर होता है :", "o": ["अपवर्तनांक × पथ-लम्बाई", "अपवर्तनांक / पथ-लम्बाई", "पथ-लम्बाई / अपवर्तनांक", "अपवर्तनांक × पथ-लम्बाई/2"], "a": 0, "y": "BSEB 2020 (A), 2022 (A)", "eh": "प्रकाशिक पथ = अपवर्तनांक × वास्तविक पथ-लम्बाई।", "ee": "Optical path = refractive index × path length."},
    {"q": "व्यतिकरण फ्रिज की चौड़ाई होती है :", "o": ["β = Dλ/d", "β = d/Dλ", "B = dλ/D", "B = d·Dλ"], "a": 0, "y": "BSEB 2020 (A)", "eh": "यंग के प्रयोग में फ्रिन्ज चौड़ाई β = Dλ/d होती है।", "ee": "Fringe width β = Dλ/d."},
    {"q": "दो तरंगें जिनकी तीव्रताओं का अनुपात 9 : 1 है, व्यतिकरण उत्पन्न करती है। अधिकतम तथा न्यूनतम तीव्रताओं का अनुपात होगा :", "o": ["10 : 8", "9 : 1", "4 : 1", "2 : 1"], "a": 2, "eh": "तीव्रता अनुपात 9:1 ⇒ आयाम अनुपात 3:1 ⇒ Imax/Imin = ((3+1)/(3−1))² = 4:1।", "ee": "Amplitude ratio is 3:1, so Imax/Imin = ((3+1)/(3−1))² = 4:1."},
    {"q": "यंग के द्वि-स्लिट प्रयोग में संपोषी व्यतिकरण उत्पन्न करने वाली तरंगों के बीच पथान्तर का मान नहीं होता है :", "o": ["nλ", "(n+1)λ", "(2n+1)λ", "(2n+1)λ/2"], "a": 3, "eh": "(2n+1)λ/2 पथान्तर पर विनाशी व्यतिकरण होता है, संपोषी नहीं — अतः यही वह मान है जो संपोषी के लिए नहीं होता।", "ee": "A path difference of (2n+1)λ/2 gives destructive interference, so it cannot be the value for constructive interference."},
    {"q": "तरंगदैर्घ्य λ की दो एकवर्णी प्रकाश-तरंगों के मध्य संपोषी व्यतिकरण हेतु पथान्तर होना चाहिए :", "o": ["nλ", "(2n−1)λ/2", "n − λ", "(2n+1)λ/2"], "a": 0, "eh": "संपोषी व्यतिकरण हेतु पथान्तर nλ (तरंगदैर्घ्य का पूर्ण गुणक) होना चाहिए।", "ee": "Constructive interference needs a path difference of nλ."},
    {"q": "विनाशी व्यतिकरण के लिए पथान्तर होना चाहिए :", "o": ["nλ", "(2n+1)λ/2", "शून्य", "अनन्त"], "a": 1, "y": "BSEB 2019 (C)", "eh": "विनाशी व्यतिकरण हेतु पथान्तर (2n+1)λ/2 होता है।", "ee": "Destructive interference needs a path difference of (2n+1)λ/2."},
    {"q": "दो कला-संबद्ध, एकवर्णी प्रकाश-पुंज जिनकी तीव्रताओं का अनुपात 4 : 1 है, एक-दूसरे पर अध्यारोपित हैं। महत्तम और न्यूनतम तीव्रताओं का अनुपात है :", "o": ["5 : 1", "5 : 3", "3 : 1", "9 : 1"], "a": 3, "eh": "तीव्रता अनुपात 4:1 ⇒ आयाम अनुपात 2:1 ⇒ Imax/Imin = ((2+1)/(2−1))² = 9:1।", "ee": "Amplitude ratio is 2:1, so Imax/Imin = ((2+1)/(2−1))² = 9:1."},
    {"q": "यंग के द्विक रेखा-छिद्र प्रयोग में स्लिटों के बीच अन्तराल आधा एवं स्लिट व पर्दे के बीच की दूरी दुनी करने पर फ्रिजों की चौड़ाई :", "o": ["वही रहेगी", "आधी हो जाएगी", "दुगनी हो जाएगी", "चार गुनी हो जाएगी"], "a": 3, "eh": "β = λD/d; d आधा व D दुगना करने पर फ्रिन्ज चौड़ाई चार गुनी हो जाएगी।", "ee": "Halving d and doubling D makes β = λD/d four times."},
    {"q": "साबुन का बुलबुला सूर्य के प्रकाश में रंगीन दिखाई देता है। इसका कारण है :", "o": ["प्रकाश का वर्ण-विक्षेपण", "प्रकाश का प्रकीर्णन", "प्रकाश का व्यतिकरण", "प्रकाश का ध्रुवण"], "a": 2, "y": "BSEB 2025 (A)", "eh": "साबुन के बुलबुले की पतली झिल्ली में व्यतिकरण के कारण रंग दिखाई देते हैं।", "ee": "Soap-bubble colours are due to interference in the thin film."},
    {"q": "जब प्रकाश की किरण एक अवरोधक के किनारों से मुड़ती है, तो यह क्रिया कहलाती है :", "o": ["अपवर्तन", "विवर्तन", "व्यतिकरण", "ध्रुवण"], "a": 1, "eh": "प्रकाश की किरण का अवरोधक के किनारों से मुड़ना विवर्तन कहलाता है।", "ee": "Bending of light around the edges of an obstacle is diffraction."},
    {"q": "जीवाश्म की आयु पता की जाती है :", "o": ["कार्बन डेटिंग से", "X-ray से", "गामा किरण से", "लेजर"], "a": 0, "y": "BSEB 2017 (C)", "eh": "जीवाश्मों की आयु कार्बन-14 डेटिंग से ज्ञात की जाती है।", "ee": "Fossil age is determined by carbon (C-14) dating."},
    {"q": "काँच की एक पट्टिका पर प्रकाश-किरण 60° के कोण पर आपतित होती है। यदि परावर्तित तथा अपवर्तित किरणें परस्पर लम्बवत् हों, तो पदार्थ का अपवर्तनांक है :", "o": ["√3/2", "√3", "1/√3", "1/2"], "a": 1, "eh": "परावर्तित व अपवर्तित किरणें लम्बवत् हैं ⇒ आपतन कोण ब्रुस्टर कोण है; μ = tan 60° = √3।", "ee": "By Brewster's law, μ = tan 60° = √3."},
    {"q": "जिस घटना से प्रकाश-तरंगों की प्रकृति निर्विवाद रूप से अनुप्रस्थ सिद्ध होती है, वह है :", "o": ["व्यतिकरण", "विवर्तन", "ध्रुवण", "अपवर्तन"], "a": 2, "y": "BSEB 2017 (A)", "eh": "ध्रुवण ही वह घटना है जिससे प्रकाश तरंगों की अनुप्रस्थ प्रकृति निर्विवाद रूप से सिद्ध होती है।", "ee": "Polarisation conclusively proves the transverse nature of light."},
    {"q": "समतल ध्रुवित प्रकाश में कम्पन होते हैं :", "o": ["सभी दिशाओं में समान", "केवल एक दिशा में", "परस्पर लम्बवत् दिशा में", "इनमें से कोई नहीं"], "a": 1, "eh": "समतल ध्रुवित प्रकाश में कम्पन केवल एक ही दिशा में होते हैं।", "ee": "In plane-polarised light, vibrations are confined to one direction only."},
    {"q": "ब्रुस्टर का नियम है :", "o": ["μ = sin iₚ", "μ = cos iₚ", "μ = tan iₚ", "μ = tan² iₚ"], "a": 2, "y": "BSEB 2019 (C)", "eh": "ब्रुस्टर का नियम है: μ = tan iₚ (iₚ = ध्रुवण कोण)।", "ee": "Brewster's law: μ = tan iₚ."},

  'chem-1': [
    {"q": "निम्नलिखित में कौन अणुसंख्य गुणधर्म नहीं है?", "o": ["वाष्प दाब", "हिमांक का अवनमन", "परासरणी दाब", "क्वथनांक का उन्नयन"], "a": 0, "y": "BSEB 2025 (A)", "eh": "अणुसंख्य गुणधर्म केवल चार होते हैं — वाष्प दाब का सापेक्ष अवनमन, हिमांक का अवनमन, क्वथनांक का उन्नयन और परासरणी दाब। शुद्ध वाष्प दाब विलेय कणों की संख्या पर निर्भर नहीं करता, इसलिए यह अणुसंख्य गुणधर्म नहीं है।", "ee": "Vapour pressure itself is not colligative; only its relative lowering depends on the number of solute particles."},
    {"q": "निम्नलिखित में किस यौगिक के जलीय घोल का परासरणी दाब असामान्य होता है?", "o": ["यूरिया", "साधारण लवण", "ग्लूकोज", "सुक्रोज"], "a": 1, "y": "BSEB 2025 (A)", "eh": "साधारण लवण (NaCl) जल में विघटित होकर Na⁺ और Cl⁻ आयन देता है, जिससे विलयन में कणों की संख्या बढ़ जाती है। इसलिए इसका परासरणी दाब सामान्य मान से अधिक (असामान्य) होता है, जबकि यूरिया, ग्लूकोज और सुक्रोज विघटित नहीं होते।", "ee": "NaCl dissociates into Na⁺ and Cl⁻ ions, increasing particle count and making its osmotic pressure abnormally high."},
    {"q": "वह विलयन जो रॉल्ट के नियम से धनात्मक या ऋणात्मक विचलन दर्शाता है, उसे कहा जाता है:", "o": ["आदर्श विलयन", "वास्तविक विलयन", "अनादर्श विलयन", "कोलॉइडी विलयन"], "a": 2, "y": "BSEB 2025 (A)", "eh": "जो विलयन राउल्ट के नियम से धनात्मक या ऋणात्मक विचलन दर्शाते हैं, उन्हें अनादर्श विलयन कहा जाता है। आदर्श विलयन राउल्ट नियम का पूर्णतः पालन करते हैं और कोई विचलन नहीं दिखाते।", "ee": "Solutions showing positive or negative deviation from Raoult's law are called non-ideal solutions."},
    {"q": "समपरासरणी विलयन का बराबर होता है:", "o": ["परासरणी दाब", "वाष्प दाब", "वाष्प दाब का सापेक्षिक अवनमन", "क्वथनांक का उन्नयन"], "a": 0, "y": "BSEB 2025 (A)", "eh": "समपरासरणी (आइसोटोनिक) विलयनों में विलेय की मोलर सांद्रता समान होती है। सूत्र π = CRT के अनुसार समान सांद्रता पर परासरणी दाब भी बराबर होता है।", "ee": "Isotonic solutions have equal molar concentration, hence equal osmotic pressure."},
    {"q": "फेरिक हाइड्रॉक्साइड कोलॉइडी विलयन के स्कंदन में निम्नलिखित में कौन विद्युत अपघट्य सबसे कम प्रभावी है?", "o": ["KBr", "K₂SO₄", "K₂CrO₄", "K₃[Fe(CN)₆]"], "a": 0, "y": "BSEB 2025 (A)", "eh": "फेरिक हाइड्रॉक्साइड धनात्मक सॉल है, अतः इसे ऋणायन स्कंदित करते हैं। हार्डी-शुल्जे नियम के अनुसार आयन का आवेश जितना कम, स्कंदन क्षमता उतनी कम — Br⁻ (एकल आवेश) सबसे कम प्रभावी है।", "ee": "Fe(OH)₃ is a positive sol; per the Hardy–Schulze rule, monovalent Br⁻ is the least effective coagulating ion."},

    {"q": "निम्नलिखित में कौन राउल्ट नियम से धनात्मक विचलन दर्शाता है?", "o": ["C₆H₆ तथा C₆H₅CH₃", "C₆H₆ तथा CCl₄", "CHCl₃ तथा C₂H₅OH", "CHCl₃ तथा CH₃COCH₃"], "a": 2, "y": "BSEB 2024 (A)", "eh": "जब दो द्रवों के बीच का आकर्षण (A–B) उनके अपने अणुओं के आकर्षण (A–A, B–B) से कम हो, तो धनात्मक विचलन होता है। CHCl₃ में C₂H₅OH मिलाने पर एथनॉल के हाइड्रोजन बंध टूटते हैं, जिससे वाष्प दाब बढ़ जाता है।", "ee": "In CHCl₃ + ethanol, hydrogen bonds break on mixing, raising vapour pressure — a positive deviation."},
    {"q": "किसी विलयन के सांद्रण को व्यक्त करने का कौन-सा तापक्रम पर निर्भर नहीं करता है?", "o": ["मोलरता", "नॉर्मलता", "फॉर्मलता", "मोललता"], "a": 3, "y": "BSEB 2024 (A)", "eh": "मोललता घोलक के द्रव्यमान (kg) पर आधारित होती है, जो ताप बदलने पर नहीं बदलता। मोलरता, नॉर्मलता और फॉर्मलता विलयन के आयतन पर निर्भर हैं, और आयतन ताप से बदलता है।", "ee": "Molality uses solvent mass, which is temperature-independent, unlike volume-based concentration units."},
    {"q": "निम्नलिखित में से कौन आदर्श घोल नहीं है?", "o": ["बेंजीन + टॉल्युइन", "मिथाइल अल्कोहल + ईथाइल अल्कोहल", "क्लोरोफॉर्म + ऐसीटोन", "कार्बन टेट्राक्लोराइड + सिलिकन टेट्राक्लोराइड"], "a": 2, "y": "BSEB 2023 (A)", "eh": "क्लोरोफॉर्म और ऐसीटोन के बीच हाइड्रोजन बंध बनने से वाष्प दाब घटता है — यह ऋणात्मक विचलन है। अतः यह आदर्श विलयन नहीं है, जबकि शेष तीनों युग्म राउल्ट नियम का पालन करते हैं।", "ee": "Chloroform + acetone forms H-bonds and shows negative deviation, so it is not an ideal solution."},
    {"q": "निम्नलिखित में से किसका क्वथनांक सबसे अधिक होगा?", "o": ["जल में 1% ग्लूकोस", "जल में 1% सुक्रोस", "जल में 1% NaCl", "जल में 1% यूरिया"], "a": 2, "y": "BSEB 2017 (A), 2023 (A), 2025 (A)", "eh": "क्वथनांक का उन्नयन (ΔTb = i·Kb·m) विलेय कणों की संख्या पर निर्भर करता है। NaCl जल में दो आयनों में विघटित होता है (i ≈ 2), इसलिए इसका उन्नयन और क्वथनांक सबसे अधिक होगा।", "ee": "NaCl dissociates into two ions, giving the largest boiling-point elevation and the highest boiling point."},
    {"q": "यदि 18g ग्लूकोस को 1000 g घोलक में घुलाया जाता है, तो उस घोल को कहते हैं:", "o": ["1 मोलर", "0.1 मोलल", "0.1 मोलर", "0.5 मोलल"], "a": 1, "y": "BSEB 2023 (A)", "eh": "ग्लूकोज (C₆H₁₂O₆) का मोलर द्रव्यमान 180 g/mol है, अतः 18 g = 0.1 मोल। यह 1000 g (1 kg) घोलक में घुला है, इसलिए सांद्रण = 0.1 mol / 1 kg = 0.1 मोलल।", "ee": "18 g glucose = 0.1 mol dissolved in 1 kg solvent gives a 0.1 molal solution."},
    {"q": "0.01 ग्लूकोस विलयन की तुलना में 0.01 M MgCl₂ विलयन के हिमांक में अवनमन है:", "o": ["समान", "लगभग दुगुना", "लगभग तिगुना", "लगभग छ: गुना"], "a": 2, "y": "BSEB 2021 (A)", "eh": "MgCl₂ जल में तीन आयनों (Mg²⁺ + 2Cl⁻) में विघटित होता है, अतः i ≈ 3, जबकि ग्लूकोज का i = 1 है। समान सांद्रता पर हिमांक अवनमन (ΔTf = i·Kf·m) i के अनुपात में होगा, अर्थात् लगभग तिगुना।", "ee": "MgCl₂ gives about 3 ions (i ≈ 3) while glucose gives 1, so the depression is nearly triple."},

    {"q": "234.2 ग्राम चीनी के घोल में 34.2 ग्राम चीनी है। घोल का मोलल सांद्रण क्या होगा?", "o": ["0.1", "2.0", "3.0", "5.0"], "a": 3, "y": "BSEB 2021 (A)", "eh": "सुक्रोज का मोलर द्रव्यमान 342 g/mol है, अतः 34.2 g चीनी = 0.1 मोल। मोललता = (विलेय के मोल × 1000) ÷ घोलक का द्रव्यमान (g); मान रखने पर 5.0 मोलल प्राप्त होता है।", "ee": "Using molality = (moles of solute × 1000) ÷ mass of solvent in grams gives 5.0 molal."},
    {"q": "परासरण दाब निम्नलिखित में से किस समीकरण द्वारा व्यक्त होते हैं?", "o": ["P = CRT", "P = CT/R", "P = RC/T", "P = RT/C"], "a": 0, "y": "BSEB 2020 (A)", "eh": "परासरण दाब का समीकरण वान्ट हॉफ ने दिया था: π = CRT, जहाँ C = मोलर सांद्रता, T = परम ताप। यह आदर्श गैस समीकरण जैसा ही है, इसलिए इसे याद रखना आसान है।", "ee": "Osmotic pressure follows the van't Hoff equation π = CRT."},
    {"q": "अर्द्धपारगम्य झिल्ली से परासरण क्रिया में निकल पाते हैं:", "o": ["विलेय के अणु", "विलायक के अणु", "जटिल आयन", "सरल आयन"], "a": 1, "y": "BSEB 2020 (A), 2023 (A)", "eh": "अर्द्धपारगम्य झिल्ली के छिद्र इतने सूक्ष्म होते हैं कि उनसे केवल विलायक के अणु गुजर सकते हैं। विलेय के अणु और आयन बड़े होने के कारण नहीं निकल पाते — इसी क्रिया को परासरण कहते हैं।", "ee": "Only solvent molecules can pass through a semipermeable membrane, which causes osmosis."},
    {"q": "आदर्श विलयन का निम्न में से कौन गुण है?", "o": ["यह रॉल्ट के नियम का पालन करता है", "यह रॉल्ट के नियम का पालन नहीं करता है", "(A) और (B) दोनों", "इनमें से कोई नहीं"], "a": 0, "y": "BSEB 2020 (A)", "eh": "आदर्श विलयन वह है जो सभी सांद्रताओं और तापों पर राउल्ट के नियम का पूर्णतः पालन करता है। इसमें A–A, B–B और A–B आकर्षण बल समान होते हैं, अतः वाष्प दाब में कोई विचलन नहीं होता।", "ee": "An ideal solution obeys Raoult's law at all concentrations and temperatures."},
    {"q": "पहाड़ों पर जल का क्वथनांक कम हो जाता है, क्योंकि:", "o": ["वहाँ वायुमण्डलीय दाब कम है", "वहाँ ताप कम है", "वहाँ दाब ज्यादा है", "वहाँ हवा ज्यादा है"], "a": 0, "y": "BSEB 2020 (A)", "eh": "द्रव तब उबलता है जब उसका वाष्प दाब बाहरी वायुमंडलीय दाब के बराबर हो जाए। पहाड़ों पर वायुमंडलीय दाब कम होता है, इसलिए जल का वाष्प दाब जल्दी बराबर होता है और क्वथनांक घट जाता है।", "ee": "Lower atmospheric pressure at high altitude lets water boil at a lower temperature."},
    {"q": "निम्न में से विलयन के लिए कौन अणुसंख्यक गुण है?", "o": ["परासरण दाब", "पृष्ठ तनाव", "चालकता", "अर्द्ध-आयु"], "a": 0, "y": "BSEB 2020 (A), 2021 (A)", "eh": "अणुसंख्य गुणधर्म केवल विलेय कणों की संख्या पर निर्भर करते हैं, उनकी प्रकृति पर नहीं। परासरण दाब इन्हीं चार गुणों में से एक है; पृष्ठ तनाव, चालकता और अर्द्ध-आयु अणुसंख्य गुणधर्म नहीं हैं।", "ee": "Osmotic pressure is a colligative property, depending only on the number of solute particles."},
    {"q": "शुद्ध जल का pH होता है:", "o": ["1", "4", "3", "7"], "a": 3, "y": "BSEB 2019 (A)", "eh": "25°C पर शुद्ध जल में [H⁺] = 10⁻⁷ M होता है, अतः pH = −log[H⁺] = 7। यह मान उदासीनता दर्शाता है — जल न अम्लीय है, न क्षारीय।", "ee": "Pure water has [H⁺] = 10⁻⁷ M, so its pH is 7 (neutral)."},
    {"q": "इनमें से कौन-से जलीय घोल की हिमांक बिंदु न्यूनतम है?", "o": ["0.01 M NaCl", "0.005 M C₂H₅OH", "0.005 M MgI₂", "0.005 M MgSO₄"], "a": 0, "y": "BSEB 2018 (C)", "eh": "हिमांक अवनमन ΔTf = i·Kf·m, अर्थात् i × मोलरता के समानुपाती होता है। 0.01 M NaCl के लिए i × M = 2 × 0.01 = 0.02 (सर्वाधिक), अतः इसका हिमांक सबसे अधिक घटेगा, यानी हिमांक बिंदु न्यूनतम होगा।", "ee": "With i × M = 0.02, the highest among the options, 0.01 M NaCl shows the maximum depression and lowest freezing point."},
    {"q": "मानव रक्त का pH होता है:", "o": ["6.5", "7.0", "7.4", "8.2"], "a": 2, "y": "BSEB 2018 (C)", "eh": "मानव रक्त हल्का क्षारीय होता है और बफर तंत्र द्वारा इसका pH 7.4 पर स्थिर बनाए रखा जाता है। यह एक निश्चित तथ्यात्मक मान है, जिसे परीक्षा के लिए सीधे याद रखें।", "ee": "Human blood is slightly alkaline with a pH of 7.4, maintained by buffer systems."},
    {"q": "0.1 M Ba(NO₂)₂ घोल का वान्ट हॉफ गुणक 2.74 है तो विघटन स्तर है:", "o": ["91.3%", "87%", "100%", "74%"], "a": 1, "y": "BSEB 2018 (A)", "eh": "Ba(NO₂)₂ तीन आयनों (Ba²⁺ + 2NO₂⁻) में विघटित होता है, अतः n = 3; सूत्र i = 1 + (n−1)α से 2.74 = 1 + 2α। हल करने पर α = 0.87, अर्थात् विघटन स्तर 87% है।", "ee": "Using i = 1 + (n−1)α with n = 3 gives α = 0.87, i.e. 87% dissociation."},
    {"q": "एक जलीय घोल का हिमांक -0.186°C है। अगर Kf = 1.86 और Kb = 0.512 है तो इस जलीय घोल का क्वथनांक उन्नयन क्या होगा?", "o": ["0.186", "-0.512", "1.86", "0.0512"], "a": 3, "y": "BSEB 2017 (C)", "eh": "हिमांक अवनमन 0.186 = Kf × m से मोललता m = 0.186 ÷ 1.86 = 0.1 molal प्राप्त होती है। क्वथनांक उन्नयन ΔTb = Kb × m = 0.512 × 0.1 = 0.0512°C होगा।", "ee": "From ΔTf = Kf·m, m = 0.1; then ΔTb = Kb·m = 0.0512."},
    {"q": "अगर n घुल्य पदार्थ के मोल की संख्या तथा N घोलक के मोल की संख्या है, तो घुल्य के मोल प्रभाज है:", "o": ["n + N", "n / (N + n)", "N / (N + n)", "n / N"], "a": 1, "y": "BSEB 2017 (C)", "eh": "विलेय का मोल प्रभाज = विलेय के मोल ÷ विलयन के कुल मोल (विलेय + घोलक)। अतः X = n/(n + N), जहाँ n = विलेय के मोल और N = घोलक के मोल हैं।", "ee": "Mole fraction of solute = moles of solute ÷ total moles = n/(n+N)."},
    {"q": "H₃PO₄ के 1M विलयन की नॉर्मलता क्या होगी?", "o": ["0.5 N", "1.0 N", "2.0 N", "3.0 N"], "a": 3, "y": "BSEB 2017 (C)", "eh": "नॉर्मलता = मोलरता × n-गुणक; H₃PO₄ तीन H⁺ आयन देता है, अतः यह त्रिक्षारकीय अम्ल है (n-गुणक = 3)। इसलिए 1 M H₃PO₄ विलयन की नॉर्मलता = 1 × 3 = 3.0 N होगी।", "ee": "H₃PO₄ is tribasic (n-factor 3), so a 1 M solution is 3.0 N."},
    {"q": "विलयन के अणुसंख्य गुणधर्म का उदाहरण है:", "o": ["घनत्व", "द्रव्यमान", "क्वथनांक उन्नयन", "ताप"], "a": 2, "y": "BSEB 2022 (A)", "eh": "क्वथनांक का उन्नयन चार अणुसंख्य गुणधर्मों में से एक है, जो विलेय कणों की संख्या पर निर्भर करता है। घनत्व, द्रव्यमान और ताप कणों की संख्या पर निर्भर नहीं करते, अतः ये अणुसंख्य गुणधर्म नहीं हैं।", "ee": "Boiling-point elevation is a colligative property; density, mass and temperature are not."},
    {"q": "समुद्र जल का परिसारक दाब लगभग होता है:", "o": ["30 atm", "10 atm", "20 atm", "1 atm"], "a": 0, "y": "BSEB 2022 (A)", "eh": "समुद्र जल में लवणों की सांद्रता अधिक होने के कारण इसका परासरणी दाब बहुत अधिक होता है। इसका मान लगभग 30 atm होता है — यह परीक्षा में सीधे पूछा जाने वाला तथ्य है।", "ee": "Seawater's high salt concentration gives it an osmotic pressure of about 30 atm."},
    {"q": "Ca(NO₃)₂ का वान्ट-हॉफ गुणांक है:", "o": ["1", "2", "3", "4"], "a": 2, "y": "BSEB 2021 (A)", "eh": "Ca(NO₃)₂ जल में पूर्णतः विघटित होकर तीन आयन (Ca²⁺ + 2NO₃⁻) देता है। वान्ट हॉफ गुणांक i विघटन के बाद कणों की संख्या के बराबर होता है, अतः i = 3।", "ee": "Ca(NO₃)₂ yields three ions on dissociation, so its van't Hoff factor i = 3."},
    {"q": "ग्लूकोज के जलीय विलयन की शक्ति 10% है। इसके 1 gm mol कितने आयतन में घोले हुए हैं:", "o": ["18 लीटर", "9 लीटर", "0.9 लीटर", "1.8 लीटर"], "a": 3, "y": "BSEB 2021 (A)", "eh": "10% विलयन का अर्थ है 100 mL में 10 g ग्लूकोज; ग्लूकोज का 1 मोल = 180 g। 180 g ग्लूकोज के लिए आयतन = (180 ÷ 10) × 100 mL = 1800 mL = 1.8 लीटर।", "ee": "1 mol (180 g) of glucose in a 10% solution requires 1800 mL = 1.8 L."},
    {"q": "निम्नलिखित में से कौन अणु संख्यक गुण धर्म नहीं है:", "o": ["हिमांक अवनमन", "क्वथनांक उन्नयन", "प्रकाशिक सक्रियता", "वाष्प दाब का सापेक्ष अवनमन"], "a": 2, "y": "BSEB 2017 (C)", "eh": "अणुसंख्य गुणधर्म केवल चार हैं — हिमांक अवनमन, क्वथनांक उन्नयन, वाष्प दाब का सापेक्ष अवनमन और परासरणी दाब। प्रकाशिक सक्रियता अणु की असममित संरचना पर निर्भर करती है, कणों की संख्या पर नहीं।", "ee": "Optical activity depends on molecular structure, not particle count, so it is not a colligative property."},
    {"q": "किसी घोल का परासरण दाब का सम्बन्ध दिया गया है:", "o": ["π = ST/C", "π = CT/S", "π = SC/T", "π = CRT"], "a": 3, "y": "BSEB 2017 (C), 2024 (A)", "eh": "परासरण दाब का वान्ट हॉफ समीकरण π = CRT है, जहाँ C = मोलर सांद्रता, R = गैस नियतांक, T = परम ताप। यह सूत्र परीक्षा में बार-बार पूछा जाता है, अतः इसे कंठस्थ रखें।", "ee": "The van't Hoff equation for osmotic pressure is π = CRT."},
    {"q": "किसी विलयन में विलेय का मोल प्रभाज व्यक्त किया जाता है:", "o": ["Xsolute = n/(n+N)", "Xsolute = N/(n+N)", "Xsolute = N/n", "इनमें से कोई नहीं"], "a": 0, "y": "BSEB 2017 (C)", "eh": "विलयन में विलेय का मोल प्रभाज = विलेय के मोल ÷ (विलेय + घोलक) के कुल मोल। अतः Xsolute = n/(n + N) सही सूत्र है।", "ee": "Mole fraction of solute equals n divided by the total moles (n+N)."},
    {"q": "परमाणु द्रव्यमान बराबर होता है:", "o": ["परमाणु के इलेक्ट्रॉनों की संख्या के", "इलेक्ट्रॉनों और प्रोटॉनों की संख्या के योगफल के", "न्यूट्रॉनों की संख्या और प्रोटॉन के योगफल के", "इनमें से कोई नहीं"], "a": 2, "y": "BSEB 2016 (A)", "eh": "परमाणु का लगभग समस्त द्रव्यमान नाभिक में केंद्रित होता है, जो प्रोटॉन और न्यूट्रॉन से बना है। अतः परमाणु द्रव्यमान न्यूट्रॉनों और प्रोटॉनों की संख्या के योगफल (द्रव्यमान संख्या) के बराबर होता है।", "ee": "Atomic mass equals the sum of protons and neutrons (the mass number)."},
    {"q": "आपेक्षिक वाष्प दाब का अवनमन होता है:", "o": ["Ps/P₀", "(P₀−Ps)/P₀", "P₀−Ps", "P₀/Ps"], "a": 1, "y": "BSEB 2016 (A)", "eh": "आपेक्षिक वाष्प दाब अवनमन = वाष्प दाब में कमी ÷ शुद्ध घोलक का वाष्प दाब। राउल्ट नियम के अनुसार यह विलेय के मोल प्रभाज के बराबर होता है, अर्थात् (P₀ − Ps)/P₀।", "ee": "Relative lowering of vapour pressure is (P₀−Ps)/P₀, equal to the solute's mole fraction."},
    {"q": "निम्नलिखित में से कौन राउल्ट नियम है?", "o": ["p = p₀X", "p₀ = pX", "p = kHX", "इनमें से कोई नहीं"], "a": 0, "y": "BSEB 2021 (A)", "eh": "राउल्ट नियम के अनुसार विलयन में किसी घटक का आंशिक वाष्प दाब उसके मोल प्रभाज के समानुपाती होता है। अतः p = p₀X, जहाँ p₀ = शुद्ध घटक का वाष्प दाब और X = उसका मोल प्रभाज है।", "ee": "Raoult's law states p = p₀X: partial pressure is proportional to mole fraction."},
    {"q": "निम्न में से ताप द्वारा प्रभावित नहीं होती है:", "o": ["नॉर्मलता", "फॉर्मलता", "मोलरता", "मोललता"], "a": 3, "y": "BSEB 2021 (A)", "eh": "मोललता घोलक के द्रव्यमान पर आधारित होती है, जो ताप बदलने पर स्थिर रहता है। नॉर्मलता, फॉर्मलता और मोलरता विलयन के आयतन पर निर्भर हैं, और आयतन ताप से बदलता है।", "ee": "Molality depends on solvent mass, which does not change with temperature."},
    {"q": "निम्नलिखित जलीय घोल में किसका क्वथनांक अधिकतम होगा?", "o": ["1.0M NaOH", "0.1 M Na₂SO₄", "1.0 M NH₄NO₃", "1.0M KNO₃"], "a": 1, "y": "BSEB 2017 (A)", "eh": "क्वथनांक का उन्नयन विलयन में उत्पन्न आयनों की संख्या पर निर्भर करता है। Na₂SO₄ तीन आयनों (2Na⁺ + SO₄²⁻) में विघटित होता है, जबकि NaOH, NH₄NO₃ और KNO₃ केवल दो-दो आयन देते हैं — अतः Na₂SO₄ विलयन का क्वथनांक अधिकतम होगा।", "ee": "Na₂SO₄ yields three ions versus two from each of the others, giving it the highest boiling point."},
    {"q": "एक घोल जिसका परासरण-दाब 300 K पर 0.0821 वायुमंडल है। इस घोल का सान्द्रण क्या होगा?", "o": ["0.66 M", "0.32 M", "0.066 M", "0.033 M"], "a": 3, "y": "BSEB 2017 (A)", "eh": "परासरण दाब के सूत्र π = CRT से सांद्रण C = π/(R·T) प्राप्त होता है। दिए गए मान (π = 0.0821 atm, T = 300 K) रखने पर विलयन का सांद्रण 0.033 M आता है।", "ee": "From π = CRT, concentration C = π/(RT) = 0.033 M."},
    {"q": "HCl और H₂O के स्थिर क्वाथी मिश्रण में होगा:", "o": ["48% HCl", "22.2% HCl", "36% HCl", "20.2% HCl"], "a": 3, "y": "BSEB 2017 (A), 2024 (A)", "eh": "HCl और जल ऋणात्मक विचलन दर्शाकर अधिकतम क्वथनांक वाला एजियोट्रोप (स्थिरक्वाथी मिश्रण) बनाते हैं। इस मिश्रण में 20.2% HCl और 79.8% जल होता है, जो 110°C पर बिना संघटन बदले उबलता है।", "ee": "The HCl–water maximum-boiling azeotrope contains 20.2% HCl."},
    {"q": "परासरणी दाब बढ़ता है, जब:", "o": ["तापक्रम बढ़ता है", "तापक्रम घटता है", "आयतन बढ़ता है", "इनमें से कोई नहीं"], "a": 0, "y": "BSEB 2016 (C)", "eh": "वान्ट हॉफ समीकरण π = CRT में परासरणी दाब परम ताप (T) के समानुपाती होता है। अतः तापक्रम बढ़ने पर परासरणी दाब भी बढ़ता है।", "ee": "Since π = CRT, osmotic pressure increases as temperature rises."},
    {"q": "घोलक के 1 kg में उपस्थित घुल्य के मोलों की संख्या को कहते हैं:", "o": ["मोलरता", "मोललता", "नॉर्मलता", "मोल प्रभाज"], "a": 1, "y": "BSEB 2022 (A)", "eh": "मोललता की परिभाषा ही है — 1 kg (1000 g) घोलक में घुले हुए विलेय के मोलों की संख्या। यह परिभाषा परीक्षा में सीधे पूछी जाती है, अतः इसे शब्दशः याद रखें।", "ee": "Molality is defined as the moles of solute per kilogram of solvent."},
    {"q": "वैसा घोल जो एक निश्चित ताप पर संयोजन में बिना किसी प्रकार के परिवर्तन के उबलता है, उसे कहते हैं:", "o": ["एजियोट्रोपिक मिश्रण", "असंतृप्त", "अतिसंतृप्त", "आदर्श"], "a": 0, "y": "BSEB 2022 (A)", "eh": "एजियोट्रोपिक (स्थिरक्वाथी) मिश्रण वह है जो एक निश्चित ताप पर अपने संघटन में बिना किसी परिवर्तन के उबलता है। इसे प्रभाजी आसवन द्वारा पृथक् नहीं किया जा सकता — यही इसकी प्रमुख पहचान है।", "ee": "An azeotropic mixture boils at a constant temperature without any change in composition."}
  ],
  'chem-2': [
    {"q": "विद्युत-अपघटन में ऑक्सीकरण होता है:", "o": ["एनोड पर", "कैथोड पर", "एनोड एवं कैथोड दोनों पर", "प्रयुक्त विद्युत अपघट्य पर निर्भर करता है"], "a": 0, "y": "BSEB 2025 (A)", "eh": "विद्युत-अपघटन में एनोड धनात्मक इलेक्ट्रोड होता है, जहाँ ऋणायन इलेक्ट्रॉन देकर ऑक्सीकृत होते हैं। ऑक्सीकरण में इलेक्ट्रॉन की हानि होती है, अतः यह हमेशा एनोड पर होता है।", "ee": "Oxidation always occurs at the anode, where species lose electrons."},
    {"q": "32 g ऑक्सीजन को मुक्त करने के लिए विद्युत की कितनी मात्रा की आवश्यकता होती है?", "o": ["1 फैराडे", "2 फैराडे", "3 फैराडे", "4 फैराडे"], "a": 3, "y": "BSEB 2025 (A)", "eh": "32 g ऑक्सीजन = 1 मोल O₂; यहाँ ऑक्सीजन की ऑक्सीकरण अवस्था −2 से 0 होती है, अतः 2 परमाणुओं से कुल 4 इलेक्ट्रॉन निकलते हैं। 1 मोल इलेक्ट्रॉन = 1 फैराडे, इसलिए 4 फैराडे विद्युत चाहिए।", "ee": "32 g O2 is 1 mole; its formation releases 4 electrons, needing 4 faradays."},
    {"q": "जंग है:", "o": ["चूर्ण लोहा", "फेरस ऑक्साइड", "फेरिक ऑक्साइड", "जलयोजित फेरिक ऑक्साइड"], "a": 3, "y": "BSEB 2025 (A)", "eh": "जंग लोहा, जल और ऑक्सीजन की अभिक्रिया से बनता है। इसका रासायनिक संघटन जलयोजित फेरिक ऑक्साइड (Fe₂O₃·xH₂O) होता है, न कि केवल FeO या Fe₂O₃।", "ee": "Rust is hydrated ferric oxide, Fe2O3·xH2O, formed from iron, water and oxygen."},
    {"q": "निम्न सेल का विद्युत वाहक बल का मान होता है: Zn|Zn²⁺||Fe²⁺|Fe (1M, 1M); E°Zn²⁺|Zn = −0.76V, E°Fe²⁺|Fe = −0.44V", "o": ["1.2 V", "0.32 V", "−1.2 V", "−0.32 V"], "a": 1, "y": "BSEB 2025 (A)", "eh": "इस सेल में Zn एनोड (अधिक ऋणात्मक विभव) और Fe कैथोड बनता है। EMF = Eकैथोड − Eएनोड = (−0.44) − (−0.76) = 0.32 V।", "ee": "EMF = E(cathode) − E(anode) = (−0.44) − (−0.76) = 0.32 V."},
    {"q": "विशिष्ट चालकत्व की इकाई होती है:", "o": ["ohm cm⁻¹", "ohm cm⁻²", "ohm⁻¹ cm⁻¹", "ohm⁻¹ cm⁻²"], "a": 2, "y": "BSEB 2025 (A)", "eh": "विशिष्ट चालकत्व κ = चालकत्व (G) × सेल स्थिरांक (l/a) होता है। अतः इकाई ohm⁻¹ × cm⁻¹ = ohm⁻¹ cm⁻¹ मिलती है।", "ee": "Specific conductance = conductance × cell constant, so its unit is ohm-1 cm-1."},
    {"q": "निम्नलिखित में कौन धातु विद्युत-अपघटन से प्राप्त नहीं होता है?", "o": ["Na", "Mg", "Al", "Fe"], "a": 3, "y": "BSEB 2025 (A)", "eh": "Na, Mg और Al अति क्रियाशील धातुएँ हैं, इन्हें केवल विद्युत-अपघटन से प्राप्त किया जाता है। Fe मध्यम क्रियाशील है और इसका निष्कर्षण अपचयन (ब्लास्ट फर्नेस) द्वारा होता है।", "ee": "Na, Mg and Al are extracted by electrolysis, but Fe is obtained by reduction."},
    {"q": "सेल Zn|ZnSO₄||CuSO₄|Cu का विद्युत वाहक बल 1.1 वोल्ट है। इसका कैथोड है:", "o": ["Zn", "ZnSO₄", "Cu", "CuSO₄"], "a": 1, "y": "BSEB 2024 (A)", "eh": "सेल Zn|ZnSO₄||CuSO₄|Cu में Zn का ऑक्सीकरण (एनोड) और Cu²⁺ का अपचयन (कैथोड) होता है। कैथोड वही इलेक्ट्रोड है जहाँ अपचयन होता है, अतः कैथोड Cu है।", "ee": "In this cell Zn is the anode and Cu is the cathode, where reduction occurs."},
    {"q": "आयनीकरण का सिद्धांत किसने दिया?", "o": ["फैराडे", "आर्हीनियस", "ओस्टवाल्ड", "रदरफोर्ड"], "a": 1, "y": "BSEB 2024 (A)", "eh": "आर्हीनियस ने आयनीकरण का सिद्धांत दिया, जिसके अनुसार विद्युत-अपघट्य जल में आयनों में विभक्त हो जाता है। इसी से विलयन में विद्युत-चालन की व्याख्या होती है।", "ee": "Arrhenius proposed that electrolytes dissociate into ions in solution."},
    {"q": "NaCl के जलीय घोल के वैद्युत अपघटन के कैथोड पर निम्नलिखित में से कौन मुक्त होता है?", "o": ["क्लोरीन", "सोडियम", "सोडियम अमलगम", "हाइड्रोजन"], "a": 3, "y": "BSEB 2023 (A)", "eh": "जलीय NaCl के कैथोड पर Na⁺ के स्थान पर जल अपचयित होता है, क्योंकि जल का अपचयन अधिक आसानी से होता है। अतः कैथोड पर हाइड्रोजन गैस मुक्त होती है।", "ee": "At the cathode, water is reduced instead of Na+, so hydrogen gas is liberated."},
    {"q": "निम्नलिखित में कौन विलयन में विद्युत का संचालन करते हैं:", "o": ["वैद्युत अपघट्य", "वैद्युत अनपघट्य", "H₂O अणु", "ताँबे के तार"], "a": 0, "y": "BSEB 2023 (A)", "eh": "वैद्युत अपघट्य विलयन में आयनों में टूटते हैं, और ये गतिशील आयन ही विद्युत धारा का संचालन करते हैं। अनपघट्य आयन नहीं देते, इसलिए चालन नहीं करते।", "ee": "Electrolytes dissociate into mobile ions, which carry the electric current in solution."},
    {"q": "A, B, C और D धातुओं के मानक इलेक्ट्रोड विभव क्रमशः −3.05 V, −1.66 V, −0.40 V और +0.8 V हैं। इनमें किस धातु की अवकरण क्षमता सबसे अधिक होगी?", "o": ["A", "B", "C", "D"], "a": 0, "y": "BSEB 2023 (A)", "eh": "जिसका मानक इलेक्ट्रोड विभव सबसे अधिक ऋणात्मक होता है, वह सबसे आसानी से इलेक्ट्रॉन देकर ऑक्सीकृत होता है। A का विभव (−3.05 V) सबसे अधिक ऋणात्मक है, अतः इसकी अवकरण क्षमता सर्वाधिक है।", "ee": "The metal with the most negative standard potential is the strongest reducing agent."},
    {"q": "1 मोल Al³⁺ को Al में अपचयन के लिए कितने आवेश की आवश्यकता होगी?", "o": ["3.0 × 10⁵ C", "28.95 × 10⁵ C", "289.5 × 10⁵ C", "2895 × 10⁵ C"], "a": 0, "y": "BSEB 2021 (A)", "eh": "Al³⁺ + 3e⁻ → Al में 1 मोल Al³⁺ हेतु 3 मोल इलेक्ट्रॉन चाहिए। 3 × 96500 = 289500 C ≈ 3.0 × 10⁵ C।", "ee": "1 mole of Al3+ needs 3 moles of electrons, about 3.0 × 10^5 C."},
    {"q": "A, B और C तत्वों का मानक अपचयन विभव मान क्रमशः +0.68 V, −2.50 V और −0.50 V है। उनकी अपचयन शक्ति का क्रम है:", "o": ["A > B > C", "A > C > B", "C > B > A", "B > C > A"], "a": 3, "y": "BSEB 2021 (A)", "eh": "जिसका मानक अपचयन विभव सबसे अधिक ऋणात्मक होता है, वह प्रबलतम अवकारक होता है। B (−2.50 V) सबसे ऋणात्मक है, फिर C (−0.50 V), फिर A (+0.68 V); अतः क्रम B > C > A है।", "ee": "Reducing strength follows the most negative E° first: B > C > A."},
    {"q": "किसी सेल अभिक्रिया की साम्यावस्था पर सेल का विद्युत वाहक बल (EMF) होता है:", "o": ["धनात्मक", "शून्य", "ऋणात्मक", "इनमें से कोई नहीं"], "a": 1, "y": "BSEB 2021 (A)", "eh": "साम्यावस्था पर सेल अभिक्रिया में कोई शुद्ध रासायनिक परिवर्तन नहीं होता। अतः सेल कोई कार्य नहीं कर सकता और उसका विद्युत वाहक बल शून्य हो जाता है।", "ee": "At equilibrium no net cell reaction occurs, so the EMF becomes zero."},
    {"q": "Zn(s)|Zn²⁺(aq)||Cu²⁺(aq)|Cu(s) है:", "o": ["वेस्टन सेल", "डेनियल सेल", "कैलोमेल सेल", "इनमें से कोई नहीं"], "a": 1, "y": "BSEB 2021 (A)", "eh": "जिंक-कॉपर गैल्वेनिक सेल को डेनियल सेल कहते हैं। इसमें Zn एनोड और Cu कैथोड होता है।", "ee": "The Zn–Cu galvanic cell is called the Daniell cell."},
    {"q": "जलीय घोल में हाइड्रोजन (H₂) इनमें किसे अवकृत नहीं करेगा?", "o": ["Fe³⁺", "Cu²⁺", "Au³⁺", "Ag⁺"], "a": 0, "y": "BSEB 2018 (C)", "eh": "पुस्तक अनुसार हाइड्रोजन (H₂) जलीय घोल में Fe³⁺ को अपचयित नहीं करती, जबकि Cu²⁺, Au³⁺ और Ag⁺ का अपचयन कर देती है। अतः उत्तर Fe³⁺ है। नोट: रसायनतः Fe³⁺ → Fe²⁺ का E° = +0.77 V है, अतः H₂ वास्तव में Fe³⁺ को अपचयित कर सकती है — पुस्तक उत्तर संदिग्ध है, परीक्षा में पुस्तक उत्तर ही लिखें।", "ee": "As printed, H2 does not reduce Fe3+ in aqueous solution, though it reduces the others. Note: chemically Fe3+ (E°=+0.77V) can be reduced by H2 — the book answer is doubtful."},
    {"q": "किसका ऑक्सीकरण विभव सबसे अधिक है?", "o": ["Zn", "Cu", "Ag", "Mg"], "a": 3, "y": "BSEB 2018 (C)", "eh": "ऑक्सीकरण विभव अधिक होने का अर्थ है धातु का आसानी से ऑक्सीकृत होना। Mg का मानक अपचयन विभव सबसे अधिक ऋणात्मक है, अतः इसका ऑक्सीकरण विभव सर्वाधिक है।", "ee": "Mg has the most negative reduction potential, hence the highest oxidation potential."},
    {"q": "सोडियम क्लोराइड के जलीय घोल का विद्युत विच्छेदन कराने पर धनोद एवं ऋणोद पर प्राप्त प्रतिफल है:", "o": ["Cl₂, Na", "Cl₂, H₂", "O₂, Na", "O₂, H₂"], "a": 3, "y": "BSEB 2018 (A)", "eh": "पुस्तक अनुसार NaCl के जलीय घोल के विद्युत-अपघटन में धनोद (एनोड) पर O₂ और ऋणोद (कैथोड) पर H₂ प्राप्त होता है। कैथोड पर जल अपचयित होकर H₂ देता है। नोट: रसायनतः NaCl विलयन के विद्युत-अपघटन में एनोड पर प्रायः Cl₂ गैस मुक्त होती है, O₂ नहीं — पुस्तक उत्तर संदिग्ध है, परीक्षा में पुस्तक उत्तर ही लिखें।", "ee": "As printed, electrolysis of aqueous NaCl gives O2 at the anode and H2 at the cathode. Note: chemically Cl2 is usually liberated at the anode — the book answer is doubtful."},
    {"q": "बेरियम सल्फेट के संतृप्त घोल की समतुल्य सुचालकता 400 ohm⁻¹ cm² eqvt⁻¹ और विशिष्ट सुचालकता 8 × 10⁻⁵ ohm⁻¹ cm⁻¹ है। BaSO₄ का Ksp है:", "o": ["4 × 10⁻⁸ M²", "10⁻⁸ M²", "2 × 10⁻⁴ M²", "10⁻⁴ M²"], "a": 1, "y": "BSEB 2018 (A)", "eh": "विलेयता (g-eq/L) = κ × 1000 / Λeq = (8 × 10⁻⁵ × 1000) / 400 = 2 × 10⁻⁴। BaSO₄ हेतु मोलर विलेयता s = 10⁻⁴ M। Ksp = s² = 10⁻⁸ M²।", "ee": "Solubility s = 10^-4 M from κ × 1000 / Λeq, so Ksp = s² = 10^-8 M²."},
    {"q": "क्विनहाइड्रोन इलेक्ट्रोड अभिक्रिया (E° = 1.30 V) में pH = 2 पर इलेक्ट्रोड विभव है:", "o": ["1.36 V", "1.30 V", "1.42 V", "1.20 V"], "a": 0, "y": "BSEB 2019 (A)", "eh": "क्विनहाइड्रोन इलेक्ट्रोड का विभव pH बढ़ने पर घटता है (E = E° − 0.0591 × pH)। पुस्तक अनुसार pH = 2 पर इलेक्ट्रोड विभव 1.36 V है। नोट: सूत्र से E = 1.30 − 0.0591 × 2 = 1.18 V आता है, अतः पुस्तक उत्तर संदिग्ध है — परीक्षा में पुस्तक उत्तर ही लिखें।", "ee": "As printed, the quinhydrone electrode potential at pH 2 is 1.36 V. Note: the formula gives 1.18 V — the book answer is doubtful."},
    {"q": "एक विद्युत-अपघट्य:", "o": ["विलयन में जटिल आयन बनाता है", "केवल विद्युत प्रवाहित करने पर आयन देता है", "ठोस अवस्था में भी आयन रखता है", "केवल जल में घोले जाने पर आयन देता है"], "a": 0, "eh": "पुस्तक अनुसार विद्युत-अपघट्य विलयन में जटिल आयन बनाते हैं, और यही आयन विद्युत-चालन करते हैं। इसलिए उत्तर विकल्प A है। नोट: आर्हीनियस के सिद्धांतानुसार विद्युत-अपघट्य विलयन में सामान्य धनायनों व ऋणायनों में विभक्त होता है।", "ee": "As printed, an electrolyte forms complex ions in solution. Note: per Arrhenius theory, electrolytes dissociate into simple cations and anions."},
    {"q": "प्रबल विद्युत-अपघट्य वे हैं जो:", "o": ["जल में शीघ्र घुल जाते हैं", "विद्युत प्रवाहित करते हैं", "उच्च तनुता पर आयनों में विभक्त हो जाते हैं", "सभी तनुताओं पर आयनों में विभक्त हो जाते हैं"], "a": 3, "eh": "प्रबल विद्युत-अपघट्य सभी तनुताओं पर पूर्णतः आयनों में विभक्त रहते हैं। केवल दुर्बल अपघट्य ही तनुता बढ़ने पर अधिक आयनित होते हैं।", "ee": "Strong electrolytes are completely ionised at all dilutions."},
    {"q": "गैल्वेनिक सेल में एनोड होता है:", "o": ["ऋणात्मक इलेक्ट्रोड", "धनात्मक इलेक्ट्रोड", "उदासीन इलेक्ट्रोड", "इनमें से कोई नहीं"], "a": 0, "y": "BSEB 2020 (A)", "eh": "गैल्वेनिक सेल में एनोड पर ऑक्सीकरण होता है और इलेक्ट्रॉन निकलते हैं। अतः एनोड ऋणात्मक इलेक्ट्रोड होता है, जहाँ से इलेक्ट्रॉन कैथोड की ओर बहते हैं।", "ee": "In a galvanic cell the anode is the negative electrode, where oxidation occurs."},
    {"q": "विद्युत धारा जब किसी चालक से इलेक्ट्रॉनों के द्वारा प्रवाहित होती है, तो चालक को कहते हैं:", "o": ["धात्विक चालक", "विद्युत-अपघट्य चालक", "कुचालक", "इनमें से कोई नहीं"], "a": 0, "y": "BSEB 2019 (C)", "eh": "जब धारा इलेक्ट्रॉनों के प्रवाह से चलती है, तो चालक धात्विक चालक कहलाता है (जैसे ताँबे का तार)। आयनों से चालन होने पर वह विद्युत-अपघट्य चालक होता है।", "ee": "A conductor carrying current by electron flow is a metallic conductor."},
    {"q": "फैराडे का विद्युत विच्छेदन का द्वितीय नियम सम्बन्धित है:", "o": ["धनायन के परमाणु संख्या के", "विद्युत अपघट्य के समतुल्य भार के", "ऋणायन के परमाणु संख्या के", "धनायन के वेग से"], "a": 1, "y": "BSEB 2010, 2017 (C)", "eh": "फैराडे के द्वितीय नियम के अनुसार समान आवेश से मुक्त पदार्थों के द्रव्यमान उनके समतुल्य भारों के अनुपात में होते हैं। अतः यह नियम समतुल्य भार से संबंधित है।", "ee": "Faraday's second law states that deposited masses are proportional to equivalent weights."},
    {"q": "निम्नलिखित में कौन द्वितीयक सेल है?", "o": ["लेकलांशे सेल", "लीड स्टोरेज बैटरी", "साधारण सेल", "इनमें से सभी"], "a": 1, "y": "BSEB 2011", "eh": "द्वितीयक सेल पुनः चार्ज किए जा सकते हैं। लेड स्टोरेज बैटरी बार-बार आवेशित होती है, जबकि लेकलांशे व साधारण सेल प्राथमिक (एक बार प्रयुक्त) सेल हैं।", "ee": "A secondary cell is rechargeable; the lead storage battery is one."},
    {"q": "96500 कूलम्ब विद्युत धारा CuSO₄ के घोल से मुक्त करती है:", "o": ["63.5g Cu", "31.75g Cu", "96500 g Cu", "100 g Cu"], "a": 1, "y": "BSEB 2013, 2015, 2016 (C), 2024 (A)", "eh": "96500 C = 1 फैराडे। Cu²⁺ के अपचयन में 2 इलेक्ट्रॉन लगते हैं, अतः 1 फैराडे से 1/2 मोल Cu = 63.5/2 = 31.75 g मुक्त होता है।", "ee": "One faraday deposits half a mole of Cu, i.e. 63.5/2 = 31.75 g."},
    {"q": "इलेक्ट्रॉन पर आवेश होता है:", "o": ["4.8 × 10⁻¹⁰ कूलॉम", "1.6 × 10⁻¹⁹ कूलॉम", "4.8 × 10⁻¹⁰ a.m.u.", "1.5 × 10⁻¹¹ a.m.u."], "a": 1, "eh": "इलेक्ट्रॉन पर मूल आवेश 1.6 × 10⁻¹⁹ कूलॉम (ऋणात्मक) होता है। यही आवेश विद्युत-अपघटन की गणनाओं का आधार है।", "ee": "The charge on one electron is 1.6 × 10^-19 coulomb."},
    {"q": "विशिष्ट प्रतिरोध की इकाई है:", "o": ["ओम⁻¹", "ओम⁻¹ सेमी⁻¹", "ओम सेमी", "ओम सेमी⁻¹"], "a": 2, "eh": "विशिष्ट प्रतिरोध ρ = R × a/l होता है। अतः इकाई ओम × सेमी²/सेमी = ओम सेमी होती है।", "ee": "Specific resistance ρ = R·a/l, so its unit is ohm cm."},
    {"q": "विद्युत-अपघटन के नियम दिये थे:", "o": ["ग्रेहाम ने", "ओस्टवाल्ड ने", "फैराडे ने", "आरहीनियस ने"], "a": 2, "eh": "विद्युत-अपघटन के दोनों नियम फैराडे ने दिए थे। प्रथम नियम मात्रा और आवेश का, द्वितीय नियम समतुल्य भार का संबंध बताता है।", "ee": "Faraday gave both laws of electrolysis."},
    {"q": "फैराडे का प्रथम नियम है:", "o": ["E = mc³", "m = ECt", "E = hv", "PV = nRt"], "a": 1, "eh": "फैराडे के प्रथम नियम में मुक्त द्रव्यमान m = ZIt होता है, जहाँ Z विद्युत-रासायनिक तुल्यांक, I धारा व t समय है। अतः m = ECt सही सूत्र है।", "ee": "The first law is m = ZIt, i.e. m = ECt with electrochemical equivalent E."},
    {"q": "विद्युत रासायनिक तुल्यांक का मात्रक है:", "o": ["ग्राम", "ग्राम/ऐम्पियर", "ग्राम/कूलॉम", "कूलॉम/ग्राम"], "a": 2, "eh": "विद्युत-रासायनिक तुल्यांक 1 कूलॉम आवेश से मुक्त पदार्थ का द्रव्यमान है। अतः इसका मात्रक ग्राम/कूलॉम होता है।", "ee": "Electrochemical equivalent is mass deposited per coulomb, so its unit is g/C."},
    {"q": "एक फैराडे होता है:", "o": ["69500 कूलॉम", "96500 कूलॉम", "96500 कूलॉम लगभग", "इनमें से कोई नहीं"], "a": 2, "y": "BSEB 2019 (A), 2022 (A)", "eh": "1 फैराडे = 1 मोल इलेक्ट्रॉन का कुल आवेश ≈ 96500 कूलॉम। विकल्प C 'लगभग' कहता है, जो सर्वाधिक उपयुक्त है।", "ee": "One faraday is the charge of one mole of electrons, approximately 96500 C."},
    {"q": "फैराडे की इकाई है:", "o": ["ऐम्पियर", "C", "C mol⁻¹", "C sec⁻¹"], "a": 2, "eh": "फैराडे प्रति मोल इलेक्ट्रॉन के आवेश को दर्शाता है। अतः इसकी इकाई कूलॉम प्रति मोल, अर्थात् C mol⁻¹ होती है।", "ee": "The faraday is charge per mole of electrons, measured in C mol-1."},
    {"q": "किसी चालकत्व सेल का सेल स्थिरांक है:", "o": ["l/a", "a/l", "a × l", "a + l"], "a": 0, "y": "BSEB 2023 (A), 2024 (A)", "eh": "सेल स्थिरांक = इलेक्ट्रोडों के बीच की दूरी (l) ÷ अनुप्रस्थ काट का क्षेत्रफल (a)। इसी से κ = G × (l/a) प्राप्त होता है।", "ee": "Cell constant = distance between electrodes divided by area, l/a."},
    {"q": "विलयन की चालकता समानुपाती होती है:", "o": ["तनुता के", "आयनों की संख्या के", "विलयन का आयतन के", "विद्युत घनत्व के"], "a": 1, "eh": "विलयन में जितने अधिक आयन होंगे, विद्युत-चालन उतना ही अधिक होगा। अतः विलयन की चालकता आयनों की संख्या के समानुपाती होती है।", "ee": "Conductivity depends on the number of ions, so it is proportional to them."},
    {"q": "निम्न में सबसे अच्छा विद्युत का सुचालक है:", "o": ["NaCl", "ग्रेफाइट", "हीरा", "Na"], "a": 1, "eh": "ग्रेफाइट में परतों के बीच मुक्त इलेक्ट्रॉन होते हैं, अतः यह विद्युत का अच्छा सुचालक है। ठोस NaCl और हीरा विद्युत नहीं चलाते। पुस्तक उत्तर ग्रेफाइट है। नोट: धात्विक सोडियम भी विद्युत का अच्छा चालक है, पर पुस्तक उत्तर ग्रेफाइट है।", "ee": "As printed, graphite is the best conductor among the given options. Note: metallic sodium is also a good conductor."},
    {"q": "विद्युत-अपघटनी चालकता मापक है:", "o": ["प्रतिरोध का", "विभव का", "सान्द्रता का", "आयनन का"], "a": 1, "eh": "विद्युत-अपघटनी चालकता चालकत्व सेल द्वारा मापी जाती है, और पुस्तक अनुसार यह विभव का मापक है। अतः उत्तर विभव (विकल्प B) है। नोट: रसायनतः चालकता आयनों की संख्या व गतिशीलता पर निर्भर करती है, अतः विकल्प D (आयनन) भी तर्कसंगत लगता है — परीक्षा में पुस्तक उत्तर ही लिखें।", "ee": "As printed, electrolytic conductance is a measure of potential. Note: chemically it depends on ionisation too — write the book answer in exams."},
    {"q": "कोलराउश का नियम है:", "o": ["λₘ° = λ + xλ₋", "λₘ° = λ₊° + λ₋°", "λₘ° = λ₊ + λ₋", "λₘ° = λ₊ − λ₋"], "a": 1, "eh": "कोलराउश नियम के अनुसार अनंत तनुता पर मोलर चालकता धनायन व ऋणायन की सीमांत मोलर चालकताओं के योग के बराबर होती है। अतः λₘ° = λ₊° + λ₋°।", "ee": "Kohlrausch's law: λm° equals the sum of the limiting molar conductivities of the ions."},
    {"q": "जब लेड संचय सेल को चार्ज किया जाता है, तो निम्नलिखित में क्या होता है?", "o": ["लीड डाइऑक्साइड घुलता है", "H₂SO₄ पुनः उत्पन्न होता है", "लेड इलेक्ट्रोड के ऊपर लेड सल्फेट की परत जम जाती है", "गंधकाम्ल का सांद्रण घट जाता है"], "a": 1, "y": "BSEB 2022 (A)", "eh": "चार्जिंग के समय PbSO₄ पुनः Pb और PbO₂ में बदलता है तथा प्रयुक्त H₂SO₄ वापस उत्पन्न होता है। अतः गंधकाम्ल का सांद्रण बढ़ता है, घटता नहीं।", "ee": "On charging, lead sulphate is converted back and sulphuric acid is regenerated."},
    {"q": "सेल, जिसमें रासायनिक ऊर्जा, विद्युत ऊर्जा में बदलती है उसे कहते हैं:", "o": ["विद्युत अपघटनी सेल", "गैल्वेनिक सेल", "चालकता सेल", "इनमें से सभी"], "a": 1, "y": "BSEB 2019 (C)", "eh": "गैल्वेनिक (वोल्टीय) सेल में स्वतः होने वाली रासायनिक अभिक्रिया से विद्युत ऊर्जा उत्पन्न होती है। विद्युत-अपघटनी सेल में इसके विपरीत विद्युत से रासायनिक परिवर्तन होता है।", "ee": "A galvanic cell converts chemical energy into electrical energy."},
    {"q": "Ag⁺|Ag E° = +0.80V, Sn²⁺|Sn E° = −0.14V; सेल Sn|Sn²⁺||Ag⁺|Ag का EMF है:", "o": ["0.66 V", "0.80 V", "1.08 V", "0.94 V"], "a": 3, "y": "BSEB 2022 (A)", "eh": "Sn एनोड (E° = −0.14 V) और Ag⁺ कैथोड (E° = +0.80 V) बनता है। EMF = Eकैथोड − Eएनोड = 0.80 − (−0.14) = 0.94 V।", "ee": "EMF = E(cathode) − E(anode) = 0.80 − (−0.14) = 0.94 V."},
    {"q": "हाइड्रोजन-ऑक्सीजन सेल निम्नलिखित में किस तरह का सेल है?", "o": ["प्राथमिक सेल", "द्वितीयक सेल", "ईंधन सेल", "लेड संचायक सेल"], "a": 2, "y": "BSEB 2022 (A)", "eh": "हाइड्रोजन-ऑक्सीजन सेल में ईंधन (H₂) और ऑक्सीकारक (O₂) लगातार दिए जाते हैं, और रासायनिक ऊर्जा सीधे विद्युत ऊर्जा में बदलती है। यही ईंधन सेल की परिभाषा है।", "ee": "The hydrogen–oxygen cell continuously converts fuel into electricity, so it is a fuel cell."},
    {"q": "एक फैराडे विद्युत धारा प्रवाहित करने पर प्राप्त मात्रा बराबर होगी:", "o": ["एक ग्राम समतुल्य", "एक ग्राम मोल", "विद्युत रासायनिक तुल्यांक", "आधा ग्राम समतुल्यांक"], "a": 2, "y": "BSEB 2017 (A)", "eh": "पुस्तक अनुसार 1 फैराडे विद्युत धारा से मुक्त पदार्थ की मात्रा विद्युत-रासायनिक तुल्यांक के बराबर होती है। फैराडे के प्रथम नियम से यही निष्कर्ष मिलता है। नोट: रसायनतः 1 फैराडे से 1 ग्राम-तुल्यांक पदार्थ मुक्त होता है, अतः विकल्प A भी सही लगता है — परीक्षा में पुस्तक उत्तर ही लिखें।", "ee": "As printed, one faraday liberates an amount equal to the electrochemical equivalent. Note: chemically 1 faraday gives 1 gram-equivalent — write the book answer in exams."},
    {"q": "वैद्युत अपघट्य सेल में इलेक्ट्रॉन जिस इलेक्ट्रोड से घोल में प्रविष्ट करता है, उसे कहते हैं:", "o": ["कैथोड", "एनोड", "एनोड या कैथोड में कोई", "इनमें से कोई नहीं"], "a": 0, "y": "BSEB 2016 (C)", "eh": "वैद्युत-अपघट्य सेल में कैथोड ऋणात्मक इलेक्ट्रोड होता है, और यहीं से इलेक्ट्रॉन घोल में प्रवेश करके धनायनों का अपचयन करते हैं। एनोड से इलेक्ट्रॉन बाहर निकलते हैं।", "ee": "Electrons enter the solution at the cathode, where reduction takes place."}
  ],
  'eng-1': [
    {"q": "Gandhiji completely dominated Indian politics :", "o": ["from 1915 till 1948", "from 1917 till 1947", "from 1920 till 1950", "from 1930 till 1952"], "a": 0, "y": "BSEB 2025 (A) · I.Sc.", "eh": "गांधीजी 1915 में दक्षिण अफ्रीका से भारत लौटे और 1948 में अपनी मृत्यु तक भारतीय राजनीति के केंद्र में रहे।", "ee": "Gandhiji returned to India in 1915 and dominated Indian politics till 1948."},
    {"q": "The last of the pre-historic invention was :", "o": ["hunting", "cooking", "writing", "taming"], "a": 2, "y": "BSEB 2025 (A) · I.Sc.", "eh": "गांधीजी के अनुसार लेखन-कला (writing) प्रागैतिहासिक आविष्कारों की अंतिम कड़ी थी।", "ee": "Gandhi counts writing as the last of the great prehistoric inventions."},
    {"q": "The food in Indian villages were served on ...... leaves.", "o": ["banana", "banyan", "papaya", "mango"], "a": 0, "y": "BSEB 2025 (A) · I.Sc.", "eh": "पाठ के अनुसार भारतीय गाँवों में भोजन केले के पत्तों (banana leaves) पर परोसा जाता था।", "ee": "The lesson says food in Indian villages was served on banana leaves."},
    {"q": "...... prefers spiritualism to materialism.", "o": ["Rajiv Gandhi", "Dr. Zakir Hussain", "Dr. Rajendra Prasad", "Mahatma Gandhi"], "a": 3, "y": "BSEB 2025 (A) · I.A.", "eh": "यह कथन गांधीजी का है — वे भौतिकवाद की अपेक्षा आध्यात्मवाद (spiritualism) को महत्त्व देते थे।", "ee": "This preference for spiritualism over materialism is Mahatma Gandhi's."},
    {"q": "Attic civilization belongs to :", "o": ["India", "Greece", "Rome", "China"], "a": 1, "y": "BSEB 2024 (A) · I.Sc.", "eh": "Attic सभ्यता प्राचीन यूनान (Greece) की है; वहाँ का क्षेत्र 'Attica' कहलाता था।", "ee": "Attic civilisation belongs to ancient Greece (Attica)."},
    {"q": "'Our ancestors, therefore, set a limit to our ...... ?", "o": ["land", "indulgences", "towns", "grains"], "a": 1, "y": "BSEB 2024 (A) · I.Sc.", "eh": "गांधीजी कहते हैं कि हमारे पूर्वजों ने भोग-विलास (indulgences) पर सीमा लगाई थी।", "ee": "Gandhi says our ancestors set a limit to our indulgences."},
    {"q": "...... has taught us to be friendly towards one another.", "o": ["Progress", "Ideas", "Inventions", "Civilization"], "a": 3, "y": "BSEB 2024 (A) · I.A.", "eh": "गांधीजी के अनुसार सभ्यता (civilization) ने हमें एक-दूसरे के प्रति मित्रवत होना सिखाया।", "ee": "According to Gandhi, civilization has taught us to be friendly towards one another."},
    {"q": "Civilization helps in the development of :", "o": ["sense of duty", "non-living things", "spiritualism", "animals and birds"], "a": 0, "y": "BSEB 2024 (A) · I.A.", "eh": "सभ्यता मनुष्य में कर्तव्य-बोध (sense of duty) का विकास करती है — यही गांधीजी की सभ्यता-परिभाषा का मूल है।", "ee": "Civilization develops the sense of duty in man."},
    {"q": "According to Gandhi, mind is a :", "o": ["restless bird", "restless body", "restless heart", "restless soul"], "a": 0, "y": "BSEB 2024 (A) · I.A.", "eh": "गांधीजी ने मन को 'restless bird' (बेचैन पक्षी) कहा है — जितना मिलता है, उतना और चाहता है।", "ee": "Gandhi calls the mind a restless bird."},
    {"q": "In no civilization have all men attained ......", "o": ["enmity", "jealousy", "perfection", "education"], "a": 2, "y": "BSEB 2023 (A) · I.A.", "eh": "गांधीजी कहते हैं कि किसी भी सभ्यता में सभी मनुष्यों ने पूर्णता (perfection) प्राप्त नहीं की।", "ee": "In no civilisation have all men attained perfection."},
    {"q": "The Gujarati equivalent for civilization means—", "o": ["bad conduct", "intelligent conduct", "good conduct", "delightful conduct"], "a": 2, "y": "BSEB 2021 (A) · I.Sc.", "eh": "'सभ्यता' का गुजराती पर्याय 'सदाचार' है अर्थात् good conduct (अच्छा आचरण)।", "ee": "The Gujarati equivalent of civilization means good conduct."},
    {"q": "\"Civilization is that mode of conduct which points out to man the path of duty.\" is from—", "o": ["Indian Civilization and Culture", "A Child is Born", "A Marriage Proposal", "Bharat is My Home"], "a": 0, "y": "BSEB 2021 (A) · I.Sc.", "eh": "यह पंक्ति गांधीजी के निबंध 'Indian Civilization and Culture' से है।", "ee": "This definition is from 'Indian Civilization and Culture'."},
    {"q": "\"Some of the immediate and brilliant results of modern inventions are too maddening to resist.\" is from—", "o": ["Bharat is My Home", "A Pinch of Snuff", "Indian Civilization and Culture", "Ideas That Have Helped Mankind"], "a": 2, "y": "BSEB 2021 (A) · I.Sc.", "eh": "यह उद्धरण भी 'Indian Civilization and Culture' से लिया गया है।", "ee": "This line is from 'Indian Civilization and Culture'."},
    {"q": "\"The more we indulge in our passions, the more unbridled they become\" is taken from—", "o": ["Bharat is My Home", "Indian Civilization and Culture", "How Free is the Press", "A Child is Born"], "a": 1, "y": "BSEB 2021 (A) · I.A.", "eh": "यह पंक्ति 'Indian Civilization and Culture' से है — भोग बढ़ने से वासनाएँ अनियंत्रित होती जाती हैं।", "ee": "The line is taken from 'Indian Civilization and Culture'."},
    {"q": "...... were satisfied with true Home Rule.", "o": ["Our ancestors", "Germans", "Italians", "Greeks"], "a": 0, "y": "BSEB 2021 (A) · I.A.", "eh": "गांधीजी के अनुसार हमारे पूर्वज सच्चे Home Rule (स्वराज) से संतुष्ट थे।", "ee": "Our ancestors were satisfied with true Home Rule."},

      {"q": "उत्तल लेन्स के प्रधान अक्ष के ऊपर रखे बिन्दु का लेन्स से बने प्रतिबिम्ब को दिखाने वाले किरण आरेख खींचिए यदि वस्तु फोकस दूरी से तीन गुनी दूरी पर है।", "a": "यहाँ u = −3f (जहाँ f = उत्तल लेन्स की फोकस दूरी)। 1/v − 1/u = 1/f ⇒ 1/v = 1/f + 1/u = 1/f + 1/(−3f) = 2/(3f) ⇒ v = 3f/2 = 1.5f। अतः किरण आरेख निम्नांकित चित्र में प्रदर्शित है— [चित्र: उत्तल लेंस; वस्तु O, 3f पर; प्रतिबिम्ब I, 1.5f पर]", "n": 104},
      {"q": "f₁ फोकस दूरी के एक उत्तल लेन्स को f₂ फोकस दूरी के एक अन्य अवतल लेन्स के सम्पर्क में रखा जाता है। इस संयोजन की फोकस दूरी ज्ञात कीजिए।", "a": "सूत्र के अनुसार, 1/F = 1/f₁ + 1/f₂। यहाँ f₁ धनात्मक तथा f₂ ऋणात्मक है। ∴ 1/F = 1/f₁ − 1/f₂ = (f₂−f₁)/(f₁f₂) ⇒ समतुल्य फोकस दूरी F = (f₁f₂)/(f₂−f₁)।", "n": 105},
      {"q": "व्यतिकरण तथा विवर्तन में अन्तर स्पष्ट कीजिए।", "a": "व्यतिकरण तथा विवर्तन में निम्नलिखित अन्तर हैं— 1. व्यतिकरण दो कला सम्बद्ध स्रोतों से निकलने वाली तरंगाग्रों के बीच अध्यारोपण से होता है। जबकि विवर्तन एक ही तरंगाग्र के विभिन्न बिन्दुओं से निकलने वाली द्वितीयक तरंगिकाओं के बीच अध्यारोपण से होता है। 2. व्यतिकरण में अदीप्त फ्रिन्ज की तीव्रता ठीक शून्य अथवा बहुत कम होती है। जबकि विवर्तन की घटना में बैण्ड की तीव्रता कभी भी शून्य नहीं होती है। 3. व्यतिकरण में सभी दीप्त फ्रिन्जों की तीव्रता बराबर होती है। जबकि विवर्तन प्रतिरूप में दीप्त बैण्डों की तीव्रता घटते क्रम में होती है। 4. व्यतिकरण की घटना में दीप्त तथा अदीप्त फ्रिन्जों के बीच पर्याप्त विपर्यास (good contrast) होता है। जबकि विवर्तन की घटना में दीप्त व अदीप्त फ्रिन्जों के बीच मंद विपर्यास (poor contrast) होता है। 5. व्यतिकरण फ्रिन्जें एक ही चौड़ाई की होती हैं। जबकि विवर्तन फ्रिन्जें कभी भी एक ही चौड़ाई की नहीं होतीं।", "n": 106, "y": "2025"},
      {"q": "मैलस का नियम लिखिए।", "a": "मैलस का नियम (Law of Malus): इस नियम के अनुसार, जब किसी ध्रुवक (Polariser) से आने वाले 'पूर्णतः' समतल-ध्रुवित प्रकाश किसी विश्लेषक (analyser) पर गिरता है तो विश्लेषक से निर्गत प्रकाश की तीव्रता, विश्लेषक की ध्रुवण दिशा तथा विश्लेषक पर आपतित प्रकाश के वैद्युत वेक्टर (अर्थात् ध्रुवण की ध्रुवण दिशा) के बीच कोण की कोज्या (cos) के वर्ग के अनुक्रमानुपाती होती है। यदि विश्लेषक पर गिरने वाले समतल-ध्रुवित प्रकाश की तीव्रता I₀ हो, तथा विश्लेषक व ध्रुवक की ध्रुवण दिशाओं के बीच कोण θ हो, तब विश्लेषक से निर्गत प्रकाश की तीव्रता उपर्युक्त नियम के आधार पर निम्नांकित सूत्र से जानी जाती है : I = I₀ cos²θ", "n": 107, "y": "2026"},
      {"q": "प्रकाश का व्यतिकरण (Interference of Light) क्या है? दो प्रकाश स्रोत द्वारा व्यतिकरण (sustained interference pattern) के लिए आवश्यक दो शर्तें बतावें। इस प्रकार उत्पन्न फ्रिन्ज पट्टिका पर : (i) पर्दे को स्रोत के नजदीक ले जाने का (moving screen closer to the planes of slits) (ii) दोनों स्रोत के बीच की दूरी बढ़ाने का क्या प्रभाव पड़ता है। (increasing the separation between two slits.)", "a": "प्रकाश का व्यतिकरण : प्रकाश तरंगों के अध्यारोपण के कारण प्रकाशित क्षेत्र पर प्रदीप्ति घनत्व के पुनर्वितरण की घटना को प्रकाश का व्यतिकरण कहा जाता है। अध्यारोपण के कारण प्रदीप्ति घनत्व के अधिकतम होने की प्रक्रिया को संपोषी व्यतिकरण तथा प्रदीप्ति घनत्व के न्यूनतम होने की प्रक्रिया को विनाशी व्यतिकरण कहते हैं। व्यतिकरण की शर्तें : (i) दोनों प्रकाश स्रोतों को कला संबद्ध होना चाहिए। (ii) प्रकाश के दोनों स्रोतों से लगातार एक ही तरंगदैर्घ्य तथा आवृत्ति की तरंगें उत्सर्जित होनी चाहिए अर्थात् स्रोत को एकवर्णी होना चाहिए। फ्रिन्ज चौड़ाई पर प्रभाव : • पर्दे को स्रोत के नजदीक ले जाने पर फ्रिन्ज की चौड़ाई बढ़ जाती है। • दोनों स्रोतों के बीच की दूरी बढ़ाने पर फ्रिन्ज की चौड़ाई घट जाती है।", "n": 108},
      {"q": "पोलेराइड क्या है? इसके दो उपयोगों को लिखें।", "a": "ध्रुवक सिर्फ वैसे प्रकाश को अपने से पार करने देता है, जिससे सम्बन्धित विद्युत क्षेत्र के कम्पन की दिशा एकदिश होती है। उपयोग : (1) प्रकाश को समतल ध्रुवित बनाने हेतु। (2) प्रकाश के ध्रुवण का विश्लेषण करने हेतु।", "n": 109, "y": "2013, 2012"},
      {"q": "आवर्धन एवं आवर्धन क्षमता में क्या अन्तर है? (What is the difference between Magnification and Magnifying power?)", "a": "आवर्धन एवं आवर्धन क्षमता में निम्नलिखित अन्तर हैं— • आवर्धन रेखीय आवर्धन है जो h₂/h₁ के बराबर होता है जबकि आवर्धन क्षमता कोणीय आवर्धन है जो ∠β/∠α के बराबर होता है। • आवर्धन का मान v के बढ़ने से बढ़ता है, जबकि आवर्धन क्षमता का मान v के बढ़ने से घटता है। • आवर्धन का मान −∞ एवं +∞ के बीच हो सकता है, जबकि आवर्धन क्षमता का मान D/f तथा 1+D/f के बीच हो सकता है। • आवर्धन निश्चित शर्त के अधीन आवर्धन क्षमता के बराबर होता है, जबकि आवर्धन क्षमता आवर्धन की एक विशेष शर्त है जब Ve = D हो।", "n": 110, "y": "2010, 2020, 2026"},
      {"q": "गोलीय विपथन (Spherical aberration) को कैसे कम किया जा सकता है?", "a": "एक लेंस के लिए गोलीय विपथन का परिणाम वस्तु-दूरी एवं वक्रता-त्रिज्या पर निर्भर करता है। इसे निम्न तरीकों द्वारा न्यूनतम किया जा सकता है— (a) लेंस के सम्मुख एक डायफ्रॉम का उपयोग कर इसके प्रभावित मुख्य फोकस को घटाकर गोलीय विपथन को कम किया जा सकता है। केवल संकीर्ण किरणों को इस लेंस से होकर गुजरने दिया जाता है। (b) लेंस के सतह की उचित वक्रता का चयन कर गोलीय विपथन को कम किया जा सकता है। (c) अगर प्रकाश किरणों के कुल विचलन को लेंस के दो सतहों पर वितरित किया जाता है तो गोलीय विपथन कम होता है। समतल लेंस के मामले में जब आपतित किरणें वक्र सतह पर आपतित होती हैं तो विपथन काफी कम होता है। गोलीय विपथन के दोष को कम करने के लिए एक रोक (Stop) को व्यवहार में लाया जाता है।", "n": 111, "y": "2026"},
      {"q": "क्रांतिक कोण को परिभाषित करें। इसकी शर्तों को लिखें।", "a": "जब प्रकाश की किरण सघन माध्यम से विरल माध्यम में जाती है तब सघन माध्यम में किरण का वह आपतन कोण जिसके अनुरूप विरल माध्यम में अपवर्तित किरण का अपवर्तन कोण 90° होता है, दिए गए दो माध्यमों के लिए क्रांतिक कोण कहलाता है। क्रांतिक कोण की शर्तें : • प्रकाश की किरणों को प्रकाशीय सघन माध्यम से प्रकाशीय विरल माध्यम में गमन करना, • आपतन कोण का मान उस माध्यम के क्रांतिक कोण से अधिक होना।", "n": 112, "y": "2024"},
      {"q": "सौर वर्णपट्ट में फ्रानहॉफर रेखाएँ क्या होती हैं? इनकी व्याख्या कैसे की जाती हैं? (What are Franhoffer's line in solar spectra. How they are interpreted?)", "a": "1814 में फ्रॉनहोफर ने प्रेक्षित किया कि सौर स्पेक्ट्रम कई सौ अंध रेखाओं द्वारा पार किया हुआ होता है। उन्होंने इन रेखाओं का जो फ्रॉनहोफर रेखाएँ कहलाती हैं, तरंगदैर्घ्य के चार्ट पर मानचित्र बनाया और प्रमुख रेखाओं को अंग्रेजी अक्षर-क्रम के अनुसार उनका नाम रखा। अतः स्पेक्ट्रम के नीले भाग में अंध रेखा F रेखा, पीले भाग में अंध रेखा D रेखा और लाल भाग में अंध C रेखा कहलायी। फ्रॉनहोफर रेखाएँ सौर वायुमण्डल में वाष्पावस्था में निश्चित तत्वों की उपस्थिति सूचित करती हैं। वाष्प सूर्य के केन्द्रीय गर्म भाग से अधिक ठंडे रहते हैं और वे सूर्य के संततः स्पेक्ट्रम से अपने अभिलाक्षणिक तरंगदैर्यों का अवशोषण कर लेते हैं। प्रत्येक तत्व का अभिलाक्षणिक स्पेक्ट्रम होता है। तदनुसार, सौर स्पेक्ट्रम में फ्रॉनहोफर रेखाओं के तरंगदैर्यों के अध्ययन से सूर्य के चारों ओर तत्वों को पहचानना संभव हुआ और यह तभी ज्ञात हुआ कि हाइड्रोजन एवं हीलियम उपस्थित हैं। D रेखा पीली सोडियम उत्सर्जन रेखा है।", "n": 113},
      {"q": "लेंस के फोकस, संवर्द्धन और क्षमता की परिभाषा दें। (Define focus, magnification and power of a lens.)", "a": "फोकस : लेन्स के मुख्य अक्ष पर स्थित वह बिन्दु जहाँ रखी वस्तु का प्रतिबिम्ब अनन्त पर बनता है उसे फोकस कहते हैं। संवर्द्धन : लेन्स द्वारा बने किसी वस्तु के प्रतिबिम्ब की लम्बाई तथा स्वयं वस्तु की लम्बाई के अनुपात को लेन्स का संवर्द्धन कहते हैं। m = प्रतिबिम्ब का आकार/वस्तु का आकार। क्षमता : मुख्य अक्ष से एकांक दूरी पर आपतित किरण में लेन्स द्वारा जितना विचलन उत्पन्न होता है, उसे उस लेंस की क्षमता कहते हैं। P = 1/f(m)", "n": 114},
      {"q": "पूर्ण आन्तरिक परावर्तन क्या है? इसकी शर्तें क्या हैं? इसका कोई एक उपयोग बताएँ। (What is total internal reflection? What are condition for it? Name any one of its practical application.)", "a": "जब सघन माध्यम में संचरित होता हुआ प्रकाश विरल माध्यम में इस प्रकार प्रवेश करता है कि उसके आपतन कोण का मान क्रान्तिक कोण से ज्यादा हो तो, प्रकाश वापस परावर्तित हो जाता है। यह घटना पूर्ण आन्तरिक परावर्तन कहलाती है। पूर्ण आन्तरिक परावर्तन के लिए शर्तें : (i) प्रकाश सघन माध्यम से विरल माध्यम की ओर गतिमान होना चाहिए। (ii) आपतन कोण का मान दिए गए माध्यमों के क्रान्तिक कोण से अधिक होना चाहिए। इसका उपयोग दूरसंचार में संकेत Transmit करने में किया जाता है।", "n": 115, "y": "2021, 2025"},
      {"q": "समतुल्य लेंस की परिभाषा दें। लेंसों के अवर्णक समूहन के लिये व्यंजक लिखें। (Define equivalent lens. Write expression (only) for achromatice combination of lenses.)", "a": "समतुल्य लेंस : यदि ऐसे किसी लेंस-निकाय के बदले एक ऐसा लेंस लिया जाए जिसे लेंस-निकाय की अक्ष पर उपयुक्त स्थान पर रखने से किसी वस्तु का प्रतिबिम्ब उसी स्थान पर तथा उतने ही आवर्धन का बने जितना कि लेंस-निकाय द्वारा बनता है, तो उस अकेले लेंस को दिये गए लेंस-निकाय का समतुल्य लेंस कहते हैं। व्यंजक : 1/F = 1/f₁ + 1/f₂ − x/(f₁f₂)", "n": 116},
      {"q": "प्रकाश तरंगों का ध्रुवण तल एवं कम्पन तल की परिभाषा लिखें। (Define polarisation, plane of polarisation and plane of vibration.)", "a": "ध्रुवण : एक निश्चित दिशा में गमन करती हुई प्रकाश तरंग के तल के लम्बवत् एक निश्चित तल में प्रकाश तरंग के कम्पन्न बाधित कर दिए जाते हैं, तो इस घटना को प्रकाश का ध्रुवण कहते हैं। ध्रुवण तल : कम्पन्न तल के लम्बवत् वह तल जिसमें तरंग-संचरण की दिशा स्थित हो, ध्रुवण तल कहलाता है। कम्पन तल : समतल ध्रुवित प्रकाश में वह तल जिसमें तरंग-संचरण की दिशा तथा विद्युत वेक्टर के कम्पन्न की दिशा, दोनों स्थित हो, कम्पन तल कहलाता है।", "n": 117},

/* =========================================================
   STORAGE  (localStorage only — no server, no login)
   attempts[cid] = in-progress test { ans:{idx:choice}, marks:{idx:1}, idx, ts }
   history[cid]  = finished tests   [{ ts, n, c, w, sk, pct, ans:{} }]  (last 20 kept)
   ========================================================= */
var KEY = 'class12app.v2';
var DB = { attempts:{}, history:{} };
try {
  var raw = localStorage.getItem(KEY);
  if (raw) { var p = JSON.parse(raw);
    if (p && typeof p === 'object') { DB.attempts = p.attempts || {}; DB.history = p.history || {}; } }
} catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){} }
function getAt(cid, create){
  var a = DB.attempts[cid];
  if (!a && create) a = DB.attempts[cid] = { ans:{}, marks:{}, idx:0, ts:Date.now() };
  return a;
}
function histOf(cid){ return DB.history[cid] || []; }
function bestOf(cid){ var b=null; histOf(cid).forEach(function(e){ if (b===null || e.pct>b) b=e.pct; }); return b; }
function countKeys(o){ var n=0; for (var k in o) if (Object.prototype.hasOwnProperty.call(o,k)) n++; return n; }

function tally(cid, ans){
  var bank = BANK[cid] || [], c=0, w=0;
  for (var i=0;i<bank.length;i++){
    if (ans[i] !== undefined){ if (ans[i] === bank[i].a) c++; else w++; }
  }
  return { n:bank.length, c:c, w:w, answered:c+w, skipped:bank.length-c-w };
}

function tile(glyph){
  if (IC[glyph]) return IC[glyph];
  var t = {hin:'अ', eng:'Aa', math:'π'}[glyph] || '•';
  return '<span class="gl">'+t+'</span>';
}
function subj(id){ for (var i=0;i<SUBJECTS.length;i++) if (SUBJECTS[i].id===id) return SUBJECTS[i]; return null; }
function chapOf(cid){
  for (var i=0;i<SUBJECTS.length;i++){ var s=SUBJECTS[i];
    for (var j=0;j<s.chapters.length;j++) if (s.chapters[j].id===cid) return {s:s,c:s.chapters[j]};
    if (s.exercise && s.exercise.id===cid) return {s:s,c:s.exercise,ex:true};
  } return null;
}
function head(opts){
  var back=document.getElementById('backBtn'), brand=document.getElementById('brand'), tb=document.getElementById('titlebox');
  if (opts.back){
    back.hidden=false; brand.hidden=true; tb.hidden=false;

    document.getElementById('tbCrumb').textContent=opts.crumb||'';
    back.onclick=function(){ location.hash=opts.back; };
  } else { back.hidden=true; brand.hidden=false; tb.hidden=true; }

}

function chips(s, cur){
  var h='<nav class="chapnav" aria-label="Chapters"><div class="chips">';
  s.chapters.forEach(function(c){
    h+='<button class="chip" '+(c.id===cur?'aria-current="true"':'')+' data-go="#/c/'+c.id+'">अध्याय '+c.no+' · '+c.hi+'</button>';
  });
  if (s.exercise) h+='<button class="chip" '+(s.exercise.id===cur?'aria-current="true"':'')+' data-go="#/e/'+s.exercise.id+'">'+s.exercise.hi+'</button>';
  return h+'</div></nav>';
}
function subjectView(sid){
  var s=subj(sid); if(!s) return home();
  head({back:'#/', title:s.hi+' · '+s.en, crumb:'Class 12', cls:s.cls});
  if (!s.chapters.length){
    $app.innerHTML='<section class="view"><div class="chead"><div class="kicker">Class 12</div><h1>'+s.hi+'</h1><div class="en">'+s.en+'</div></div>'+
      '<div class="empty"><div class="ei">'+IC.clock+'</div><h2>नई सामग्री जल्द आएगी</h2><p>Content coming soon</p></div>'+
      '<button class="btn ghost" data-go="#/">← सभी विषय · All subjects</button><div class="pad"></div></section>';
    return;
  }
  function cards(list){
    var x='';
    list.forEach(function(c){
      var b=bestOf(c.id), n=histOf(c.id).length, at=getAt(c.id,false), line;
      if (n) line='सर्वश्रेष्ठ · Best '+b+'% &nbsp;·&nbsp; '+n+' प्रयास · attempt'+(n>1?'s':'');
      else if (at && countKeys(at.ans)) line='जारी · In progress';
      else line='अभी तक कोई प्रयास नहीं · Not attempted yet';
      x+='<button class="ccard" data-go="#/c/'+c.id+'"><span class="cnum"><small>CH</small><b>'+c.no+'</b></span>'+
         '<span class="cbody"><h3>'+c.hi+'</h3><div class="en">'+c.en+'</div><div class="cnt">'+c.total+' MCQs</div>'+
         '<div class="sub">'+line+'</div>'+(n?'<div class="bar"><i style="width:'+b+'%"></i></div>':'')+'</span>'+
         '<span class="chev">'+IC.chev+'</span></button>';
    });
    return x;
  }
  var h='<section class="view">'+chips(s,'');
  if (s.sections){
    s.sections.forEach(function(sec){
      h+='<div class="sec-title">'+sec.hi+' · '+sec.en.toUpperCase()+'</div>';
      var list=s.chapters.filter(function(c){ return c.sec===sec.id; });
      if (list.length) h+=cards(list);
      else h+='<div class="empty"><div class="ei">'+IC.clock+'</div><h2>नई सामग्री जल्द आएगी</h2><p>'+sec.en+' content coming soon</p></div>';
    });
  } else {
    h+='<div class="sec-title">अध्याय · CHAPTERS</div>'+cards(s.chapters);
  }
  if (s.exercise){
    var e=s.exercise;
    h+='<div class="sec-title">अभ्यास · PRACTICE</div>'+
       '<button class="ccard" data-go="#/e/'+e.id+'"><span class="cnum"><small>EX</small><b>✎</b></span>'+
       '<span class="cbody"><h3>'+e.hi+'</h3><div class="en">'+e.en+'</div><div class="cnt">'+e.short+' लघु · Short &nbsp;+&nbsp; '+e.long+' दीर्घ · Long</div></span>'+
       '<span class="chev">'+IC.chev+'</span></button>';
  }
  $app.innerHTML=h+'<div class="pad"></div></section>';
}
