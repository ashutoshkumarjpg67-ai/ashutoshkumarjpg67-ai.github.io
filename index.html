<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Class 12 Study App</title>
<style>
/* =========================================================
   DESIGN SYSTEM  —  Class 12 Study App
   Light theme · mobile-first · zero external requests
   ========================================================= */
:root{
  /* Latin from the system, Devanagari falls through to Noto Sans Devanagari */
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
          "Noto Sans Devanagari", "Noto Sans", "Nirmala UI", "Mangal", sans-serif;

  --bg:#F4F5FB; --surface:#FFFFFF; --ink:#1B1F3B; --ink-2:#4A5070; --ink-3:#7B819E;
  --line:#E5E7F2; --line-2:#EEF0F8;

  --ok:#15803D; --ok-bg:#E8F7EE; --ok-line:#86D3A3;
  --bad:#B91C1C; --bad-bg:#FDECEC; --bad-line:#F3A5A5;
  --warn:#B45309; --warn-bg:#FFF4DC; --warn-line:#F3CF84;

  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --sh-1:0 1px 2px rgba(27,31,59,.05), 0 2px 8px rgba(27,31,59,.05);
  --sh-2:0 2px 4px rgba(27,31,59,.05), 0 10px 28px rgba(27,31,59,.09);

  /* accent (default = indigo); swapped per subject by .t-* classes on <body>/cards */
  --ac:#4F46E5; --ac-d:#3730A3; --ac-soft:#EEF0FF; --ac-mid:#C7CBFB;
}
.t-phy {--ac:#4F46E5;--ac-d:#3730A3;--ac-soft:#EEF0FF;--ac-mid:#C7CBFB}  /* Physics   – indigo */
.t-chem{--ac:#0D9488;--ac-d:#0F766E;--ac-soft:#E6F7F5;--ac-mid:#A7E3DC}  /* Chemistry – teal   */
.t-bio {--ac:#16A34A;--ac-d:#15803D;--ac-soft:#E8F7EE;--ac-mid:#A9E2BC}  /* Biology   – green  */
.t-hin {--ac:#EA580C;--ac-d:#C2410C;--ac-soft:#FFF1E6;--ac-mid:#FBC9A3}  /* Hindi     – orange */
.t-eng {--ac:#9333EA;--ac-d:#7E22CE;--ac-soft:#F5EBFF;--ac-mid:#DDBBF8}  /* English   – purple */
.t-math{--ac:#E11D48;--ac-d:#BE123C;--ac-soft:#FFE9EE;--ac-mid:#F8B4C3}  /* Math      – rose   */

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font); background:var(--bg); color:var(--ink);
  font-size:16px; line-height:1.7; font-kerning:normal; text-rendering:optimizeLegibility;
  word-break:normal; overflow-wrap:break-word; letter-spacing:0; /* never track Devanagari */
  min-height:100vh; overflow-x:hidden; padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;min-width:0}
button:focus-visible{outline:3px solid var(--ac-mid);outline-offset:2px;border-radius:var(--r-sm)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px;width:100%}
svg{display:block}

/* ---------- App header ---------- */
.appbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.93);
  backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.appbar .row{display:flex;align-items:center;gap:10px;height:56px}
.back{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bg);color:var(--ink);flex:none}
.back:active{background:var(--line)}
.back svg{width:20px;height:20px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,#4F46E5,#0D9488)}
.logo svg{width:20px;height:20px}
.app-title{font-weight:700;font-size:17px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb{font-size:12.5px;color:var(--ink-3);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titlebox{min-width:0;flex:1}
[hidden]{display:none!important}

/* ---------- Sticky chapter navigation ---------- */
.chapnav{position:sticky;top:calc(57px + env(safe-area-inset-top));z-index:25;background:var(--bg);padding:10px 0 8px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 16px;margin:0 -16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);
  font-size:14px;font-weight:600;color:var(--ink-2);line-height:1.5;min-height:40px;display:flex;align-items:center;white-space:nowrap}
.chip[aria-current="true"]{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.12)}

/* ---------- Home ---------- */
.hero{padding:22px 0 6px}
.hero h1{font-size:24px;line-height:1.4;font-weight:700}
.hero p{color:var(--ink-2);font-size:15px;margin-top:2px}
.grid{display:grid;gap:14px;padding:14px 0 28px}
.scard{display:block;width:100%;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1);
  border:1px solid var(--line);padding:18px 16px 16px;position:relative;overflow:hidden;transition:transform .15s}
.scard::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--ac)}
.scard:active{transform:scale(.985)}
.scard .top{display:flex;align-items:center;gap:14px;padding-right:26px}
.icon-tile{width:56px;height:56px;border-radius:16px;background:var(--ac-soft);color:var(--ac-d);display:grid;place-items:center;flex:none}
.icon-tile svg{width:30px;height:30px}
.gl{font-size:27px;font-weight:700;line-height:1}
.scard h2{font-size:21px;line-height:1.4;font-weight:700}
.scard .en{color:var(--ink-2);font-size:14.5px;line-height:1.4}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pill{display:inline-flex;align-items:center;padding:3px 12px;border-radius:999px;background:var(--ac-soft);color:var(--ac-d);font-size:13.5px;font-weight:600;line-height:1.6}
.pill.soon{background:var(--line-2);color:var(--ink-2)}
.go{position:absolute;right:14px;top:26px;color:var(--ink-3)}
.go svg{width:20px;height:20px}

/* ---------- Lists / chapter cards ---------- */
.sec-title{font-size:13.5px;font-weight:700;color:var(--ink-3);padding:18px 2px 8px;line-height:1.5}
.ccard{display:flex;gap:14px;align-items:center;width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-md);padding:14px;box-shadow:var(--sh-1);margin-bottom:12px;transition:transform .15s}
.ccard:active{transform:scale(.985)}
.cnum{width:48px;height:48px;border-radius:14px;background:var(--ac-soft);color:var(--ac-d);flex:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.cnum small{font-size:10.5px;font-weight:600;opacity:.85}
.cnum b{font-size:19px}
.cbody{flex:1;min-width:0}
.cbody h3{font-size:17px;line-height:1.5;font-weight:700}
.cbody .en{font-size:14px;color:var(--ink-2);line-height:1.4}
.cbody .cnt{font-size:13.5px;color:var(--ac-d);font-weight:600;margin-top:4px;line-height:1.5}
.cbody .sub{font-size:13px;color:var(--ink-2);line-height:1.5;margin-top:2px}
.bar{height:6px;border-radius:99px;background:var(--line-2);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .3s}
.chev{color:var(--ink-3);flex:none}.chev svg{width:20px;height:20px}

/* ---------- Chapter / subject header ---------- */
.chead{margin-top:6px;background:linear-gradient(135deg,var(--ac-d),var(--ac));color:#fff;border-radius:var(--r-lg);
  padding:22px 20px;box-shadow:var(--sh-2);position:relative;overflow:hidden}
.chead::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.chead .kicker{font-size:13.5px;font-weight:600;opacity:.92;line-height:1.6}
.chead h1{font-size:26px;line-height:1.45;font-weight:700;margin-top:2px}
.chead .en{font-size:15.5px;opacity:.95;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 6px;text-align:center;box-shadow:var(--sh-1)}
.stat b{display:block;font-size:22px;line-height:1.3;color:var(--ac-d)}
.stat span{font-size:12.5px;color:var(--ink-2);line-height:1.45;display:block}
.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--bad)}.stat.skip b{color:var(--ink-2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:12px 16px;
  border-radius:var(--r-md);background:var(--ac);color:#fff;font-weight:700;font-size:16.5px;box-shadow:0 6px 16px rgba(0,0,0,.14);text-align:center;line-height:1.5}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:var(--surface);color:var(--ac-d);border:1.5px solid var(--ac-mid);box-shadow:none}
.btn.danger{background:var(--surface);color:var(--bad);border:1.5px solid var(--bad-line);box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.stack{display:grid;gap:10px}
.empty{text-align:center;padding:34px 18px;color:var(--ink-2);background:var(--surface);border:1px dashed var(--ac-mid);border-radius:var(--r-lg);margin:14px 0}
.empty .ei{width:64px;height:64px;border-radius:20px;background:var(--ac-soft);color:var(--ac-d);display:grid;place-items:center;margin:0 auto 12px}
.empty .ei svg{width:32px;height:32px}
.empty h2{font-size:20px;line-height:1.5;color:var(--ink)}
.empty p{font-size:15px;line-height:1.6}

.hrow{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh-1)}
.hrow .d{flex:1;min-width:0;font-size:14px;color:var(--ink-2);line-height:1.5}
.hrow .d b{display:block;color:var(--ink);font-size:15.5px}
.hrow .pc{font-weight:700;color:var(--ac-d);font-size:16px;flex:none}

/* ---------- Quiz ---------- */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0 0}
.qcount{font-size:14.5px;font-weight:700;color:var(--ac-d);white-space:nowrap}
.tbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;min-height:40px;border-radius:999px;background:var(--surface);
  border:1.5px solid var(--ac-mid);color:var(--ac-d);font-weight:600;font-size:14px;line-height:1.5;white-space:nowrap}
.tbtn svg{width:18px;height:18px;flex:none}
.qbar{margin:8px 0 14px;height:7px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-2);padding:18px 16px}
.qhead{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.qlead{display:inline-flex;align-items:center;flex-wrap:wrap;gap:6px;min-width:0}
.ytag{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);
  color:var(--ink-2);font-size:12.5px;font-weight:600;line-height:1.7;max-width:100%}
.qnum{display:inline-block;padding:2px 12px;border-radius:999px;background:var(--ac-soft);color:var(--ac-d);font-size:13px;font-weight:700;line-height:1.7}
.mbtn{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;min-height:38px;border-radius:999px;border:1.5px solid var(--line);
  color:var(--ink-2);font-size:13.5px;font-weight:600;line-height:1.5;background:var(--surface);white-space:nowrap}
.mbtn svg{width:16px;height:16px;flex:none}
.mbtn.on{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.mbtn.on svg{fill:currentColor}
.qtext{font-size:19px;line-height:1.75;font-weight:600}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;padding:13px 12px;min-height:56px;border-radius:var(--r-md);
  border:1.5px solid var(--line);background:var(--surface);transition:background .15s,border-color .15s,transform .1s}
.opt:active:not([disabled]){transform:scale(.99);background:var(--ac-soft)}
.opt .ltr{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:var(--bg);color:var(--ink-2);font-weight:700;font-size:14px;line-height:1;margin-top:1px}
/* option text: Hindi + English share ONE run — same size, same weight */
.opt .txt{flex:1;min-width:0;font-size:16.5px;font-weight:500;line-height:1.7;color:var(--ink)}
.opt .mk{flex:none;width:24px;height:24px;margin-top:3px;display:none}
.opt[disabled]{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.opt.ok .ltr{background:var(--ok);color:#fff}
.opt.ok .mk{display:block;color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-line)}
.opt.bad .ltr{background:var(--bad);color:#fff}
.opt.bad .mk{display:block;color:var(--bad)}
.opt.dim{opacity:.62}

.expl{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.expl.open{grid-template-rows:1fr;margin-top:16px}
.expl>div{overflow:hidden;min-height:0}
.expl-in{border-radius:var(--r-md);background:var(--ac-soft);border:1px solid var(--ac-mid);padding:14px 14px}
.verdict{font-weight:700;font-size:15.5px;line-height:1.6;margin-bottom:6px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.elabel{font-size:12.5px;font-weight:700;color:var(--ac-d);line-height:1.5;margin-top:8px}
.etext{font-size:16px;line-height:1.8;color:var(--ink)}

/* Bottom bar is FIXED to the viewport: Previous | palette | Next are always visible and tappable */
.qnav{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:rgba(244,245,251,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.qnav .in{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:stretch}
.qnav .btn{box-shadow:none;padding:10px 8px;flex:1 1 0;width:auto;min-width:0;font-size:15.5px}
.qnav .btn.ghost{flex:0 0 auto;padding:10px 12px}
.qnav .btn.pal{gap:6px;font-size:14px}
.qnav .btn.pal svg{width:20px;height:20px}
.qpad{height:112px}                 /* keeps the explanation clear of the fixed bar */
.expl{scroll-margin-bottom:112px}

/* ---------- Question palette (bottom sheet) ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet .sb{position:absolute;inset:0;background:rgba(20,22,48,.45);animation:fade .2s ease both}
.sheet .sp{position:relative;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--surface);
  border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.2);animation:up .25s ease both}
.sp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sp-head h2{font-size:18px;line-height:1.5}
.x{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin-bottom:12px;line-height:1.5}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line);background:var(--surface);flex:none}
.sw.a{background:var(--ac);border-color:var(--ac)}
.sw.m{background:var(--warn-bg);border-color:var(--warn)}
.sw.c{border-color:var(--ink);border-width:2px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.pc{height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  font-weight:700;font-size:15px;display:grid;place-items:center;position:relative;text-align:center;line-height:1}
.pc.a{background:var(--ac);border-color:var(--ac);color:#fff}
.pc.m{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.pc.m.a::after{content:"";position:absolute;right:4px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--ac)}
.pc.cur{outline:3px solid var(--ink);outline-offset:1px}
.sumline{margin:14px 0 12px;font-size:14.5px;color:var(--ink-2);line-height:1.7}
.sumline b{color:var(--ink)}
.confirm{margin-top:14px;padding:14px;border-radius:var(--r-md);background:var(--warn-bg);border:1px solid var(--warn-line);color:#6B3F05;font-size:15px;line-height:1.7}
.confirm .stack{margin-top:12px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}

/* ---------- Result / analysis ---------- */
.rhero{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-2);padding:22px 16px;margin-top:8px}
.ring{width:132px;height:132px;border-radius:50%;margin:4px auto 12px;display:grid;place-items:center;
  background:conic-gradient(var(--ac) calc(var(--p)*1%), var(--line-2) 0)}
.ring span{width:104px;height:104px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:28px;font-weight:700;color:var(--ac-d)}
.rhero h2{font-size:20px;line-height:1.5}
.rhero p{color:var(--ink-2);font-size:14px;line-height:1.5}
.fchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 16px;margin:0 -16px 12px}
.fchips::-webkit-scrollbar{display:none}
.rv{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:var(--r-md);padding:14px;margin-bottom:12px;box-shadow:var(--sh-1)}
.rv.right{border-left-color:var(--ok)}.rv.wrong{border-left-color:var(--bad)}.rv.skip{border-left-color:#9AA0B8}
.rv-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.tag{font-size:13px;font-weight:700;line-height:1.6}
.rv.right .tag{color:var(--ok)}.rv.wrong .tag{color:var(--bad)}.rv.skip .tag{color:var(--ink-2)}
.rv .qtext{font-size:17px;font-weight:600}
.arow{margin-top:10px;padding:10px 12px;border-radius:var(--r-sm);background:var(--bg);font-size:15.5px;line-height:1.7}
.arow small{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);line-height:1.5}
.arow.ok{background:var(--ok-bg)}.arow.ok small{color:var(--ok)}
.arow.bad{background:var(--bad-bg)}.arow.bad small{color:var(--bad)}
.rv .expl-in{margin-top:10px}

/* ---------- Exercise ---------- */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:4px;gap:4px;margin:14px 0}
.seg button{flex:1;text-align:center;padding:8px 6px;border-radius:11px;font-weight:600;font-size:14.5px;color:var(--ink-2);line-height:1.5;min-height:44px}
.seg button[aria-selected="true"]{background:var(--ac);color:#fff}
.qlist{list-style:none;counter-reset:q;display:grid;gap:12px;padding-bottom:30px}
.qlist li{counter-increment:q;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:16px 14px 16px 56px;font-size:17px;line-height:2;box-shadow:var(--sh-1)}
.qlist li::before{content:counter(q);position:absolute;left:12px;top:16px;width:32px;height:32px;border-radius:10px;
  background:var(--ac-soft);color:var(--ac-d);display:grid;place-items:center;font-weight:700;font-size:14.5px;line-height:1}
.qlist details{margin-top:6px}
.qlist summary{cursor:pointer;color:var(--ac-d);font-weight:600;font-size:14.5px;min-height:36px;line-height:2.2}
.qlist .ans{background:var(--ac-soft);border-radius:var(--r-sm);padding:10px 12px;font-size:16px;line-height:1.9}

.view{animation:rise .25s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pad{height:24px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:640px){
  .grid{grid-template-columns:1fr 1fr}
  .qtext{font-size:20px}
  .chead h1{font-size:30px}

    {"q": "किसी चालक का विशिष्ट प्रतिरोध बढ़ता है :", "o": ["तापमान बढ़ने से", "अनुप्रस्थ काट क्षेत्रफल बढ़ने से", "लम्बाई घटने से", "अनुप्रस्थ काट क्षेत्रफल घटने से"], "a": 0, "y": "BSEB 2018 (A)", "eh": "धातुओं की प्रतिरोधकता तापमान बढ़ने से बढ़ती है।", "ee": "The resistivity of a metal increases with rise in temperature."},
    {"q": "किसी चालक के संवहन वेग (V_d) तथा आरोपित विद्युत क्षेत्र (E) के बीच सम्बन्ध है :", "o": ["V_d ∝ √E", "V_d ∝ E", "V_d ∝ E²", "V_d = Constant"], "a": 1, "y": "BSEB 2018 (A), 2023 (A)", "eh": "अपवाह वेग V_d = eEτ/m, अतः V_d ∝ E होता है।", "ee": "Drift velocity V_d = eEτ/m, so V_d ∝ E."},
    {"q": "धातु के बने किसी घनाभ की चौड़ाई और ऊँचाई बराबर है तथा लंबाई चौड़ाई की दुगुनी है। समानान्तर सतहों के बीच महत्तम और लघुत्तम प्रतिरोधों का अनुपात होगा :", "o": ["8", "4", "2", "इनमें से कोई नहीं"], "a": 1, "y": "BSEB 2018 (C)", "eh": "R_max = ρ(2a)/a² = 2ρ/a (लंबाई 2a, काट a²); R_min = ρa/(2a²) = ρ/(2a) (लंबाई a, काट 2a²) ⇒ अनुपात = 4।", "ee": "R_max = ρ(2a)/a² = 2ρ/a (length 2a, area a²); R_min = ρa/(2a²) = ρ/(2a) (length a, area 2a²), so the ratio is 4."},
    {"q": "एक चालक में 3.2 A की धारा प्रवाहित हो रही है। इस चालक के किसी अनुप्रस्थ काट के आर-पार प्रति सेकेण्ड कितने इलेक्ट्रॉन प्रवाहित हो रहे होंगे ?", "o": ["2 × 10¹⁹", "3 × 10²⁰", "5.2 × 10¹⁹", "9 × 10²⁰"], "a": 0, "y": "BSEB 2018 (C)", "eh": "N = I/e ⇒ 3.2/(1.6 × 10⁻¹⁹) = 2 × 10¹⁹ इलेक्ट्रॉन प्रति सेकेण्ड।", "ee": "N = I/e ⇒ 3.2/(1.6 × 10⁻¹⁹) = 2 × 10¹⁹ electrons per second."},
    {"q": "किसी बन्द परिपथ के किसी लूप के विभिन्न बिन्दुओं के बीच के विभवान्तरों का बीजीय योग (प्रतिरोधों और सेलों को शामिल करते हुए) :", "o": ["शून्य से अधिक होता है।", "शून्य से कम होता है।", "शून्य होता है।", "अचर होता है।"], "a": 0, "y": "BSEB 2018 (C)", "eh": "किरचॉफ के पाश (द्वितीय) नियम से किसी बंद लूप में विभवान्तरों का बीजीय योग शून्य होता है। ⚠️ टिप्पणी: पुस्तक में उत्तर (A) छपा है, परंतु किरचॉफ के पाश नियम से सही उत्तर (C) शून्य होता है।", "ee": "By Kirchhoff's loop (second) law, the algebraic sum of potential differences around a closed loop is zero. Note: the book prints (A), but by Kirchhoff's loop law the correct answer is (C) zero."},
    {"q": "आवेशित चालक की ऊर्जा होती है :", "o": ["E = (1/2)C·V", "E = (1/2)CV²", "E = (1/2)C²V", "E = C·V"], "a": 1, "y": "BSEB 2022 (A)", "eh": "आवेशित चालक (संधारित्र) की ऊर्जा E = ½CV² होती है।", "ee": "The energy of a charged conductor (capacitor) is E = ½CV²."},
    {"q": "किलोवाट-घंटा (kWh) मात्रक है :", "o": ["शक्ति का", "ऊर्जा का", "बलाघूर्ण का", "इनमें से कोई नहीं"], "a": 1, "y": "BSEB 2010, 2015, 2020 (A), 2025 (A)", "eh": "किलोवाट-घंटा = शक्ति × समय, अतः यह ऊर्जा का मात्रक है (1 kWh = 3.6 × 10⁶ J)।", "ee": "Kilowatt-hour = power × time, so it is a unit of energy (1 kWh = 3.6 × 10⁶ J)."},
    {"q": "स्वस्थ मनुष्य के शरीर का विद्युत प्रतिरोध है :", "o": ["50,000 Ω", "10,000 Ω", "1,000 Ω", "10 Ω"], "a": 0, "y": "BSEB 2011", "eh": "पुस्तक के अनुसार स्वस्थ मनुष्य के शरीर का विद्युत प्रतिरोध 50,000 Ω होता है।", "ee": "As per the book, the electrical resistance of a healthy human body is 50,000 Ω."},
    {"q": "10 ऐम्पियर की धारा एक तार से 10 सेकेण्ड तक प्रवाहित होती है। यदि तार का विभवान्तर 15V हो, तो किया गया कार्य होगा :", "o": ["1500 J", "75 J", "150 W", "750 J"], "a": 0, "y": "BSEB 2012", "eh": "कार्य W = V·I·t ⇒ 15 × 10 × 10 = 1500 J।", "ee": "Work W = V·I·t ⇒ 15 × 10 × 10 = 1500 J."},
    {"q": "5Ω प्रतिरोध के एक तार से जिसका विभवान्तर 7 वोल्ट है, 20 मिनट तक धारा प्रवाहित होती है। उत्पन्न ऊष्मा है :", "o": ["140 कैलोरी", "280 कैलोरी", "700 कैलोरी", "2800 कैलोरी"], "a": 3, "y": "BSEB 2013", "eh": "ऊष्मा H = V²t/R ⇒ (7² × 1200)/5 = 11760 J ⇒ 11760/4.2 = 2800 कैलोरी।", "ee": "Heat H = V²t/R ⇒ (7² × 1200)/5 = 11760 J ⇒ 11760/4.2 = 2800 calories."},
    {"q": "विद्युत-परिपथ किसी बिन्दु पर सभी धाराओं का बीजगणितीय योग होता है :", "o": ["शून्य", "अनन्त", "धनात्मक", "ऋणात्मक"], "a": 0, "y": "BSEB 2015, 2016", "eh": "किरचॉफ के प्रथम नियम से परिपथ के किसी बिन्दु पर धाराओं का बीजगणितीय योग शून्य होता है।", "ee": "By Kirchhoff's first law, the algebraic sum of currents at any point of a circuit is zero."},
    {"q": "ह्वीट-स्टोन ब्रिज का उपयोग होता है :", "o": ["सिर्फ उच्च प्रतिरोध के मापन में", "सिर्फ अल्प प्रतिरोध के मापन में", "उच्च एवं अल्प दोनों ही प्रतिरोध के मापन में", "विभवान्तरों के मापन में"], "a": 2, "y": "BSEB 2017 (A)", "eh": "ह्वीटस्टोन ब्रिज से उच्च एवं अल्प दोनों प्रकार के प्रतिरोध मापे जा सकते हैं।", "ee": "A Wheatstone bridge can measure both high and low resistances."},
    {"q": "एक विद्युत-परिपथ में विभवांतर मापा जाता है :", "o": ["ऐम्पियर (A) में", "वोल्ट (V) में", "ओम (Ω) में", "वाट (W) में"], "a": 1, "eh": "विभवांतर का मात्रक वोल्ट (V) है।", "ee": "Potential difference is measured in volts (V)."},
    {"q": "स्थिर विभवान्तर पर किसी विद्युत परिपथ का प्रतिरोध आधा कर दिया जाता है। उत्पन्न ऊष्मा होगी :", "o": ["आधी", "दोगुनी", "चार गुनी", "अपरिवर्तित"], "a": 1, "y": "BSEB 2019 (A)", "eh": "H = V²t/R; V स्थिर रखकर R आधा करने से उत्पन्न ऊष्मा दोगुनी हो जाती है।", "ee": "H = V²t/R; at constant V, halving R doubles the heat produced."},
    {"q": "किसी विद्युत परिपथ का वह गुण जो विद्युत-ऊर्जा को ऊष्मा में बदल देता है, कहा जाता है :", "o": ["वि. वा. बल", "धारा", "विभवान्तर", "प्रतिरोध"], "a": 3, "eh": "प्रतिरोध ही वह गुण है जो विद्युत-ऊर्जा को ऊष्मा में बदल देता है।", "ee": "Resistance is the property that converts electrical energy into heat."},
    {"q": "किर्कहॉफ का बिन्दु नियम (point rule) पालन करता है :", "o": ["ऊर्जा की संरक्षणता का सिद्धान्त", "आवेश की संरक्षणता का सिद्धान्त", "संवेग की संरक्षणता का सिद्धान्त", "द्रव्यमान की संरक्षणता का सिद्धान्त"], "a": 1, "eh": "किर्कहॉफ का बिन्दु नियम आवेश की संरक्षणता के सिद्धान्त पर आधारित है।", "ee": "Kirchhoff's point (junction) rule is based on the principle of conservation of charge."},
    {"q": "परिपथ का गुण जो विद्युतीय ऊर्जा को ताप में बदलता है, कहलाता है :", "o": ["प्रतिरोध", "धारा", "वोल्टता", "विद्युत वाहक बल"], "a": 0, "eh": "परिपथ का प्रतिरोध गुण ही विद्युतीय ऊर्जा को ताप में बदलता है।", "ee": "It is the resistance of the circuit that converts electrical energy into heat."},
    {"q": "किसी चालक में विद्युत् धारा के प्रवाह का कारण है :", "o": ["प्रतिरोध में अन्तर", "तापक्रम में अंतर", "विद्युतीय विभव में अंतर", "इनमें से कोई नहीं"], "a": 2, "eh": "चालक के सिरों के बीच विद्युतीय विभव का अंतर ही धारा प्रवाह का कारण है।", "ee": "Current flows in a conductor because of the difference of electric potential between its ends."},
    {"q": "विद्युत् हीटर में जिस पदार्थ का उपयोग किया जाता है, वह है :", "o": ["ताँबा", "प्लेटिनम", "टंगस्टन", "नाइक्रोम"], "a": 3, "y": "BSEB 2017 (A)", "eh": "विद्युत हीटर में उच्च प्रतिरोधकता व उच्च गलनांक वाला नाइक्रोम तार उपयोग होता है।", "ee": "An electric heater uses nichrome wire, which has high resistivity and a high melting point."},
    {"q": "एक शुष्क सेल का वि. वा. बल 1.5V हो और आंतरिक प्रतिरोध 0.5Ω है। यदि यह सेल एक बाहरी प्रतिरोध में 1A की धारा भेजता है, तो सेल का विभवान्तर होगा :", "o": ["1.5V", "1V", "0.5V", "0V"], "a": 1, "eh": "सेल का विभवान्तर V = E − Ir ⇒ 1.5 − (1 × 0.5) = 1 V।", "ee": "Terminal voltage V = E − Ir ⇒ 1.5 − (1 × 0.5) = 1 V."},
    {"q": "धात्विक चालकों का ताप बढ़ने पर उनका प्रतिरोध :", "o": ["घटता है", "बढ़ता है", "अपरिवर्तित रहता है", "इनमें से कोई नहीं"], "a": 1, "eh": "धात्विक चालकों का प्रतिरोध ताप बढ़ने पर बढ़ता है।", "ee": "The resistance of metallic conductors increases with rise in temperature."},
    {"q": "60 W तथा 40 W के दो बल्ब यदि श्रेणीक्रम में जोड़े जाएँ तो उनकी सम्मिलित शक्ति होगी :", "o": ["100 W", "2400 W", "30 W", "24 W"], "a": 3, "y": "BSEB 2019 (A)", "eh": "श्रेणी में सम्मिलित शक्ति P = (60 × 40)/(60 + 40) = 24 W।", "ee": "In series the combined power is P = (60 × 40)/(60 + 40) = 24 W."},
    {"q": "विद्युत परिपथ की शक्ति होती है :", "o": ["V × R", "V² × R", "V²/R", "V² × R × I"], "a": 2, "y": "BSEB 2016, 2019 (A), 2019 (C), 2021 (A), 2025 (A)", "eh": "विद्युत शक्ति P = VI = V²/R होती है।", "ee": "Electric power P = VI = V²/R."},
    {"q": "नीला रंग के लिए कार्बन प्रतिरोध का कलर कोड होता है :", "o": ["3", "4", "5", "6"], "a": 3, "y": "BSEB 2022 (A)", "eh": "रंग-कोड में नीला रंग अंक 6 को दर्शाता है।", "ee": "In the colour code, blue stands for the digit 6."},
    {"q": "एक तार की लम्बाई को खींचकर दुगुना कर दिया जाता है। यदि खींचने के पूर्व इसका प्रतिरोध R है तो खींचने के बाद इसका प्रतिरोध होगा :", "o": ["4R", "R", "2R", "इनमें से कोई नहीं"], "a": 0, "eh": "खींचने पर आयतन स्थिर रहता है; L दोगुना व A आधा ⇒ R' = ρ(2L)/(A/2) = 4R।", "ee": "On stretching, volume stays constant; L doubles and A halves, so R' = ρ(2L)/(A/2) = 4R."},
    {"q": "1 फैराडे बराबर होता है :", "o": ["96,500 A", "96,500 C", "96,500 V", "96,500 N"], "a": 1, "y": "BSEB 2019 (A)", "eh": "1 फैराडे = 1 मोल इलेक्ट्रॉनों का कुल आवेश = 96,500 C।", "ee": "1 faraday = total charge of 1 mole of electrons = 96,500 C."},
    {"q": "किर्कहॉफ का नियम निम्नलिखित में किसका परिणाम है ?", "o": ["विद्युत क्षेत्र का असंरक्षित चरित्र", "विद्युत क्षेत्र का संरक्षित चरित्र", "चुम्बकीय क्षेत्र का संरक्षित चरित्र", "चुम्बकीय क्षेत्र का असंरक्षित चरित्र"], "a": 1, "eh": "किर्कहॉफ का पाश नियम विद्युत क्षेत्र के संरक्षित (conservative) चरित्र का परिणाम है।", "ee": "Kirchhoff's loop law is a consequence of the conservative nature of the electric field."},
    {"q": "एक ही पदार्थ के बने दो तारों A तथा B की लम्बाइयाँ समान हैं। A का व्यास B से दुगुना है। A का प्रतिरोध B की तुलना में होगा :", "o": ["बराबर", "दुगुना", "आधा", "चौथाई"], "a": 3, "eh": "व्यास दोगुना ⇒ क्षेत्रफल 4 गुना ⇒ R = ρL/A से प्रतिरोध चौथाई होगा।", "ee": "Doubling the diameter makes the area 4 times, so by R = ρL/A the resistance becomes one-fourth."},
    {"q": "किसी चालक से प्रवाहित धारा होता है :", "o": ["I = neAV_d", "I = ne²AV_d", "I = neA/V_d", "I = n²e²AV_d"], "a": 0, "eh": "धारा I = neAV_d, जहाँ n इलेक्ट्रॉन घनत्व, A अनुप्रस्थ काट व V_d अपवाह वेग है।", "ee": "Current I = neAV_d, where n is electron density, A the cross-section and V_d the drift velocity."},
    {"q": "12 ओम प्रतिरोध का एक तार एक वृत्त के रूप में मोड़ दिया गया है। व्यास के किनारों के बीच प्रतिरोध होगा :", "o": ["3Ω", "6Ω", "9Ω", "12Ω"], "a": 0, "eh": "व्यास के सिरों के बीच दो अर्द्ध-वृत्त भाग (प्रत्येक 6 Ω) समांतर में ⇒ (6 × 6)/(6 + 6) = 3 Ω।", "ee": "Across a diameter, the two semicircular halves (6 Ω each) are in parallel ⇒ (6 × 6)/(6 + 6) = 3 Ω."},
    {"q": "विद्युत वाहक बल की विमा है :", "o": ["ML²T⁻²", "M⁻¹L²T⁻²", "MLT⁻²", "ML²T⁻³A⁻¹"], "a": 3, "y": "BSEB 2016", "eh": "वि. वा. बल = कार्य/आवेश ⇒ विमा = [ML²T⁻²]/[AT] = [ML²T⁻³A⁻¹]।", "ee": "Emf = work/charge, so its dimension is [ML²T⁻²]/[AT] = [ML²T⁻³A⁻¹]."},
    {"q": "विद्युतीय विभव की विमा है :", "o": ["ML²T⁻³A⁻¹", "MLT³A⁻³", "MLT⁻³A⁻²", "ML²T⁻³A⁻²"], "a": 0, "eh": "विद्युतीय विभव = कार्य/आवेश ⇒ विमा [ML²T⁻³A⁻¹] होती है।", "ee": "Electric potential = work/charge, so its dimension is [ML²T⁻³A⁻¹]."},
    {"q": "यदि एक ताँबे के तार को खींचकर उसकी लम्बाई 1% बढ़ा दी जाए तो प्रतिरोध में प्रतिशत वृद्धि होगी :", "o": ["0.2", "2", "1", "0.1"], "a": 1, "eh": "आयतन स्थिर रहने पर R ∝ L² ⇒ लम्बाई में 1% वृद्धि से प्रतिरोध में लगभग 2% वृद्धि होगी।", "ee": "With volume constant, R ∝ L², so a 1% increase in length raises the resistance by about 2%."},
    {"q": "किसी तार का प्रतिरोध R, लम्बाई l, अनुप्रस्थ-काट का क्षेत्रफल A तथा विशिष्ट प्रतिरोध ρ हो, तब :", "o": ["R = ρl/A", "R = Al/ρ", "R = ρAl", "ρ = Al/A"], "a": 0, "y": "BSEB 2025 (A)", "eh": "प्रतिरोध R = ρl/A होता है, जहाँ ρ पदार्थ का विशिष्ट प्रतिरोध है।", "ee": "Resistance R = ρl/A, where ρ is the specific resistance (resistivity) of the material."},
    {"q": "विशिष्ट प्रतिरोध या प्रतिरोधकता का S.I. मात्रक है :", "o": ["Ω m", "Ω . m²", "Am", "Ω . m⁻¹"], "a": 0, "eh": "प्रतिरोधकता का S.I. मात्रक ओम-मीटर (Ω m) है।", "ee": "The S.I. unit of resistivity is ohm-metre (Ω m)."},
    {"q": "विशिष्ट प्रतिरोध या प्रतिरोधकता की विमा है :", "o": ["[ML³T⁻³I⁻²]", "[ML²T⁻³I⁻²]", "[MLT⁻²I⁻²]", "[MLT⁻²I⁻¹]"], "a": 0, "eh": "ρ = RA/L ⇒ विमा = [ML²T⁻³A⁻²] × [L²]/[L] = [ML³T⁻³A⁻²]।", "ee": "ρ = RA/L, so its dimension is [ML²T⁻³A⁻²] × [L²]/[L] = [ML³T⁻³A⁻²]."},
    {"q": "विद्युत हीटर में जिस तत्व का व्यवहार किया जाता है वह है :", "o": ["ताम्बा", "प्लेटिनम", "टंगस्टन", "निक्रोम"], "a": 3, "y": "BSEB 2017 (A)", "eh": "विद्युत हीटर में निक्रोम (नाइक्रोम) तत्व का व्यवहार किया जाता है।", "ee": "The element used in an electric heater is nichrome."},
    {"q": "शोषित विद्युत ऊर्जा :", "o": ["विभवांतर के व्युत्क्रमानुपाती होता है", "विभवांतर के समानुपाती होता है।", "विभवांतर के वर्ग के समानुपाती होता है", "इनमें से कोई नहीं"], "a": 2, "y": "BSEB 2017 (A)", "eh": "शोषित विद्युत ऊर्जा W = V²t/R, अतः यह विभवांतर के वर्ग के समानुपाती होती है।", "ee": "Absorbed electrical energy W = V²t/R, so it is proportional to the square of the potential difference."},
    {"q": "ह्वीटस्टोन सेतु से तुलना करता है :", "o": ["प्रतिरोधों का", "धाराओं का", "विभवान्तरों का", "सभी का"], "a": 0, "y": "BSEB 2017 (C)", "eh": "ह्वीटस्टोन सेतु प्रतिरोधों की तुलना करके अज्ञात प्रतिरोध मापता है।", "ee": "A Wheatstone bridge measures an unknown resistance by comparing resistances."},
    {"q": "ताँबा का कार्यफलन होता है :", "o": ["कुछ इलेक्ट्रॉन वोल्ट", "कुछ जूल", "कुछ वाट", "कुछ वोल्ट"], "a": 0, "y": "BSEB 2017 (C)", "eh": "ताँबा का कार्यफलन कुछ इलेक्ट्रॉन-वोल्ट (लगभग 4.7 eV) होता है।", "ee": "The work function of copper is a few electron-volts (about 4.7 eV)."},
    {"q": "किसी विभवमापी की संवेदनशीलता को बढ़ाने के लिए :", "o": ["इसका अनुप्रस्थ क्षेत्र बढ़ाना चाहिए", "इसकी धारा को घटाना चाहिए", "इसकी धारा को बढ़ाना चाहिए", "इसकी लंबाई को घटाना चाहिए"], "a": 0, "y": "BSEB 2009", "eh": "विभवमापी की सुग्राहता विभव प्रवणता के व्युत्क्रमानुपाती होती है; प्रवणता घटने से सुग्राहता बढ़ती है। ⚠️ टिप्पणी: पुस्तक में उत्तर (A) छपा है, परंतु विभव प्रवणता घटाने से सुग्राहता बढ़ती है, अतः सही उत्तर (B) धारा घटाना होता है।", "ee": "A potentiometer's sensitivity is inversely proportional to the potential gradient; a smaller gradient gives higher sensitivity. Note: the book prints (A), but sensitivity rises when the potential gradient falls, so the correct answer is (B) reducing the current."},
    {"q": "आवेश का पृष्ठ घनत्व का मात्रक होता है :", "o": ["कूलॉम/मीटर² (Cm⁻²)", "न्यूटन/मीटर (Nm⁻¹)", "कूलॉम/वोल्ट (CV⁻¹)", "कूलॉम-मीटर (Cm)"], "a": 0, "y": "BSEB 2019 (A)", "eh": "पृष्ठ आवेश घनत्व σ = Q/A, अतः इसका मात्रक कूलॉम/मीटर² होता है।", "ee": "Surface charge density σ = Q/A, so its unit is coulomb per square metre (C/m²)."},
    {"q": "एम्पियर-घंटा मात्रक होता है :", "o": ["शक्ति का", "आवेश का", "ऊर्जा का", "विभवान्तर का"], "a": 1, "y": "BSEB 2022 (A)", "eh": "एम्पियर-घंटा = धारा × समय, अतः यह आवेश का मात्रक है (1 Ah = 3600 C)।", "ee": "Ampere-hour = current × time, so it is a unit of charge (1 Ah = 3600 C)."},
    {"q": "विवर (होल) मोबाइल आवेश वाहक होता है :", "o": ["कन्डक्शन बैण्ड में", "फॉरबीडेन ऊर्जा अन्तराल में", "वैलेन्स बैण्ड में", "इनमें से कोई नहीं"], "a": 1, "eh": "विवर (होल) संयोजकता अर्थात वैलेन्स बैण्ड में गतिशील आवेश वाहक होते हैं। ⚠️ टिप्पणी: पुस्तक में उत्तर (B) छपा है, परंतु होल वैलेन्स बैण्ड में होते हैं, अतः सही उत्तर (C) वैलेन्स बैण्ड होता है।", "ee": "Holes act as mobile charge carriers in the valence band. Note: the book prints (B), but holes are carriers in the valence band, so the correct answer is (C) valence band."},
    {"q": "ट्रान्जिस्टर की धारा लाभ α परिभाषित होता है :", "o": ["I_c/I_b द्वारा", "I_c/I_e द्वारा", "I_E/I_C द्वारा", "I_B/I_g द्वारा"], "a": 1, "eh": "ट्रांजिस्टर का धारा लाभ α = I_c/I_e (संग्राहक धारा / उत्सर्जक धारा) परिभाषित होता है।", "ee": "The transistor current gain α is defined as α = I_c/I_e (collector current / emitter current)."},
    {"q": "वैसी युक्ति जो सौर ऊर्जा को विद्युत् ऊर्जा में परिवर्तित करता है, उसे कहते हैं :", "o": ["सौर सेल", "शुष्क सेल", "संचायक सेल", "बटन सेल"], "a": 0, "eh": "सौर सेल सौर ऊर्जा को सीधे विद्युत् ऊर्जा में परिवर्तित करता है।", "ee": "A solar cell converts solar energy directly into electrical energy."},
    {"q": "सौर सेल पैनल का उपयोग किया जाता है :", "o": ["कृत्रिम उपग्रह में", "चन्द्रमा पर", "मंगल ग्रह पर", "कहीं भी नहीं"], "a": 0, "eh": "सौर सेल पैनल का उपयोग कृत्रिम उपग्रहों में विद्युत आपूर्ति के लिए किया जाता है।", "ee": "Solar cell panels are used in artificial satellites for power supply."},
    {"q": "GaP संधि द्वारा अधिकांश प्रकाश उत्सर्जित होता है :", "o": ["लाल और हरा", "लाल और पीला", "लाल और बैंगनी", "इनमें से कोई नहीं"], "a": 0, "eh": "GaP (गैलियम फॉस्फाइड) संधि से अधिकांशतः लाल और हरा प्रकाश उत्सर्जित होता है (पुस्तक के अनुसार)।", "ee": "A GaP junction emits mostly red and green light (as per the book)."},
    {"q": "संयोजक ऊर्जा बैण्ड तथा चालन ऊर्जा बैण्ड के बीच के अन्तराल को :", "o": ["फर्मी बैण्ड", "बैण्ड गैप", "संयोजक बैण्ड", "चालन बैण्ड कहते हैं"], "a": 1, "eh": "संयोजक बैण्ड तथा चालन बैण्ड के बीच के अन्तराल को बैण्ड गैप कहते हैं।", "ee": "The gap between the valence band and the conduction band is called the band gap."},
    {"q": "सुचालक पदार्थ में संयोजक बैण्ड तथा चालन बैण्ड के बीच :", "o": ["चौड़ा बैण्ड गैप होता है", "पतला बैण्ड गैप होता है", "कोई रिक्त स्थान नहीं होता है", "इनमें से कोई नहीं"], "a": 2, "eh": "सुचालक (धातुओं) में संयोजक व चालन बैण्ड परस्पर अतिव्याप्त होते हैं, अतः उनके बीच कोई रिक्त स्थान नहीं होता।", "ee": "In conductors (metals) the valence and conduction bands overlap, so there is no gap between them."},
    {"q": "1 वोल्ट बराबर होता है :", "o": ["1J", "1 JC⁻¹", "1 CJ⁻¹", "1 JC"], "a": 1, "y": "BSEB 2020 (A)", "eh": "1 वोल्ट = 1 जूल प्रति कूलॉम (1 JC⁻¹) होता है।", "ee": "1 volt = 1 joule per coulomb (1 JC⁻¹)."},
    {"q": "कार्बन प्रतिरोध का कलर कोड में लाल रंग का मान होता है :", "o": ["0", "1", "2", "3"], "a": 2, "y": "BSEB 2020 (A)", "eh": "रंग-कोड में लाल रंग अंक 2 को दर्शाता है।", "ee": "In the colour code, red stands for the digit 2."},
    {"q": "(25W, 220V) तथा (100W, 220V) के दो बल्बों में से प्रतिरोध ज्यादा होगा :", "o": ["25W का", "100W का", "दोनों का बराबर होगा", "इनमें से कोई नहीं"], "a": 0, "y": "BSEB 2019 (C)", "eh": "R = V²/P ⇒ कम शक्ति (25 W) वाले बल्ब का प्रतिरोध अधिक होगा।", "ee": "R = V²/P, so the lower-power (25 W) bulb has the higher resistance."},
    {"q": "चित्र में धारा (I) का मान होगा : [diagram — a current-junction figure; branch currents marked 20A, 8A, 16A, 4A and 8A, with the unknown current labelled I; exact arrow directions partly faint — see Unclear list]", "o": ["8A", "10A", "12A", "14A"], "a": 0, "y": "BSEB 2019 (C)", "eh": "किरचॉफ के प्रथम (संधि) नियम से संधि पर आने वाली धाराओं का योग = जाने वाली धाराओं के योग के बराबर होता है; पुस्तक के चित्र के अनुसार I का मान 8 A है।", "ee": "By Kirchhoff's first (junction) law, the currents entering a junction equal the currents leaving it; from the book's printed figure, the answer is I = 8 A."},
    {"q": "अनुपात 3 : 4 के दो प्रतिरोध समानान्तर क्रम में जुड़े हैं। इनमें उत्पन्न ऊष्मा के परिमाणों का अनुपात होगा :", "o": ["4 : 3", "3 : 4", "6 : 8", "9 : 16"], "a": 0, "y": "BSEB 2019 (C)", "eh": "समांतर में V समान रहता है, H = V²t/R ∝ 1/R ⇒ ऊष्मा का अनुपात = 4 : 3।", "ee": "In parallel V is the same and H = V²t/R ∝ 1/R, so the heat ratio is 4 : 3."},
    {"q": "इलेक्ट्रॉन मुक्त इलेक्ट्रॉन के पद में होते हैं, यदि पाये जाते हैं :", "o": ["कन्डक्शन बैण्ड में", "फॉरबीडेन ऊर्जा अन्तराल में", "वैलेन्स बैण्ड में", "इनमें से कोई नहीं"], "a": 0, "eh": "इलेक्ट्रॉन मुक्त इलेक्ट्रॉन तभी होते हैं जब वे कन्डक्शन बैण्ड में पाए जाते हैं।", "ee": "Electrons act as free electrons when they are in the conduction band."},
    {"q": "कन्डक्शन बैण्ड अंशतः खाली होते हैं :", "o": ["अचालक में", "अर्द्धचालक में", "धातुओं में", "इनमें से कोई नहीं"], "a": 0, "eh": "धातुओं में चालन बैण्ड अंशतः खाली (अंशतः भरा) होता है, जिससे इलेक्ट्रॉन आसानी से गति कर सकते हैं। ⚠️ टिप्पणी: पुस्तक में उत्तर (A) छपा है, परंतु चालन बैण्ड धातुओं में अंशतः खाली होता है, अतः सही उत्तर (C) धातुओं में होता है।", "ee": "In metals the conduction band is partially empty (partially filled), so electrons can move freely. Note: the book prints (A), but the conduction band is partially empty in metals, so the correct answer is (C) metals."},
    {"q": "विभवमापी के तार की लम्बाई बढ़ा देने पर सन्तुलन बिन्दु प्राप्त होता है :", "o": ["कम लम्बाई पर", "अधिक लम्बाई पर", "उतनी ही लम्बाई पर", "अनिश्चित"], "a": 1, "eh": "तार की लम्बाई बढ़ने से विभव प्रवणता घटती है, अतः सन्तुलन बिन्दु अधिक लम्बाई पर प्राप्त होता है।", "ee": "A longer wire lowers the potential gradient, so the balance point is obtained at a greater length."},
    {"q": "बाह्य अर्द्धचालकता में विद्युत् चालन सम्भव है :", "o": ["उच्च तापक्रम पर", "प्रत्येक तापक्रम पर", "36°C पर", "98°F पर"], "a": 1, "eh": "बाह्य अर्द्धचालकता में अपद्रव्य (impurity) आयनन के कारण प्रत्येक तापक्रम पर विद्युत् चालन सम्भव है (पुस्तक के अनुसार)।", "ee": "In extrinsic semiconductors, conduction due to impurity ionisation is possible at every temperature (as per the book)."},
    {"q": "सेल का वि. वा. बल मापा जा सकता है :", "o": ["वोल्टामीटर द्वारा", "धारामापी (अमीटर) द्वारा", "गैल्वेनोमीटर द्वारा", "विभवमापी द्वारा"], "a": 3, "y": "BSEB 2019 (C)", "eh": "विभवमापी संतुलन अवस्था में सेल से कोई धारा नहीं लेता, अतः सेल का वि. वा. बल इससे यथार्थ मापा जाता है।", "ee": "At the balance point a potentiometer draws no current from the cell, so it measures the cell's emf accurately."},
    {"q": "शुद्ध जरमेनियम प्राप्त होता है जब उसे मिलाया जाता है :", "o": ["इन्डियम", "सोना", "ताँबा", "आरसेनिक"], "a": 0, "eh": "पुस्तक के अनुसार शुद्ध जरमेनियम इन्डियम मिलाने से प्राप्त होता है।", "ee": "As per the book, pure germanium is obtained by mixing it with indium."},
    {"q": "ट्रान्जिस्टर पैरामीटर α तथा β के बीच का सही मान सम्बन्ध है :", "o": ["α = β/(β−1)", "β = α/(1−α)", "α = (β+1)/β", "β = (α+1)/α"], "a": 1, "eh": "α तथा β के बीच सम्बन्ध β = α/(1 − α) होता है।", "ee": "The relation between α and β is β = α/(1 − α)."},
    {"q": "ह्वीटस्टोन ब्रिज से मापा जाता है :", "o": ["उच्च प्रतिरोध", "निम्न प्रतिरोध", "दोनों 'A' और 'B'", "विभवांतर"], "a": 2, "y": "BSEB 2017 (A)", "eh": "ह्वीटस्टोन ब्रिज से उच्च व निम्न दोनों प्रतिरोध मापे जाते हैं।", "ee": "A Wheatstone bridge is used to measure both high and low resistances."},
    {"q": "निम्नलिखित में कौन सही है ?", "o": ["1 watt = 1 Js⁻¹", "1 watt = 1 Vs⁻¹", "1 watt = 1 sV⁻¹", "1 watt = 1 Fs⁻¹"], "a": 0, "y": "BSEB 2022 (A)", "eh": "शक्ति = कार्य/समय ⇒ 1 watt = 1 Js⁻¹ होता है।", "ee": "Power = work/time, so 1 watt = 1 Js⁻¹."},
    {"q": "निम्नलिखित में गतिशीलता के लिए कौन सही है ?", "o": ["μ = V_d/E", "μ = E/V_d", "μ = V_d·E", "μ = E²·V_d"], "a": 0, "y": "BSEB 2022 (A)", "eh": "गतिशीलता μ = V_d/E (अपवाह वेग / विद्युत क्षेत्र) होती है।", "ee": "Mobility is defined as μ = V_d/E (drift velocity / electric field)."},
    {"q": "किसी परिपथ का वह गुण जो विद्युत् ऊर्जा को ऊष्मा में बदल देता है, कहा जाता है :", "o": ["विद्युत वाहक बल", "धारा", "वोल्टेज", "प्रतिरोध"], "a": 3, "eh": "प्रतिरोध ही वह गुण है जो विद्युत् ऊर्जा को ऊष्मा में बदल देता है।", "ee": "Resistance is the property that converts electrical energy into heat."},
    {"q": "किरचॉफ का विद्युत परिपथ सम्बन्धी प्रथम नियम आधारित है :", "o": ["ऊर्जा संरक्षण के नियम पर", "आवेश संरक्षण के नियम पर", "संवेग संरक्षण के नियम पर", "इनमें से कोई नहीं"], "a": 1, "eh": "किरचॉफ का प्रथम नियम आवेश संरक्षण के नियम पर आधारित है।", "ee": "Kirchhoff's first law is based on the law of conservation of charge."},
    {"q": "किरचॉफ का पाश नियम (द्वितीय नियम) किसके संरक्षण के सिद्धान्त पर आधारित है ?", "o": ["आवेश", "संवेग", "ऊर्जा", "द्रव्यमान"], "a": 2, "y": "BSEB 2024 (A)", "eh": "किरचॉफ का पाश (द्वितीय) नियम ऊर्जा संरक्षण के सिद्धान्त पर आधारित है।", "ee": "Kirchhoff's loop (second) law is based on the principle of conservation of energy."},
    {"q": "प्रत्यावर्ती विभव लगाने पर एक दिष्ट धारा उत्पन्न करने वाले संयंत्र का नाम है :", "o": ["दिष्टकारी", "ट्रान्सफार्मर", "ऑसिलेटर", "फिल्टर"], "a": 0, "eh": "दिष्टकारी प्रत्यावर्ती विभव से दिष्ट धारा उत्पन्न करने वाला संयंत्र है।", "ee": "A rectifier is the device that produces direct current from an alternating voltage."},
    {"q": "निम्नलिखित में धारा-घनत्व के लिए कौन सही है ?", "o": ["J = I·A", "J = I/A", "J = A/I", "J = I²A"], "a": 1, "y": "BSEB 2022 (A)", "eh": "धारा-घनत्व J = I/A होता है।", "ee": "Current density is J = I/A."},
    {"q": "दो सेलों को जिनका वि. वा. बल E₁ व E₂ तथा आन्तरिक प्रतिरोध क्रमशः r₁ व r₂ है, समान्तर क्रम में जोड़ा गया है। संयोजन का तुल्य वि. वा. बल है :", "o": ["(E₁r₁ + E₂r₂)/(r₁ + r₂)", "(E₁r₂ + E₂r₁)/(r₁ + r₂)", "(E₁ + E₂)/2", "√(E₁ + E₂)"], "a": 1, "y": "BSEB 2017 (A)", "eh": "समान्तर संयोजन का तुल्य वि. वा. बल E = (E₁r₂ + E₂r₁)/(r₁ + r₂) होता है।", "ee": "The equivalent emf of cells in parallel is E = (E₁r₂ + E₂r₁)/(r₁ + r₂)."}

  'phy-9': [
    {"q": "उत्तल दर्पण से प्रतिबिम्ब सदैव बनता है :", "o": ["वक्रता केन्द्र तथा फोकस के बीच", "वक्रता केन्द्र तथा अनन्त के बीच", "ध्रुव तथा फोकस के बीच", "इनमें से कोई नहीं"], "a": 2, "y": "BSEB 2025 (A)", "eh": "उत्तल दर्पण में वस्तु कहीं भी हो, प्रतिबिम्ब सदैव ध्रुव (P) और फोकस (F) के बीच आभासी व छोटा बनता है।", "ee": "A convex mirror always forms a virtual, diminished image between the pole and the focus."},
    {"q": "एक उत्तल लेंस की क्षमता 2 डायोप्टर है। इसकी फोकस दूरी होगी :", "o": ["20 सेमी", "50 सेमी", "40 सेमी", "60 सेमी"], "a": 1, "y": "BSEB 2025 (A)", "eh": "P = 100/f(cm) ⇒ f = 100/2 = 50 cm।", "ee": "f = 1/P = 1/2 m = 50 cm."},
    {"q": "निम्नलिखित में कौन-सा रंगीन विपथन को कम करने के लिए लेंसों में उपयोग किया जाता है ?", "o": ["उत्तल लेंस", "अवतल लेंस", "अवर्णक संयोग", "बेलनाकार लेंस"], "a": 2, "y": "BSEB 2025 (A)", "eh": "अलग-अलग रंगों के लिए फोकस अलग होने का दोष (वर्ण विपथन) विपरीत प्रकृति के लेंसों के अवर्णक संयोग से दूर किया जाता है।", "ee": "Chromatic aberration is removed by an achromatic combination of lenses of opposite dispersive nature."},
    {"q": "एक उत्तल लेंस को किसी द्रव में डुबाया जाता है जिसका अपवर्तनांक लेंस के पदार्थ के अपवर्तनांक के बराबर होता है, तब इसकी फोकस दूरी :", "o": ["शून्य होगी", "अनंत होगी", "घटेगी", "बढ़ेगी"], "a": 1, "y": "BSEB 2025 (A)", "eh": "द्रव का अपवर्तनांक लेंस के बराबर होने पर लेंस की सतह पर अपवर्तन नहीं होगा; लेंस समतल प्लेट जैसा व्यवहार करेगा, इसलिए फोकस दूरी अनंत होगी।", "ee": "With equal refractive indices there is no refraction at the lens surface, so the focal length becomes infinite."},
    {"q": "एक व्यक्ति +2D क्षमता का चश्मा (लेंस) प्रयोग करता है। उसका दृष्टि दोष है :", "o": ["निकट दृष्टि दोष", "दूर दृष्टि दोष", "जरा दृष्टि दोष", "अबिन्दुकता"], "a": 1, "y": "BSEB 2025 (A)", "eh": "+ क्षमता का लेंस उत्तल होता है, जो दूर-दृष्टि दोष (हाइपरमेट्रोपिया) दूर करने में प्रयुक्त होता है।", "ee": "A +2D (convex) lens corrects hypermetropia, i.e. far-sightedness (दूर दृष्टि दोष)."},
    {"q": "किस रंग का तरंगदैर्घ्य सबसे कम होता है ?", "o": ["बैंगनी", "पीला", "नीला", "लाल"], "a": 0, "y": "BSEB 2024 (A)", "eh": "दृश्य स्पेक्ट्रम में बैंगनी रंग का तरंगदैर्घ्य सबसे कम (~4000 Å) और लाल का सबसे अधिक होता है।", "ee": "Violet light has the shortest wavelength in the visible spectrum."},
    {"q": "एक गोलीय दर्पण को पानी में डुबा दिया जाता है, इसकी फोकस दूरी :", "o": ["घट जायेगी", "बढ़ जायेगी", "समान रहेगी", "इनमें से कोई नहीं"], "a": 2, "y": "BSEB 2023 (A)", "eh": "दर्पण की फोकस दूरी केवल उसकी वक्रता त्रिज्या पर निर्भर करती है (f = R/2); माध्यम बदलने से नहीं बदलती।", "ee": "A mirror's focal length depends only on its radius of curvature, not on the surrounding medium."},
    {"q": "40 सेमी फोकस दूरी का उत्तल लेंस एवं 20 सेमी फोकस दूरी का अवतल लेंस संपर्क में है। इनके संयोजन की क्षमता डायोप्टर में है :", "o": ["2.5", "−2.5", "7.5", "−7.5"], "a": 1, "y": "BSEB 2023 (A)", "eh": "P₁ = +100/40 = +2.5 D, P₂ = −100/20 = −5 D ⇒ P = 2.5 − 5 = −2.5 D।", "ee": "Powers add: +2.5 D and −5 D give −2.5 D."},
    {"q": "पार्श्विक दूरदर्शी द्वारा बना अंतिम प्रतिबिंब होता है :", "o": ["काल्पनिक एवं वस्तु की अपेक्षा उल्टा", "काल्पनिक एवं वस्तु की अपेक्षा सीधा", "वास्तविक एवं वस्तु की अपेक्षा सीधा", "इनमें से कोई नहीं"], "a": 1, "y": "BSEB 2023 (A)", "eh": "पार्श्विक (terrestrial) दूरदर्शी में अतिरिक्त उत्तल लेंस प्रतिबिम्ब को सीधा कर देता है; अंतिम प्रतिबिम्ब आभासी व सीधा होता है।", "ee": "The extra erecting lens in a terrestrial telescope makes the final image virtual and erect."},
    {"q": "दृश्य स्पेक्ट्रम के रंगों में किसका अधिक तरंगदैर्घ्य होता है ?", "o": ["लाल का", "पीला का", "नीला का", "बैंगनी का"], "a": 0, "y": "BSEB 2023 (A)", "eh": "दृश्य स्पेक्ट्रम में लाल रंग का तरंगदैर्घ्य सबसे अधिक (~7000 Å) होता है।", "ee": "Red light has the longest wavelength in the visible spectrum."},
    {"q": "प्रकाश वर्ष का मान बराबर होता है :", "o": ["9.46 × 10¹⁵ m", "9.46 × 10¹² m", "9.46 × 10⁸ m", "9.46 × 10¹⁰ m"], "a": 0, "y": "BSEB 2023 (A)", "eh": "1 प्रकाश वर्ष = c × 1 वर्ष = 3×10⁸ × (365.25×24×3600) ≈ 9.46×10¹⁵ m।", "ee": "One light year = speed of light × one year ≈ 9.46 × 10¹⁵ m."},
    {"q": "यदि किसी माध्यम से निर्वात में संपूर्ण आन्तरिक परावर्तन के लिए क्रान्तिक कोण 30° हो, तो माध्यम में प्रकाश का वेग है :", "o": ["3 × 10⁸ मी/से", "1.5 × 10⁸ मी/से", "6 × 10⁸ मी/से", "4.5 × 10⁸ मी/से"], "a": 1, "y": "BSEB 2023 (A), 2025 (A)", "eh": "sin C = 1/μ ⇒ μ = 1/sin30° = 2; v = c/μ = 3×10⁸/2 = 1.5×10⁸ m/s।", "ee": "μ = 1/sin30° = 2, so v = c/2 = 1.5 × 10⁸ m/s."},
    {"q": "किसी भी प्रिज्म की वर्ण विक्षेपण क्षमता निर्भर करती है :", "o": ["आयतन कोण पर", "प्रिज्म के पदार्थ की प्रकृति पर", "प्रिज्म के अपवर्तन कोण पर", "प्रिज्म कोण पर"], "a": 1, "y": "BSEB 2023 (A)", "eh": "वर्ण-विक्षेपण क्षमता ω = (μv − μr)/(μy − 1) केवल पदार्थ की प्रकृति (उसके अपवर्तनांकों) पर निर्भर करती है।", "ee": "Dispersive power depends only on the nature of the material of the prism."},
    {"q": "ध्रुवित प्रकाश उत्पन्न करने के लिए किसको प्रयुक्त किया जाता है ?", "o": ["फ्लिन्ट काँच का प्रिज्म", "NaCl का प्रिज्म", "निकॉल प्रिज्म", "बाईप्रिज्म"], "a": 2, "y": "BSEB 2023 (A)", "eh": "निकॉल प्रिज्म द्वि-अपवर्तन द्वारा समतल ध्रुवित प्रकाश उत्पन्न करता है।", "ee": "A Nicol prism produces plane-polarised light by double refraction."},
    {"q": "जब प्रकाश स्रोत और पर्दे के बीच की दूरी बढ़ा दिया जाए तो फ्रिन्ज की चौड़ाई :", "o": ["बढ़ती है", "घटती है", "अपरिवर्तित रहती है", "इनमें से कोई नहीं"], "a": 0, "y": "BSEB 2023 (A)", "eh": "फ्रिन्ज चौड़ाई β = λD/d; स्रोत-पर्दा दूरी D बढ़ने से β बढ़ती है।", "ee": "Fringe width β = λD/d increases with the source-screen distance D."},
    {"q": "प्रकाश अनुप्रस्थ तरंग है, क्योंकि यह प्रदर्शित करता है :", "o": ["परावर्तन", "ध्रुवण", "व्यतिकरण", "विवर्तन"], "a": 1, "y": "BSEB 2023 (A)", "eh": "ध्रुवण केवल अनुप्रस्थ तरंगों में संभव है; यही प्रकाश की अनुप्रस्थ प्रकृति का प्रमाण है।", "ee": "Only transverse waves can be polarised, so polarisation proves light is transverse."},
    {"q": "एक उभयोत्तल लेंस के प्रत्येक तल की वक्रता त्रिज्या 20 सेमी तथा लेंस के पदार्थ का अपवर्तनांक 1.5 है। लेंस की फोकस दूरी है :", "o": ["20 m", "1/20 m", "20 cm", "1/20 cm"], "a": 2, "y": "BSEB 2023 (A)", "eh": "1/f = (μ−1)(1/R₁ − 1/R₂) = (0.5)(1/20 + 1/20) = 1/20 ⇒ f = 20 cm।", "ee": "By the lens maker's formula, f = 20 cm."},
    {"q": "पूर्ण आन्तरिक परावर्तन की स्थिति में परावर्तन गुणांक का मान होगा :", "o": ["0.5", "1", "0", "∞"], "a": 1, "y": "BSEB 2023 (A)", "eh": "पूर्ण आंतरिक परावर्तन में आपतित प्रकाश की सम्पूर्ण ऊर्जा परावर्तित हो जाती है, अतः परावर्तन गुणांक = 1।", "ee": "In total internal reflection all the incident energy is reflected, so the reflection coefficient is 1."},
    {"q": "एक वस्तु को 15 cm त्रिज्या वाले किसी अवतल दर्पण से 10 cm की दूरी पर रखा गया है। दर्पण द्वारा इस वस्तु का :", "o": ["आवर्द्धित, वास्तविक और वस्तु के सापेक्ष उल्टा प्रतिबिम्ब बनेगा।", "बिन्दु प्रतिबिम्ब बनेगा।", "वस्तु के सापेक्ष उल्टा और छोटा प्रतिबिंब बनेगा।", "प्रतिबिंब दर्पण से 30 cm की दूरी पर बनेगा।"], "a": 0, "y": "BSEB 2018 (C)", "eh": "R = 15 cm ⇒ f = 7.5 cm। वस्तु (10 cm) फोकस और वक्रता केंद्र (15 cm) के बीच है, अतः प्रतिबिम्ब आवर्धित, वास्तविक व उल्टा बनेगा।", "ee": "The object lies between F (7.5 cm) and C (15 cm), so the image is magnified, real and inverted."},
    {"q": "प्रकाश की एक किरण किसी पारदर्शी पदार्थ के स्लैब पर आपतन कोण 60° पर आपतित होती है। अगर अपवर्तित किरण और परावर्तित किरण एक दूसरे से 90° पर है, तो निम्नलिखित में से कौन सा कथन सही है ?", "o": ["अपवर्तन कोण 45° है।", "अपवर्तन कोण 30° है।", "स्लैब के पदार्थ का अपवर्तनांक √3 है।", "स्लैब के पदार्थ का अपवर्तनांक √2 है।"], "a": 2, "y": "BSEB 2018 (C)", "eh": "परावर्तित व अपवर्तित किरणें लम्बवत् हैं ⇒ अपवर्तन कोण r = 90° − 60° = 30°, और μ = sin60°/sin30° = √3। पुस्तक उत्तर μ = √3 है।", "ee": "r = 30° and μ = sin60°/sin30° = √3; the book key takes μ = √3."},
    {"q": "मृगमरीचिका का कारण है :", "o": ["अपवर्तन और पूर्ण आंतरिक परावर्तन", "विवर्तन", "प्रकीर्णन", "व्यतिकरण"], "a": 0, "y": "BSEB 2017 (C)", "eh": "मृगमरीचिका में गर्म वायु की परतों से अपवर्तन होते हुए अंत में पूर्ण आंतरिक परावर्तन होता है।", "ee": "A mirage is caused by refraction through hot air layers ending in total internal reflection."},
    {"q": "समतल दर्पण की वक्रता त्रिज्या होती है :", "o": ["अनन्त", "शून्य", "+5 सेमी", "−5 सेमी"], "a": 0, "y": "BSEB 2011", "eh": "समतल दर्पण की सतह समतल होती है, उसकी वक्रता त्रिज्या अनंत होती है।", "ee": "A plane mirror is a flat surface, so its radius of curvature is infinite."},
    {"q": "तालाब की तली कुछ ऊपर उठी हुई प्रतीत होती है इसका कारण है :", "o": ["प्रकाश का व्यतिकरण", "प्रकाश का परावर्तन", "प्रकाश का अपवर्तन", "प्रकाश का विवर्तन"], "a": 2, "eh": "पानी से वायु में आती किरणें अपवर्तन से मुड़ती हैं, जिससे तालाब की तली वास्तविक स्थिति से ऊपर उठी प्रतीत होती है।", "ee": "Refraction of rays from water to air makes the bottom appear raised."},
    {"q": "क्रांतिक कोण सघन माध्यम में वह आपतन कोण है जिसके संगत विरल माध्यम में अपवर्तन कोण होता है :", "o": ["0°", "57°", "90°", "180°"], "a": 2, "eh": "परिभाषानुसार क्रांतिक कोण पर विरल माध्यम में अपवर्तन कोण 90° होता है।", "ee": "By definition, at the critical angle the angle of refraction in the rarer medium is 90°."},
    {"q": "निम्नलिखित में से किस दर्पण द्वारा वस्तु का आभासी प्रतिबिम्ब प्राप्त किया जा सकता है :", "o": ["केवल समतल दर्पण द्वारा", "केवल अवतल दर्पण द्वारा", "केवल उत्तल दर्पण द्वारा", "तीनों के द्वारा"], "a": 3, "eh": "समतल, अवतल (वस्तु निकट होने पर) व उत्तल — तीनों दर्पण आभासी प्रतिबिम्ब बना सकते हैं।", "ee": "Plane, concave (object near) and convex mirrors can all form virtual images."},
    {"q": "वस्तु से बड़ा आभासी प्रतिबिम्ब बनता है :", "o": ["उत्तल दर्पण से", "अवतल दर्पण से", "समतल दर्पण से", "इनमें से किसी में नहीं"], "a": 1, "y": "BSEB 2024 (A)", "eh": "वस्तु को अवतल दर्पण के ध्रुव व फोकस के बीच रखने पर बड़ा आभासी प्रतिबिम्ब बनता है।", "ee": "An object between the pole and focus of a concave mirror gives a magnified virtual image."},
    {"q": "एक पिन छिद्र कैमरा (pin hole camera) किस सिद्धान्त पर कार्य करता है :", "o": ["अपवर्तन पर", "पूर्ण आन्तरिक परावर्तन पर", "परावर्तन पर", "प्रकाश के रेखीय प्रसारण पर"], "a": 3, "eh": "पिन-छिद्र कैमरा प्रकाश के ऋजुरेखीय (सीधी रेखा में) संचरण के सिद्धान्त पर कार्य करता है।", "ee": "A pinhole camera works on the rectilinear propagation of light."},
    {"q": "जल और काच के अपवर्तनांक क्रमशः 4/3 तथा 3/2 है। जल का काँच के सापेक्ष अपवर्तनांक होगा :", "o": ["2", "1/2", "9/8", "8/9"], "a": 3, "eh": "जल का काँच के सापेक्ष अपवर्तनांक = μw/μg = (4/3)/(3/2) = 8/9।", "ee": "Refractive index of water w.r.t. glass = (4/3)/(3/2) = 8/9."},
    {"q": "किस कारण वायु का बुलबुला पानी के अन्दर चमकता दिखाई देता है :", "o": ["परावर्तन के", "अपवर्तन के", "पूर्ण आन्तरिक परावर्तन के", "विवर्तन के"], "a": 2, "eh": "बुलबुले की सतह पर प्रकाश का पूर्ण आंतरिक परावर्तन होता है, इसलिए वह चमकता दिखाई देता है।", "ee": "Total internal reflection at the bubble's surface makes it shine."},
    {"q": "पूर्ण आन्तरिक परावर्तन के लिए क्रांतिक कोण अधिकतम होगा जबकि किरण जाती है :", "o": ["काँच से पानी में", "काँच से वायु में", "हीरे से वायु में", "पानी से वायु में"], "a": 0, "eh": "sin C = (विरल का μ)/(सघन का μ); काँच→पानी के लिए यह अनुपात सबसे बड़ा है, अतः क्रांतिक कोण अधिकतम होगा।", "ee": "sin C is the ratio of the two indices; it is greatest for glass-to-water, so the critical angle is maximum there."},
    {"q": "एक माध्यम से दूसरे माध्यम में जाने पर प्रकाश की किरण मुड़ जाती है। किरण के मुड़ने को कहा जाता है :", "o": ["व्यतिकरण", "वर्ण-विक्षेपण", "अपवर्तन", "परावर्तन"], "a": 2, "eh": "एक माध्यम से दूसरे माध्यम में जाने पर किरण का मुड़ना अपवर्तन कहलाता है।", "ee": "The bending of a ray passing from one medium to another is refraction."},
    {"q": "यदि काँच-वायु का क्रांतिक कोण θ हो, तो वायु के सापेक्ष काँच का अपवर्तनांक होगा :", "o": ["sin θ", "cosec θ", "sin² θ", "1/sin² θ"], "a": 1, "eh": "sin θ = 1/μ ⇒ μ = 1/sin θ = cosec θ।", "ee": "μ = 1/sin θ = cosec θ."},
    {"q": "काँच से हवा में प्रवेश करते समय किस प्रकाश का क्रांतिक कोण सबसे कम होता है :", "o": ["लाल रंग के लिए", "हरे रंग के लिए", "पीले रंग के लिए", "बैंगनी रंग के लिए"], "a": 3, "y": "BSEB 2017 (A)", "eh": "बैंगनी रंग का अपवर्तनांक सबसे अधिक होता है, अतः sin C = 1/μ सबसे कम ⇒ क्रांतिक कोण सबसे कम।", "ee": "Violet has the highest refractive index, hence the smallest critical angle."},
    {"q": "निम्नलिखित में किसका अपवर्तनांक सबसे अधिक होता है ?", "o": ["काँच", "पानी", "लोहा", "हीरा"], "a": 3, "y": "BSEB 2019 (A)", "eh": "हीरे का अपवर्तनांक (2.42) दिए गए पदार्थों में सबसे अधिक है।", "ee": "Diamond has the highest refractive index (2.42) among the options."},
    {"q": "हीरा का अपवर्तनांक करीब होता है :", "o": ["1", "1.5", "2.42", "4.14"], "a": 2, "y": "BSEB 2020 (A)", "eh": "हीरे का अपवर्तनांक लगभग 2.42 होता है।", "ee": "The refractive index of diamond is about 2.42."},
    {"q": "प्रकाश का वेग महत्तम होता है :", "o": ["हवा में", "शीशा में", "पानी में", "निर्वात में"], "a": 3, "y": "BSEB 2020 (A)", "eh": "प्रकाश का वेग निर्वात में महत्तम (3×10⁸ m/s) होता है।", "ee": "The speed of light is maximum in vacuum."},
    {"q": "जब प्रकाश एक माध्यम से दूसरे माध्यम में प्रवेश करता है, तो कौन-सी राशि परिवर्तित नहीं होती है ?", "o": ["तरंगदैर्घ्य", "आवृत्ति", "चाल", "आयाम"], "a": 1, "y": "BSEB 2019 (C)", "eh": "माध्यम बदलने पर चाल व तरंगदैर्घ्य बदलते हैं, पर आवृत्ति स्रोत पर निर्भर करती है — अपरिवर्तित रहती है।", "ee": "Frequency depends only on the source and does not change with the medium."},
    {"q": "लेंस की क्षमता का SI मात्रक होता है :", "o": ["जूल", "डायोप्टर", "कैण्डेला", "वाट"], "a": 1, "y": "BSEB 2011", "eh": "लेंस की क्षमता का SI मात्रक डायोप्टर (D) होता है।", "ee": "The SI unit of lens power is the dioptre."},
    {"q": "एक उभयोत्तल लेंस (μ = 1.5) के प्रत्येक तल की वक्रता त्रिज्या 20 सेमी है। लेंस की क्षमता है :", "o": ["5D", "10D", "2.5D", "20D"], "a": 0, "y": "BSEB 2012", "eh": "1/f = (1.5−1)(1/20 + 1/20) = 0.05 cm⁻¹ ⇒ f = 20 cm; P = 100/20 = 5 D।", "ee": "f = 20 cm, so P = 100/20 = 5 D."},
    {"q": "एक आवर्धक ग्लास जिसकी क्षमता 12 D है, की आवर्धक क्षमता है :", "o": ["4", "1200", "3", "25"], "a": 0, "y": "BSEB 2012", "eh": "सरल आवर्धक में M = 1 + D/f; P = 12 D ⇒ f = 100/12 cm; D = 25 cm लेने पर M = 1 + (25×12)/100 = 4।", "ee": "M = 1 + D·P/100 = 1 + 3 = 4 for a 12 D magnifier."},
    {"q": "दो उत्तल लेंस परस्पर संपर्क में रखे हैं। समतुल्य लेंस है :", "o": ["उत्तल", "अवतल", "समतलावतल", "बेलनाकार"], "a": 0, "eh": "दो उत्तल (अभिसारी) लेंसों की क्षमताएँ जुड़ जाती हैं, इसलिए संयोग भी उत्तल लेंस जैसा अभिसारी रहेगा।", "ee": "Powers of two convex lenses add up, so the combination stays convex (converging)."},
    {"q": "एक उत्तल लेंस में वस्तु और उसके वास्तविक प्रतिबिम्ब के बीच की न्यूनतम दूरी होती है :", "o": ["4f से अधिक", "4f से कम", "2f के बराबर", "4f के बराबर"], "a": 3, "eh": "वस्तु व उसके वास्तविक प्रतिबिम्ब के बीच न्यूनतम दूरी 4f होती है (जब वस्तु 2F पर हो)।", "ee": "The minimum object-real image distance for a convex lens is 4f."},
    {"q": "लेंस के द्वारा कितने प्रतिबिम्ब बनेंगे यदि वस्तु को प्रधान अक्ष पर रखा जाए : [आकृति: चार खंडों में बँटा लेंस]", "o": ["1", "2", "3", "7"], "a": 1, "y": "BSEB 2013", "eh": "आकृति में लेंस के खंड दो भिन्न अभिविन्यासों में रखे हैं, जिनसे वस्तु के दो प्रतिबिम्ब बनते हैं। पुस्तक उत्तर 2 है।", "ee": "As per the figure and the book key, the pieces form two images."},
    {"q": "20 सेमी और −40 सेमी फोकस दूरी वाले दो लेंसों के संयोग से बने समतुल्य लेंस की क्षमता होगी :", "o": ["+ 5 डायोप्टर", "− 5 डायोप्टर", "+ 2.5 डायोप्टर", "− 2.5 डायोप्टर"], "a": 2, "eh": "P₁ = +100/20 = +5 D, P₂ = −100/40 = −2.5 D ⇒ P = +2.5 D।", "ee": "P = +5 − 2.5 = +2.5 D."},
    {"q": "तीन लेंस जिनकी फोकस दूरी 20 सेमी, −30 सेमी और 60 सेमी है, एक-दूसरे से सटे रखे हैं। इस संयोजन की फोकस दूरी है।", "o": ["50 सेमी", "30 सेमी", "20 सेमी", "10 सेमी"], "a": 1, "eh": "1/F = 1/20 − 1/30 + 1/60 = (3 − 2 + 1)/60 = 2/60 ⇒ F = 30 cm।", "ee": "1/F = 1/20 − 1/30 + 1/60 = 1/30, so F = 30 cm."},
    {"q": "यदि समान फोकस दूरी f के दो अभिसारी लेंस एकदूसरे के संपर्क में रखे हों, तो इस संयोग की फोकस दूरी होगी :", "o": ["f", "2f", "f/2", "3f"], "a": 2, "y": "BSEB 2015 (A), 2025 (A)", "eh": "1/F = 1/f + 1/f = 2/f ⇒ F = f/2।", "ee": "Equal powers add: F = f/2."},
    {"q": "यदि किस लेंस की फोकस दूरी f मीटर हो, तो इसकी क्षमता का मान होगा :", "o": ["f डायोप्टर", "1/f डायोप्टर", "1 − f डायोप्टर", "100/f डायोप्टर"], "a": 1, "eh": "क्षमता P = 1/f होती है, जब f मीटर में हो; मात्रक डायोप्टर।", "ee": "Power P = 1/f dioptre when f is in metres."},
    {"q": "काँच के एक अवतल लेंस को जब जल में डुबोया जाता है, तब यह हो जाता है :", "o": ["कम अभिसारी (convergent)", "अधिक अभिसारी", "कम अपसारी (divergent)", "अधिक अपसारी"], "a": 2, "eh": "जल में लेंस व माध्यम के अपवर्तनांकों का अंतर घट जाता है, इसलिए अवतल लेंस कम अपसारी हो जाता है।", "ee": "In water the index contrast falls, so the concave lens diverges less."},
    {"q": "जब किसी उत्तल लेंस जिसका अपवर्तनांक 1.5 तथा फोकस दूरी f है, को जल (n = 4/3) में डुबोया जाता है, तब उसकी फोकस दूरी :", "o": ["f से बड़ी हो सकती है", "f से छोटी हो जाती है", "अपरिवर्तित रहती है", "इनमें से कोई नहीं"], "a": 0, "eh": "जल (μ = 4/3) में सापेक्ष अपवर्तनांक घटने से लेंस दुर्बल हो जाता है, इसलिए फोकस दूरी f से बढ़ जाती है।", "ee": "In water the lens becomes weaker, so its focal length increases beyond f."},
    {"q": "दो पतले लेंस संपर्क में रखे जाने पर +10D क्षमता का युग्म बनाते हैं। जब उनके बीच की दूरी 0.25 मीटर है तो क्षमता घटकर +6D हो जाती है। लेंसों की फोकस दूरियाँ सेमी में है :", "o": ["10, 16.7", "25, 16.67", "50, 12.5", "12.5, 12.5"], "a": 2, "eh": "P₁+P₂ = 10 और दूरी d = 0.25 m पर P = P₁+P₂ − d·P₁P₂ = 6 ⇒ P₁P₂ = 16। क्षमताएँ 8 D व 2 D ⇒ फोकस दूरियाँ 12.5 cm व 50 cm।", "ee": "Solving P₁+P₂ = 10 and P₁P₂ = 16 gives powers 8 D and 2 D, i.e. focal lengths 12.5 cm and 50 cm."},
    {"q": "एक लेंस की फोकस दूरी 20 सेमी है। इसकी क्षमता होगी :", "o": ["20 डायोप्टर", "0.05 डायोप्टर", "0.5 डायोप्टर", "5 डायोप्टर"], "a": 3, "y": "BSEB 2020 (A)", "eh": "P = 100/f(cm) = 100/20 = 5 D।", "ee": "P = 100/20 = 5 D."},
    {"q": "f₁ तथा f₂ फोकस दूरी के दो पतले लेंस एक-दूसरे के संपर्क में स्थित हैं। संयुक्त लेंस की फोकस दूरी होगी :", "o": ["(f₁+f₂)/2", "(f₁+f₂)", "(f₁+f₂)/f₁f₂", "f₁f₂/(f₁+f₂)"], "a": 3, "eh": "संपर्कित लेंसों के लिए 1/F = 1/f₁ + 1/f₂ ⇒ F = f₁f₂/(f₁+f₂)।", "ee": "For lenses in contact, F = f₁f₂/(f₁ + f₂)."},
    {"q": "एक द्वि-उत्तल लेंस की वक्रता-त्रिज्याएँ 10 सेमी और 15 सेमी है। यदि इसके पदार्थ का अपवर्तनांक 1.5 हो, तो इसकी फोकस होगी :", "o": ["30 सेमी", "24 सेमी", "12 सेमी", "24 मीटर"], "a": 2, "eh": "1/f = (1.5−1)(1/10 + 1/15) = 0.5 × (5/30) = 1/12 ⇒ f = 12 cm।", "ee": "By the lens maker's formula, f = 12 cm."},
    {"q": "जब श्वेत प्रकाश की किरण लेंस में प्रवेश करती है तो निम्न में से किसमें परिवर्तन होता है :", "o": ["वेग और तरंगदैर्घ्य में", "तरंगदैर्घ्य में", "वेग में", "आकृति में"], "a": 0, "eh": "माध्यम में प्रवेश पर प्रकाश का वेग बदलता है और v = νλ से तरंगदैर्घ्य भी बदलती है; आवृत्ति स्थिर रहती है।", "ee": "Entering a medium changes both the speed and the wavelength of light; frequency stays constant."},
    {"q": "दो लेंस जिनकी क्षमता −15D तथा +5D है, को संयुक्त करने पर समायोजन की फोकस दूरी होगी :", "o": ["−20 cm", "−10 cm", "+10 cm", "कोई नहीं"], "a": 1, "y": "BSEB 2019 (A)", "eh": "P = −15 + 5 = −10 D ⇒ f = 100/(−10) = −10 cm।", "ee": "Total power −10 D gives f = −10 cm."},
    {"q": "प्रकाश की एक किरण काँच जिसका अपवर्तनांक μ√3 है, के गोलीय सतह पर 60° के कोण पर आपतित होती है। इस सतह पर परावर्तित और अपवर्तित होनेवाली किरणों के बीच का कोण होगा :", "o": ["40°", "60°", "80°", "90°"], "a": 3, "eh": "μ = √3, i = 60° ⇒ r = 30°। परावर्तित किरण अभिलम्ब से 60° पर दूसरी ओर होती है; दोनों किरणों के बीच कोण = 180° − 60° − 30° = 90°।", "ee": "With r = 30°, the angle between the reflected and refracted rays is 90°."},
    {"q": "एक उत्तल लेंस (n = 1.5) को पानी (n = 1.33) में डुबाया जाता है, तब वह व्यवहार करता है :", "o": ["उत्तल लेंस की तरह", "अपसारी लेंस की तरह", "प्रिज्म की तरह", "अवतल दर्पण की तरह"], "a": 0, "y": "BSEB 2019 (A), 2019 (C)", "eh": "उत्तल लेंस पानी में भी अभिसारी ही रहता है, केवल उसकी क्षमता घट जाती है, क्योंकि पानी का अपवर्तनांक वायु से अधिक पर लेंस के पदार्थ से कम है।", "ee": "The lens remains converging in water, only weaker, as water's index is below that of the lens material."},
    {"q": "किसी वस्तु का मनुष्य की आँख के रेटिना पर बना प्रतिबिम्ब होता है :", "o": ["काल्पनिक, सीधा", "वास्तविक, सीधा", "काल्पनिक, उल्टा", "वास्तविक, उल्टा"], "a": 3, "y": "BSEB 2019 (C), 2022 (A), 2024 (A)", "eh": "नेत्र लेंस रेटिना पर वास्तविक व उल्टा प्रतिबिम्ब बनाता है; मस्तिष्क उसे सीधा अनुभव करता है।", "ee": "The eye lens forms a real, inverted image on the retina."},
    {"q": "विभिन्न दिशाओं में कॉर्निया की वक्रता में असमानता के कारण उत्पन्न दृष्टि-दोष को कहते हैं :", "o": ["निकट-दृष्टि", "दूर-दृष्टि", "जरा-दृष्टि", "अबिंदुकता"], "a": 3, "eh": "कॉर्निया की असमान वक्रता से उत्पन्न दोष अबिंदुकता (astigmatism) कहलाता है।", "ee": "Unequal corneal curvature causes astigmatism (अबिंदुकता)."},
    {"q": "निकट-दृष्टि दोष निवारण के लिए प्रयुक्त किया जाता है :", "o": ["गोलीय-बेलनाकार लेंस", "उत्तल लेंस", "अवतल लेंस", "अवतलोत्तल लेंस"], "a": 2, "y": "BSEB 2017 (A), 2020 (A)", "eh": "निकट-दृष्टि में प्रतिबिम्ब रेटिना से पहले बनता है; अवतल (अपसारी) लेंस उसे रेटिना पर लाता है।", "ee": "Myopia is corrected with a concave (diverging) lens."},
    {"q": "एक दूरबीन के अभिदृश्यक की फोकस दूरी 60 सेमी है। 20 गुना आवर्धन प्राप्त करने के लिए नेत्रिका की फोकस दूरी होनी चाहिए :", "o": ["2 सेमी", "3 सेमी", "4 सेमी", "5 सेमी"], "a": 1, "eh": "M = fo/fe ⇒ 20 = 60/fe ⇒ fe = 3 cm।", "ee": "fe = fo/M = 60/20 = 3 cm."},
    {"q": "सरल सूक्ष्मदर्शी की आवर्धन क्षमता होती है :", "o": ["D + f", "D + 1/f", "1 + D/f", "−1"], "a": 2, "y": "BSEB 2022 (A)", "eh": "सरल सूक्ष्मदर्शी की आवर्धन क्षमता M = 1 + D/f होती है।", "ee": "Magnifying power of a simple microscope is 1 + D/f."},
    {"q": "एक व्यक्ति −2.5 D क्षमता का चश्मा पहनता है। नेत्र-दोष तथा बिना चश्मे के व्यक्ति का दूर-बिन्दु है :", "o": ["दूर दृष्टि 40 सेमी", "निकट दृष्टि 40 सेमी", "अबिंदुकता 40 सेमी", "निकट दृष्टि 250 सेमी"], "a": 1, "eh": "ऋणात्मक क्षमता ⇒ निकट-दृष्टि दोष। दूर-बिन्दु = फोकस दूरी = 100/2.5 = 40 cm।", "ee": "Negative power means myopia; the far point is 100/2.5 = 40 cm."},
    {"q": "यौगिक सूक्ष्मदर्शी की नली की लम्बाई बढ़ाई जाती है, तब उसकी आवर्धन क्षमता :", "o": ["बढ़ती है", "घटती है", "शून्य हो जाती है", "अपरिवर्तित रहती है"], "a": 0, "y": "BSEB 2020 (A)", "eh": "M = (L/fo)(1 + D/fe); नली की लम्बाई L बढ़ने से आवर्धन क्षमता बढ़ती है।", "ee": "Magnification grows with tube length L in M = (L/fo)(1 + D/fe)."},
    {"q": "खगोलीय दूरदर्शी में अंतिम प्रतिबिम्ब होता है :", "o": ["वास्तविक व सीधा", "वास्तविक व उल्टा", "आभासी व सीधा", "आभासी व उल्टा"], "a": 3, "y": "BSEB 2016 (A)", "eh": "खगोलीय दूरदर्शी का अंतिम प्रतिबिम्ब आभासी व वस्तु के सापेक्ष उल्टा होता है।", "ee": "An astronomical telescope gives a virtual, inverted final image."},
    {"q": "एक दीर्घ-दृष्टि वाले व्यक्ति को आवश्यकता होगी :", "o": ["उत्तल लेंस की", "अवतल लेंस की", "बेलनाकार लेंस की", "समतलावतल लेंस की"], "a": 0, "y": "BSEB 2017 (C)", "eh": "दीर्घ-दृष्टि (दूर-दृष्टि) में निकट वस्तु का प्रतिबिम्ब रेटिना के पीछे बनता है; इसके लिए उत्तल लेंस चाहिए।", "ee": "Hypermetropia is corrected by a convex lens."},
    {"q": "किसी दूरबीन (telescope) के अभिदृश्यक एवं नेत्रिका की फोकस दूरियाँ क्रमशः 20 सेमी तथा 2 सेमी है। इस दूरबीन की आवर्धन क्षमता है :", "o": ["2", "10", "20", "22"], "a": 1, "eh": "M = fo/fe = 20/2 = 10।", "ee": "M = 20/2 = 10."},
    {"q": "सामान्य समायोजन में खगोलीय दूरदर्शक की नली की लम्बाई होगी :", "o": ["fo − fe", "fo × fe", "fo/fe", "fo + fe"], "a": 3, "y": "BSEB 2016 C, 2021 (A)", "eh": "सामान्य समायोजन में दूरदर्शी की नली की लम्बाई = fo + fe होती है।", "ee": "In normal adjustment the tube length is fo + fe."},
    {"q": "वर्ण विपथन का दोष नहीं पाया जाता है :", "o": ["अपवर्तक दूरदर्शक में", "परावर्तक दूरदर्शक में", "'A' एवं 'B' दोनों में", "इनमें से कोई नहीं"], "a": 1, "eh": "परावर्तक दूरदर्शी में दर्पण प्रयुक्त होता है; परावर्तन में वर्ण-विक्षेपण नहीं होता, इसलिए वर्ण विपथन नहीं पाया जाता।", "ee": "A reflecting telescope uses a mirror; reflection has no dispersion, so there is no chromatic aberration."},
    {"q": "बेलनाकार लेंस का व्यवहार किया जाता है, आँख के उस दोष को दूर करने के लिए जिसे कहा जाता है :", "o": ["निकट-दृष्टिता", "दीर्घ-दृष्टिता", "एस्टिगमैटिज्म", "जरा-दृष्टिता"], "a": 2, "y": "BSEB 2019 (A)", "eh": "एस्टिगमैटिज्म (अबिंदुकता) दूर करने के लिए बेलनाकार लेंस प्रयुक्त होता है।", "ee": "Astigmatism is corrected with a cylindrical lens."},
    {"q": "सामान्य समायोजन के लिए खगोलीय दूरदर्शक की आवर्धन क्षमता होती है :", "o": ["−fo/fe", "−fo × fe", "−fe/fo", "−fo + fe"], "a": 0, "y": "BSEB 2019 (A), 2022 (A)", "eh": "सामान्य समायोजन में खगोलीय दूरदर्शी की आवर्धन क्षमता M = −fo/fe होती है (ऋणात्मक चिह्न उल्टा प्रतिबिम्ब दिखाता है)।", "ee": "In normal adjustment, M = −fo/fe."},
    {"q": "संयुक्त सूक्ष्मदर्शी की आवर्धन क्षमता के लिए कौन-सा संबंध सही है ?", "o": ["M = −L/fo(1 + D/fe)", "M = −fo/L(1 + D/fe)", "M = (1 + D/fe)", "M = (1 − D/fe)"], "a": 0, "y": "BSEB 2020 (A)", "eh": "संयुक्त सूक्ष्मदर्शी की आवर्धन क्षमता का सूत्र M = −(L/fo)(1 + D/fe) है।", "ee": "The compound microscope formula is M = −(L/fo)(1 + D/fe)."},
    {"q": "सामान्य समायोजन के लिए संयुक्त सूक्ष्मदर्शी की आवर्धन-क्षमता होती है :", "o": ["(v0/u0)(1 + D/fe)", "−(v0/u0)(1 + D/fe)", "(u0/v0)(1 + D/fe)", "u0/v0 + fe/D"], "a": 1, "y": "BSEB 2019 (C)", "eh": "मानक रूप में M = −(v0/u0)(1 + D/fe); ऋणात्मक चिह्न उल्टा प्रतिबिम्ब दर्शाता है।", "ee": "M = −(v0/u0)(1 + D/fe); the minus sign shows an inverted image."},
    {"q": "पतली झिल्ली के रंगीन दिखने का कारण है :", "o": ["प्रकीर्णन", "व्यतिकरण", "विवर्तन", "ध्रुवण"], "a": 1, "y": "BSEB 2017 (C)", "eh": "पतली झिल्ली की दोनों सतहों से परावर्तित तरंगों के व्यतिकरण से रंग दिखाई देते हैं।", "ee": "Colours of a thin film arise from interference between reflections from its two surfaces."},
    {"q": "आसमान का रंग नीला दिखने का कारण है :", "o": ["प्रकीर्णन", "व्यतिकरण", "ध्रुवण", "विवर्तन"], "a": 0, "y": "BSEB 2017 (C), 2024 (A)", "eh": "वायु के अणुओं द्वारा छोटे तरंगदैर्घ्य (नीले) प्रकाश का प्रकीर्णन सबसे अधिक होता है (I ∝ 1/λ⁴)।", "ee": "Blue light is scattered most by air molecules (Rayleigh scattering, I ∝ 1/λ⁴)."},
    {"q": "यदि नीले रंग के प्रकाश के फोटॉन की ऊर्जा E₁ और पीले रंग के प्रकाश के फोटॉन की ऊर्जा E₂ हो तो :", "o": ["E₁ = E₂", "E₁ > E₂", "E₁ < E₂", "E₁ = E₂"], "a": 1, "y": "BSEB 2017 (C)", "eh": "फोटॉन की ऊर्जा E = hν; नीले प्रकाश की आवृत्ति पीले से अधिक है, अतः E₁ > E₂।", "ee": "Photon energy E = hν is higher for blue than for yellow light."},
    {"q": "n अपवर्तनांक वाले शीशे की पट्टी में पथ की लंबाई t का समतुल्यांक निर्वात में ...... पथ की लंबाई है :", "o": ["(n − 1) t", "nt", "(n/t − 1)", "इनमें से कोई नहीं"], "a": 1, "y": "BSEB 2011", "eh": "प्रकाशिक पथ = अपवर्तनांक × ज्यामितीय पथ = nt।", "ee": "Optical path = refractive index × geometric path = nt."},
    {"q": "जब प्रकाश की एक किरण स्लैब में प्रवेश करती है, तो इसका तरंगदैर्घ्य :", "o": ["घटता है", "बढ़ता है", "अपरिवर्तित रहता है", "आंकड़े पूर्ण नहीं है"], "a": 0, "y": "BSEB 2013, 2015, 2016 (A)", "eh": "सघन माध्यम (स्लैब) में आवृत्ति स्थिर रहती है, चाल घटती है, अतः तरंगदैर्घ्य λ = v/ν घटता है।", "ee": "In a denser medium the speed falls at constant frequency, so the wavelength decreases."},
    {"q": "प्रकाश की अनुप्रस्थ तरंग प्रकृति पुष्टि करता है :", "o": ["व्यतिकरण को", "परावर्तन को", "ध्रुवण को", "वर्ण-विक्षेपण को"], "a": 2, "y": "BSEB 2015", "eh": "ध्रुवण ही प्रकाश की अनुप्रस्थ प्रकृति की पुष्टि करता है।", "ee": "Polarisation confirms the transverse nature of light."},
    {"q": "इंद्रधनुष का निर्माण जिस कारण से होता है, वह है :", "o": ["प्रकीर्णन", "विवर्तन", "वर्ण-विक्षेपण", "अपवर्तन"], "a": 2, "y": "BSEB 2022 (A), 2024 (A)", "eh": "इंद्रधनुष में वर्षा-बूँदों के भीतर अपवर्तन के साथ वर्ण-विक्षेपण (रंगों का पृथक्करण) होता है। पुस्तक उत्तर वर्ण-विक्षेपण है।", "ee": "A rainbow involves dispersion of sunlight in raindrops (with refraction and internal reflection); the book key is dispersion."},
    {"q": "वायुमण्डल की अनुपस्थिति में पृथ्वी से आसमान का रंग दिखाई देगा :", "o": ["काला", "नीला", "नारंगी", "लाल"], "a": 0, "eh": "वायुमण्डल न हो तो प्रकीर्णन नहीं होगा और दिन में भी आकाश काला दिखाई देगा।", "ee": "Without an atmosphere there is no scattering, so the sky would look black."},
    {"q": "एक प्रिज्म के पदार्थ का अपवर्तनांक √2 है तथा अपवर्तक कोण 60° है। न्यूनतम विचलन के लिए आपतन कोण होना चाहिए :", "o": ["30°", "45°", "60°", "75°"], "a": 1, "eh": "न्यूनतम विचलन पर μ = sin((A+δm)/2)/sin(A/2) से sin((60°+δm)/2) = √2·sin30° = 1/√2 ⇒ (A+δm)/2 = 45°, और आपतन कोण i = (A+δm)/2 = 45°।", "ee": "At minimum deviation the angle of incidence works out to 45°."},
    {"q": "काँच (n = 1.5) के पतले प्रिज्म में न्यूनतम विचलन कोण δm तथा अपवर्तन कोण r में सम्बन्ध होगा :", "o": ["δm = r", "δm = 1.5r", "δm = 2r", "δm = 0.5 r"], "a": 0, "eh": "δm = (μ−1)A = 0.5A तथा न्यूनतम विचलन की स्थिति में r = A/2, अतः δm = r।", "ee": "δm = 0.5A and r = A/2 at minimum deviation, so δm = r."},
    {"q": "वायु में 4200 Å तरंगदैर्घ्य के एकवर्णी नीले प्रकाश का एक किरण पुंज जल (अपवर्तनांक = 4/3) में संचरण करता है। जल में इसकी तरंगदैर्घ्य होगी :", "o": ["2800 Å", "5600 Å", "3150 Å", "4000 Å"], "a": 1, "eh": "पुस्तक उत्तर 5600 Å दिया है। नोट: सूत्र λ' = λ/μ = 4200/(4/3) = 3150 Å आता है — शिक्षक से सत्यापित कराएँ।", "ee": "Book key: 5600 Å. Note: λ/μ = 4200/(4/3) = 3150 Å by formula — the teacher may verify."},
    {"q": "किसी पारदर्शी माध्यम के अपवर्तनांक एवं प्रकाश की तरंगदैर्घ्य में सम्बन्ध है :", "o": ["n = Aλ + B", "n = A + Bλ²", "n = A + B/λ²", "n = A + B/λ²"], "a": 2, "eh": "कौशी के सम्बन्धानुसार μ = A + B/λ² (तरंगदैर्घ्य बढ़ने पर अपवर्तनांक घटता है)।", "ee": "By Cauchy's relation, μ = A + B/λ²."},
    {"q": "प्रकाश के रंग का कारण है :", "o": ["इसकी आवृत्ति", "इसका वेग", "इसकी कला", "इसका आयाम"], "a": 0, "y": "BSEB 2019 (A)", "eh": "प्रकाश का रंग उसकी आवृत्ति से निर्धारित होता है, जो माध्यम बदलने पर भी नहीं बदलती।", "ee": "Colour is determined by frequency, which does not change with the medium."},
    {"q": "n अपवर्तनांक तथा A प्रिज्म कोण वाले पतले प्रिज्म का न्यूनतम विचलन कोण होता है :", "o": ["(1 − n)A", "(n − 1)A", "(n + 1)A", "(1 + n)A²"], "a": 1, "y": "BSEB 2019 (A)", "eh": "पतले प्रिज्म के लिए न्यूनतम विचलन कोण δm = (μ − 1)A होता है।", "ee": "For a thin prism, δm = (μ − 1)A."},

    {"q": "खगोलीय दूरदर्शी के लिए निम्नलिखित में कौन सही है ?", "o": ["fo = fe", "fo > fe", "fo < fe", "fo << fe"], "a": 1, "y": "BSEB 2021 (A)", "eh": "खगोलीय दूरदर्शी में अभिदृश्यक की फोकस दूरी नेत्रिका से बहुत अधिक होती है (fo > fe)।", "ee": "In an astronomical telescope fo is much greater than fe."},
    {"q": "एक सरल सूक्ष्मदर्शी से बना प्रतिबिंब होता है :", "o": ["काल्पनिक और सीधा", "काल्पनिक और उल्टा", "वास्तविक और सीधा", "वास्तविक और उल्टा"], "a": 0, "y": "BSEB 2021 (A)", "eh": "सरल सूक्ष्मदर्शी (उत्तल लेंस) काल्पनिक (आभासी) व सीधा आवर्धित प्रतिबिम्ब बनाता है।", "ee": "A simple microscope forms a virtual (काल्पनिक), erect magnified image."},

    {"q": "उत्तल लेंस द्वारा निम्नलिखित में कौन-सा दृष्टि दोष दूर किया जाता है ?", "o": ["निकट-दृष्टिता", "दूर-दृष्टिता", "जरा-दूरदर्शिता", "अबिंदुकता"], "a": 1, "y": "BSEB 2021 (A), 2024 (A)", "eh": "उत्तल लेंस दूर-दृष्टिता (हाइपरमेट्रोपिया) का दोष दूर करता है।", "ee": "A convex lens corrects far-sightedness (दूर-दृष्टिता)."},

    {"q": "वर्ण-विक्षेपण क्षमता के लिए निम्नलिखित में कौन संबंध सही है ?", "o": ["w = (μv − μr)/(μy − 1)", "w = (μv − μr)(μy − 1)", "w = (μy − 1)/(μv − μr)", "w = μv·μr/(μy − 1)"], "a": 0, "y": "BSEB 2021 (A), 2022 (A)", "eh": "वर्ण-विक्षेपण क्षमता ω = (μv − μr)/(μy − 1)।", "ee": "Dispersive power ω = (μv − μr)/(μy − 1)."},

    {"q": "यदि काँच के एक लेंस (μ = 3/2) की हवा में फोकस दूरी fa हो और पानी (μ = 4/3) में fw हो, तो :", "o": ["fw = fa", "fw = 2fa", "fw = 3fa", "fw = 4fa"], "a": 3, "y": "BSEB 2022 (A)", "eh": "वायु में 1/fa = (1.5−1)K = 0.5K; पानी में 1/fw = (1.5/(4/3) − 1)K = 0.125K ⇒ fw = 4fa।", "ee": "In water the relative index falls to 9/8, making the lens four times weaker: fw = 4fa."},
