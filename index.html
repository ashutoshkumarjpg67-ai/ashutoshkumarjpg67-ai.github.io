    '<div class="stats"><div class="stat"><b>'+c.total+'</b><span>कुल प्रश्न<br>Questions</span></div>'+
    '<div class="stat"><b>'+(b===null?'—':b+'%')+'</b><span>सर्वश्रेष्ठ<br>Best score</span></div>'+
    '<div class="stat"><b>'+hist.length+'</b><span>प्रयास<br>Attempts</span></div></div>';
  if (!bank.length){
    h+='<div class="empty"><div class="ei">'+IC.clock+'</div><h2>प्रश्न जल्द जोड़े जाएँगे</h2><p>Questions will be added soon</p></div>';
  } else {
    var done = at ? countKeys(at.ans) : 0;
    h+='<div class="stack">';
    if (at && done){
      h+='<button class="btn" data-go="#/q/'+cid+'/'+(at.idx||0)+'">जारी रखें · Resume ('+done+'/'+bank.length+')</button>'+
         '<button class="btn ghost" data-restart="'+cid+'">नए सिरे से शुरू · Restart</button>';
    } else {
      h+='<button class="btn" data-go="#/q/'+cid+'/0">क्विज़ शुरू करें · Start Quiz</button>';
    }
    h+='</div>';
  }
  if (hist.length){
    h+='<div class="sec-title">पिछले प्रयास · ATTEMPT HISTORY</div>';
    var shown=0;
    for (var i=hist.length-1; i>=0 && shown<10; i--, shown++){
      var e=hist[i];
      h+='<button class="hrow" data-go="#/r/'+cid+'/'+i+'"><span class="d"><b>'+e.c+' / '+e.n+' सही · correct</b>'+fmtDate(e.ts)+'</span><span class="pc">'+e.pct+'%</span><span class="chev">'+IC.chev+'</span></button>';
    }
    h+='<button class="btn danger" data-clear="'+cid+'" style="margin-top:6px">इतिहास मिटाएँ · Clear history</button>';
  }
  $app.innerHTML=h+'<div class="pad"></div></section>';
}

/* =========================================================
   QUIZ  (one question per screen · jump palette · mark for review)
   ========================================================= */
var CUR = { cid:null, idx:0 };

function quizView(cid, idx){
  var o=chapOf(cid); if(!o||o.ex) return home();
  var s=o.s, c=o.c, bank=BANK[cid]||[], n=bank.length;
  if (!n) return chapterView(cid);
  idx = Math.min(Math.max(idx|0,0), n-1);
  var at=getAt(cid,true); at.idx=idx; save();
  CUR.cid=cid; CUR.idx=idx; REVIEW_OK=null;
  head({back:'#/c/'+cid, title:'अध्याय '+c.no+' · '+c.hi, crumb:s.en+' · Quiz', cls:s.cls});
  var m=bank[idx], picked=at.ans[idx], marked=!!at.marks[idx], last=(idx===n-1);
  var allDone = tally(cid,at.ans).answered===n;
  var h='<section class="view">'+
    '<div class="qtop"><span class="qcount">प्रश्न '+(idx+1)+' / '+n+'</span>'+
    /* shortcut to the Review screen — appears only once EVERY question has been answered */
    '<button class="tbtn" data-review id="revShort"'+(allDone?'':' hidden')+'>समीक्षा · Review →</button></div>'+
    '<div class="bar qbar"><i style="width:'+((idx+1)/n*100)+'%"></i></div>'+
    '<article class="qcard"><div class="qhead"><span class="qlead"><span class="qnum">Q'+(idx+1)+'</span>'+
    /* optional year tag — rendered only when the question has a non-empty `y` field */
    ((typeof m.y==='string' && m.y.replace(/\s+/g,'')) ? '<span class="ytag">'+esc(m.y)+'</span>' : '')+'</span>'+
    '<button class="mbtn'+(marked?' on':'')+'" data-mark aria-pressed="'+marked+'">'+IC.flag+'<span>समीक्षा · Review</span></button></div>'+
    '<div class="qtext">'+esc(m.q)+'</div><div class="opts" role="group" aria-label="Options">';
  m.o.forEach(function(t,i){
    var cl='opt', dis='';
    if (picked!==undefined){
      dis=' disabled';
      if (i===m.a) cl+=' ok'; else if (i===picked) cl+=' bad'; else cl+=' dim';
    }
    h+='<button class="'+cl+'" data-pick="'+i+'"'+dis+'><span class="ltr">'+LET[i]+'</span><span class="txt">'+esc(t)+'</span>'+
       '<span class="mk">'+(i===m.a?IC.ok:IC.no)+'</span></button>';
  });
  h+='</div><div class="expl'+(picked!==undefined?' open':'')+'" id="expl" aria-live="polite"><div>'+explHTML(m,picked)+'</div></div></article>'+
     '<div class="qpad"></div></section>'+
     '<div class="qnav"><div class="in"><button class="btn ghost" '+(idx===0?'disabled':'')+' data-go="#/q/'+cid+'/'+(idx-1)+'">← पिछला</button>'+
     '<button class="btn ghost pal" data-sheet aria-label="प्रश्न सूची · Question list">'+IC.grid+'<span>सूची</span></button>'+
     (last ? '<button class="btn" data-review>समीक्षा · Review →</button>'
           : '<button class="btn" data-go="#/q/'+cid+'/'+(idx+1)+'">अगला · Next →</button>')+'</div></div>';
  $app.innerHTML=h;
}
function explHTML(m, picked){
  if (picked===undefined) return '';
  var good = picked===m.a;
  return '<div class="expl-in"><div class="verdict '+(good?'ok':'bad')+'">'+
    (good?'सही उत्तर! · Correct!':'गलत उत्तर · Incorrect — सही उत्तर · Correct: ('+LET[m.a]+')')+'</div>'+
    '<div class="elabel">व्याख्या (हिंदी)</div><div class="etext">'+esc(m.eh||'')+'</div>'+
    '<div class="elabel">Explanation (English)</div><div class="etext">'+esc(m.ee||'')+'</div></div>';
}
function pick(i){
  var cid=CUR.cid, idx=CUR.idx, at=getAt(cid,true);
  if (at.ans[idx]!==undefined) return;
  at.ans[idx]=i; save();
  var m=BANK[cid][idx];
  Array.prototype.forEach.call($app.querySelectorAll('.opt'), function(b,k){
    b.disabled=true;
    if (k===m.a) b.classList.add('ok'); else if (k===i) b.classList.add('bad'); else b.classList.add('dim');
  });
  var ex=document.getElementById('expl');
  ex.firstElementChild.innerHTML=explHTML(m,i);
  requestAnimationFrame(function(){ ex.classList.add('open'); });
  var rs=document.getElementById('revShort');
  if (rs && tally(cid,at.ans).answered===BANK[cid].length) rs.hidden=false;
  setTimeout(function(){ try{ ex.scrollIntoView({block:'nearest',behavior:'smooth'}); }catch(e){} }, 330);
}
function toggleMark(){
  var at=getAt(CUR.cid,true);
  if (at.marks[CUR.idx]) delete at.marks[CUR.idx]; else at.marks[CUR.idx]=1;
  save();
  var on=!!at.marks[CUR.idx], b=$app.querySelector('[data-mark]');
  if (b){ b.classList.toggle('on',on); b.setAttribute('aria-pressed', on?'true':'false'); }
}

/* ---- Palette sheet ---- */
var sheetEl=document.getElementById('sheet'), sbody=document.getElementById('sbody'), lastFocus=null;
/* The palette is navigation ONLY: jump to a question. It contains no Submit / Finish control. */
function openSheet(){
  if (!CUR.cid) return;
  var cid=CUR.cid, bank=BANK[cid]||[], at=getAt(cid,true), t=tally(cid,at.ans), mk=countKeys(at.marks);
  var h='<div class="legend"><span><i class="sw a"></i>उत्तरित · Answered</span><span><i class="sw"></i>अनुत्तरित · Unanswered</span>'+
        '<span><i class="sw m"></i>समीक्षा · Review</span><span><i class="sw c"></i>वर्तमान · Current</span></div><div class="pgrid">';
  for (var i=0;i<bank.length;i++){
    var cl='pc'+(at.ans[i]!==undefined?' a':'')+(at.marks[i]?' m':'')+(i===CUR.idx?' cur':'');
    var lbl='प्रश्न '+(i+1)+(at.ans[i]!==undefined?' – उत्तरित':' – अनुत्तरित')+(at.marks[i]?' – समीक्षा के लिए चिह्नित':'');
    h+='<button class="'+cl+'" data-jump="'+i+'" aria-label="'+lbl+'">'+(i+1)+'</button>';
  }
  h+='</div><div class="sumline"><b>'+t.answered+'</b> उत्तरित · answered &nbsp;|&nbsp; <b>'+t.skipped+'</b> अनुत्तरित · unanswered &nbsp;|&nbsp; <b>'+mk+'</b> समीक्षा · review</div>';
  h+='<div class="stack"><button class="btn ghost" data-close>बंद करें · Close</button></div>';
  sbody.innerHTML=h;
  lastFocus=document.activeElement;
  sheetEl.hidden=false; document.body.style.overflow='hidden';
  var x=sheetEl.querySelector('.x'); if (x && x.focus) x.focus();
}
function closeSheet(){
  if (sheetEl.hidden) return;
  sheetEl.hidden=true; document.body.style.overflow='';
  if (lastFocus && lastFocus.focus && document.body.contains(lastFocus)) { try{ lastFocus.focus(); }catch(e){} }
}
/* =========================================================
   REVIEW SCREEN — the ONLY place a Submit control exists.
   Reachable only from the last question's "Review →" button, or the
   "Review →" shortcut that appears once every question is answered.
   Submitting needs an explicit second tap ("Yes, submit").
   ========================================================= */
var REVIEW_OK = null;
function reviewView(cid){
  var o=chapOf(cid); if(!o||o.ex) return home();
  var bank=BANK[cid]||[], n=bank.length, at=getAt(cid,false);
  if (!n || !at || REVIEW_OK!==cid) return quizView(cid, at ? (at.idx||0) : 0);   // not reached legitimately
  var s=o.s, c=o.c; CUR.cid=cid; CUR.idx=at.idx||0;
  head({back:'#/q/'+cid+'/'+CUR.idx, title:'समीक्षा · Review', crumb:'अध्याय '+c.no+' · '+c.hi, cls:s.cls});
  var t=tally(cid,at.ans), un=[], mk=[];
  for (var i=0;i<n;i++){ if (at.ans[i]===undefined) un.push(i); if (at.marks[i]) mk.push(i); }
  function cells(arr, cls){ var h='<div class="pgrid">'; arr.forEach(function(i){
    h+='<button class="pc '+cls+'" data-jump="'+i+'" aria-label="प्रश्न '+(i+1)+' पर जाएँ">'+(i+1)+'</button>'; }); return h+'</div>'; }
  var h='<section class="view"><div class="chead"><div class="kicker">'+c.hi+' · '+c.en+'</div><h1>समीक्षा · Review</h1>'+
    '<div class="en">जमा करने से पहले अपने उत्तर जाँच लें · Check before you submit</div></div>'+
    '<div class="stats"><div class="stat"><b>'+t.answered+'</b><span>उत्तरित<br>Answered</span></div>'+
    '<div class="stat skip"><b>'+un.length+'</b><span>अनुत्तरित<br>Unanswered</span></div>'+
    '<div class="stat"><b>'+mk.length+'</b><span>समीक्षा के लिए<br>Marked</span></div></div>';
  if (un.length)  h+='<div class="sec-title">अनुत्तरित प्रश्न · UNANSWERED (tap to answer)</div>'+cells(un,'');
  if (mk.length)  h+='<div class="sec-title">समीक्षा के लिए चिह्नित · MARKED FOR REVIEW</div>'+cells(mk,'m'+'');
  h+='<div class="stack" style="margin-top:20px" id="rvActions">';
  if (t.answered===0){
    h+='<div class="confirm">टेस्ट जमा करने से पहले कम से कम एक प्रश्न हल करें।<br>Answer at least one question before submitting.</div>';
  } else {
    h+='<button class="btn" data-ask-submit>टेस्ट जमा करें · Submit test</button>';
  }
  h+='<button class="btn ghost" data-go="#/q/'+cid+'/'+CUR.idx+'">← प्रश्नों पर लौटें · Back to questions</button></div>'+
    '<div class="confirm" id="cfm" hidden style="margin-top:16px"><b>क्या आप पक्का जमा करना चाहते हैं? · Are you sure?</b><br>'+
    (un.length||mk.length
      ? 'आपके '+un.length+' प्रश्न अनुत्तरित और '+mk.length+' समीक्षा के लिए चिह्नित हैं।<br>You have '+un.length+' unanswered and '+mk.length+' marked for review.'
      : 'सभी प्रश्न हल हो गए हैं।<br>All questions are answered.')+
    '<div class="stack"><button class="btn" data-submit>हाँ, जमा करें · Yes, submit</button>'+
    '<button class="btn ghost" data-cancel-submit>रद्द करें · Cancel</button></div></div><div class="pad"></div></section>';
  $app.innerHTML=h;
}
function submitTest(){
  var cid=CUR.cid, at=getAt(cid,false); if(!at) return;
  if (REVIEW_OK!==cid) return;                       // submit only valid from the Review screen
  var t=tally(cid,at.ans); if (!t.answered) return;
  var e={ ts:Date.now(), n:t.n, c:t.c, w:t.w, sk:t.skipped, pct:t.n?Math.round(t.c/t.n*100):0, ans:at.ans };
  var h=DB.history[cid]||(DB.history[cid]=[]); h.push(e);
  if (h.length>20) h.shift();
  delete DB.attempts[cid]; save();
  REVIEW_OK=null; closeSheet();
  location.hash='#/r/'+cid+'/'+(h.length-1);
}

/* =========================================================
   POST-TEST ANALYSIS
   ========================================================= */
function resultView(cid, hi, filter){
  var o=chapOf(cid); if(!o||o.ex) return home();
  var e=histOf(cid)[hi]; if(!e) return chapterView(cid);
  var s=o.s, c=o.c, bank=BANK[cid]||[];
  filter = ({all:1,right:1,wrong:1,skip:1})[filter] ? filter : 'all';
  head({back:'#/c/'+cid, title:'परिणाम विश्लेषण · Analysis', crumb:'अध्याय '+c.no+' · '+c.hi, cls:s.cls});
  var base='#/r/'+cid+'/'+hi+'/';
  var h='<section class="view"><div class="rhero"><div class="ring" style="--p:'+e.pct+'"><span>'+e.pct+'%</span></div>'+
    '<h2>स्कोर · Score: '+e.c+' / '+e.n+'</h2><p>'+fmtDate(e.ts)+' · '+esc(c.hi)+' ('+esc(c.en)+')</p></div>'+
    '<div class="stats"><div class="stat ok"><b>'+e.c+'</b><span>सही<br>Correct</span></div>'+
    '<div class="stat bad"><b>'+e.w+'</b><span>गलत<br>Wrong</span></div>'+
    '<div class="stat skip"><b>'+e.sk+'</b><span>छोड़े<br>Skipped</span></div></div>'+
    '<div class="stack"><button class="btn" data-retake="'+cid+'">फिर से टेस्ट दें · Retake</button>'+
    '<button class="btn ghost" data-go="#/c/'+cid+'">अध्याय पर लौटें · Back to chapter</button></div>'+
    '<div class="sec-title">प्रश्नवार समीक्षा · QUESTION REVIEW</div><div class="fchips">';
  [['all','सभी · All'],['right','सही · Correct'],['wrong','गलत · Wrong'],['skip','छोड़े · Skipped']].forEach(function(f){
    h+='<button class="chip" '+(filter===f[0]?'aria-current="true"':'')+' data-go="'+base+f[0]+'">'+f[1]+'</button>';
  });
  h+='</div>';
  var shown=0;
  for (var i=0;i<e.n;i++){
    var m=bank[i]; if(!m) continue;
    var ch=e.ans[i], st = ch===undefined ? 'skip' : (ch===m.a ? 'right' : 'wrong');
    if (filter!=='all' && filter!==st) continue;
    shown++;
    var tag = st==='right' ? 'सही · Correct' : (st==='wrong' ? 'गलत · Wrong' : 'छोड़ा गया · Skipped');
    h+='<article class="rv '+st+'"><div class="rv-top"><span class="qnum">Q'+(i+1)+'</span><span class="tag">'+tag+'</span></div>'+
       '<div class="qtext">'+esc(m.q)+'</div>';
    if (st==='skip') h+='<div class="arow"><small>आपका उत्तर · Your answer</small>उत्तर नहीं दिया · Not answered</div>';
    else h+='<div class="arow '+(st==='right'?'ok':'bad')+'"><small>आपका उत्तर · Your answer</small>('+LET[ch]+') '+esc(m.o[ch])+'</div>';
    if (st!=='right') h+='<div class="arow ok"><small>सही उत्तर · Correct answer</small>('+LET[m.a]+') '+esc(m.o[m.a])+'</div>';
    h+='<div class="expl-in"><div class="elabel" style="margin-top:0">व्याख्या (हिंदी)</div><div class="etext">'+esc(m.eh||'')+'</div>'+
       '<div class="elabel">Explanation (English)</div><div class="etext">'+esc(m.ee||'')+'</div></div></article>';
  }
  if (!shown) h+='<div class="empty"><p>इस श्रेणी में कोई प्रश्न नहीं · No questions in this category</p></div>';
  $app.innerHTML=h+'<div class="pad"></div></section>';
}

/* =========================================================
   EXERCISE
   ========================================================= */
function exerciseView(eid, tab){
  var o=chapOf(eid); if(!o||!o.ex) return home();
  var s=o.s, e=o.c, data=EXERCISE[eid]||{short:[],long:[]};
  tab = tab==='long' ? 'long' : 'short';
  head({back:'#/s/'+s.id, title:e.hi, crumb:s.en+' · '+e.en, cls:s.cls});
  var list=data[tab]||[], total=e[tab];
  var h='<section class="view">'+chips(s,eid)+
    '<div class="chead"><div class="kicker">'+s.hi+'</div><h1>'+e.hi+'</h1><div class="en">'+e.en+'</div></div>'+
    '<div class="seg" role="tablist">'+
    '<button role="tab" aria-selected="'+(tab==='short')+'" data-go="#/e/'+eid+'/short">लघु उत्तरीय · Short ('+e.short+')</button>'+
    '<button role="tab" aria-selected="'+(tab==='long')+'" data-go="#/e/'+eid+'/long">दीर्घ उत्तरीय · Long ('+e.long+')</button></div>';
  if (!list.length) h+='<div class="empty"><div class="ei">'+IC.clock+'</div><h2>प्रश्न जल्द जोड़े जाएँगे</h2><p>'+total+' questions will appear here</p></div>';
  else {
    h+='<ol class="qlist">';
    list.forEach(function(it){
      var q=typeof it==='string'?it:it.q, a=typeof it==='string'?'':(it.a||'');
      h+='<li>'+esc(q)+(a?'<details><summary>उत्तर देखें · Show answer</summary><div class="ans">'+esc(a)+'</div></details>':'')+'</li>';
    });
    h+='</ol>';
  }
  $app.innerHTML=h+'<div class="pad"></div></section>';
}

/* =========================================================
   ROUTER & EVENTS
   ========================================================= */
function route(){
  closeSheet();
  var p=(location.hash||'#/').replace(/^#\/?/,'').split('/');
  window.scrollTo(0,0);
  if (p[0]==='s') subjectView(p[1]);
  else if (p[0]==='c') chapterView(p[1]);
  else if (p[0]==='q') quizView(p[1], parseInt(p[2]||'0',10)||0);
  else if (p[0]==='v') reviewView(p[1]);
  else if (p[0]==='r') resultView(p[1], parseInt(p[2]||'0',10)||0, p[3]);
  else if (p[0]==='e') exerciseView(p[1], p[2]);
  else home();
  var cur=$app.querySelector('.chip[aria-current="true"]');
  if (cur && cur.scrollIntoView) { try{ cur.scrollIntoView({inline:'center',block:'nearest'}); }catch(e){} }
}
document.addEventListener('click', function(ev){
  var t=ev.target, el;
  if ((el=t.closest('[data-close]')))        { closeSheet(); return; }
  if ((el=t.closest('[data-jump]')))         { var i=parseInt(el.getAttribute('data-jump'),10); closeSheet(); location.hash='#/q/'+CUR.cid+'/'+i; return; }
  if (t.closest('[data-review]'))            { REVIEW_OK=CUR.cid; location.hash='#/v/'+CUR.cid; return; }
  if (t.closest('[data-ask-submit]'))        { var cf=document.getElementById('cfm'), ra=document.getElementById('rvActions');
                                               if (cf){ cf.hidden=false; if (ra) ra.hidden=true; try{ cf.scrollIntoView({block:'center',behavior:'smooth'}); }catch(e){} } return; }
  if (t.closest('[data-cancel-submit]'))     { var cf2=document.getElementById('cfm'), ra2=document.getElementById('rvActions');
                                               if (cf2) cf2.hidden=true; if (ra2) ra2.hidden=false; return; }
  if (t.closest('[data-submit]'))            { submitTest(); return; }
  if (t.closest('[data-sheet]'))             { openSheet(); return; }
  if (t.closest('[data-mark]'))              { toggleMark(); return; }
  if ((el=t.closest('[data-pick]')))         { if (!el.disabled) pick(parseInt(el.getAttribute('data-pick'),10)); return; }
  if ((el=t.closest('[data-retake]')))       { var rc=el.getAttribute('data-retake'); delete DB.attempts[rc]; save(); location.hash='#/q/'+rc+'/0'; return; }
  if ((el=t.closest('[data-restart]')))      {
    if (confirm('मौजूदा प्रगति मिट जाएगी। नए सिरे से शुरू करें?\nCurrent progress will be lost. Restart?')){
      var cc=el.getAttribute('data-restart'); delete DB.attempts[cc]; save(); location.hash='#/q/'+cc+'/0';
    } return; }
  if ((el=t.closest('[data-clear]')))        {
    if (confirm('इस अध्याय का पूरा इतिहास मिट जाएगा। जारी रखें?\nAll saved attempts for this chapter will be deleted. Continue?')){
      delete DB.history[el.getAttribute('data-clear')]; save(); route();
    } return; }
  if ((el=t.closest('[data-go]')))           { if (!el.disabled) location.hash=el.getAttribute('data-go'); return; }
});
document.addEventListener('keydown', function(ev){ if (ev.key==='Escape') closeSheet(); });
window.addEventListener('hashchange', route);
route();
</script>
